name: V3 FY2025 Verified Owner Profit Gap Recovery (No Score Promotion)

on:
  push:
    branches: [main]
    paths:
      - v3_owner_profit_completion.py
      - v3_owner_profit_reconciliation.py
      - tests/test_v3_owner_profit_reconciliation.py
      - tests/test_v3_profit_source_quarantine.py
      - tests/test_v3_owner_profit_completion.py
      - v3_dart_2025_owner_profit_probe.py
      - tests/test_v3_dart_2025_owner_profit_probe.py
      - .github/workflows/v3-dart-owner-profit-probe.yml
  # Bounded six x20 audited FY2025 missing-profit candidates per hour. Once the
  # receipt-matched source queue is exhausted, there are ZERO provider requests.
  # One-gap R1d completion targets precede other pending source requests.
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: dry-run
        options: [dry-run, live]
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: korea-stock-screener-v3-2025-owner-profit-gap-recovery
  queue: max
  cancel-in-progress: false

jobs:
  exact-annual-owner-profit-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore asof and roster hash checked official company code source
        uses: actions/cache/restore@v4
        with:
          path: .cache/v3-dart-company-codes.json
          key: v3-dart-corp-map-v1-${{ hashFiles('docs/v22-market-catalog.json') }}
      - name: Offline exact owner profit, official annual receipt and no-zero tests
        run: |
          set -euo pipefail
          python -m py_compile v3_dart_2025_owner_profit_probe.py
          python -m unittest discover -s tests -p 'test_v3_dart_2025_owner_profit_probe.py' -v
          python -m unittest discover -s tests -p 'test_v3_owner_profit_completion.py' -v
          python -m unittest discover -s tests -p 'test_v3_profit_source_quarantine.py' -v
          python -m unittest discover -s tests -p 'test_v3_owner_profit_reconciliation.py' -v
      - name: Wait until receipt-validated source cohort matches closing day
        id: source_day
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path("docs")
          names=("v22-market-catalog.json",
                 "v3-dart-book-reference.json",
                 "v3-near-100-evidence-priority.json")
          docs=[json.loads((root/f).read_text(encoding="utf8")) for f in names]
          day=docs[0]["date"]
          ready=(docs[1].get("asof")==day and
                 docs[2].get("asof")==day and
                 docs[2].get("no_points_added") is True)
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("ready="+("true" if ready else "false")+"\n")
          print("source_status:", "aligned" if ready else "waiting_annual_sources")
          PY
      - name: Install official OpenDART client only for approved live collection
        if: ${{ steps.source_day.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'live') }}
        run: python -m pip install 'requests>=2.31,<3'
      - name: Fetch only authenticated same-issuer 2025 profit accounts
        id: collect
        if: ${{ steps.source_day.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'live') }}
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from v3_owner_profit_reconciliation import checkpoint_count
          p=Path('docs/v3-dart-owner-profit-supplement.json')
          before=checkpoint_count(json.loads(p.read_text())) if p.is_file() else 0
          Path('/tmp/v3-profit-before-count.json').write_text(json.dumps(before))
          PY
          python v3_dart_2025_owner_profit_probe.py --mode live --limit 20 --batches 6 --completion-first --recover-reconciliation | tee /tmp/v3-profit-collection.jsonl
          python - <<'PY'
          import json,os
          from pathlib import Path
          from v3_owner_profit_reconciliation import checkpoint_count,should_resume
          summary=json.loads(Path('/tmp/v3-profit-collection.jsonl').read_text().splitlines()[-1])
          before=json.loads(Path('/tmp/v3-profit-before-count.json').read_text())
          after=checkpoint_count(json.loads(Path('docs/v3-dart-owner-profit-supplement.json').read_text()))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('resume='+str(should_resume(summary,before,after)).lower()+'\n')
          PY
      - name: Publish original-receipt matched derived source, NO score
        if: ${{ steps.source_day.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'live') }}
        run: |
          set -euo pipefail
          python v3_dart_2025_owner_profit_probe.py --mode verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f docs/v3-dart-owner-profit-supplement.json ]]; then
            git add -- docs/v3-dart-owner-profit-supplement.json docs/v3-near-100-evidence-priority.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Verify official FY2025 attributable owner profit source (no point promotion)"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              # Recheck the exact same issuer, year, scope and filing receipt
              # after concurrent market and annual-account publications.
              python v3_dart_2025_owner_profit_probe.py --mode refresh
              python v3_dart_2025_owner_profit_probe.py --mode verify
              git add -- docs/v3-dart-owner-profit-supplement.json docs/v3-near-100-evidence-priority.json
              if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
              if git push origin HEAD:main; then
                echo "official_profit_source_recovery_checkpoint_saved"
                break
              fi
              if [[ "$attempt" == 3 ]]; then
                echo "::error::profit_source_checkpoint_publish_retry_exhausted"
                exit 1
              fi
            done
          fi
      - name: Continue remaining source work immediately after a verified successful publication
        if: steps.collect.outputs.resume == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run v3-dart-owner-profit-probe.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=live
      - name: Evidence and next-source readiness, never buy authorization
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("docs/v3-dart-owner-profit-supplement.json")
          lines=[
            "### V3.0b 100점 전체관측 우선 · 공식 지배주주 순이익 검증",
            "원자료 일치 검증 전에는 점수·순위 변경하지 않습니다.",
            "계정 미확인은 0원이나 0점으로 간주하지 않습니다.",
          ]
          if p.exists():
              source=json.loads(p.read_text(encoding="utf8"))
              for name,key in (
                  ("기준일","market_asof"),
                  ("원천 확인 지배주주 순이익 종목","observed_official_owner_profit_issuers"),
                  ("조회했지만 계정 미확인 종목","missing_standard_account_issuers"),
                  ("통화·접수·금액 검증 실패로 보류한 종목","quarantined_source_account_issuers"),
                  ("원천 확인 대상(기존 이력 포함)","target_95weight_issuers"),
                  ("같은 공시 전체순이익·비지배지분순이익 대조 완료","reconciliation_rechecked_issuers"),
                  ("명시된 두 순이익 항목으로 지배주주 순이익 보완","reconciliation_derived_issuers"),
              ):
                  lines.append(name+": "+str(source.get(key)))
          else:
              lines.append("신규 확인 자료 없음 / 소스 기준일 대기")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(lines)+"\n",encoding="utf8")
          PY
