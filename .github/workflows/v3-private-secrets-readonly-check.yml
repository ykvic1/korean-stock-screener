name: One-time private KRX archive secrets read-only validation
on:
  push:
    branches: [v3-private-secrets-readonly-verify-20261020]
    paths:
      - .github/workflows/v3-private-secrets-readonly-check.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate repository-scoped PAT without logging secrets or writing source
        env:
          PRIVATE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          PRIVATE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
          STORAGE_AUTHORIZED: ${{ vars.V3_KRX_PRIVATE_STORAGE_AUTHORIZED }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re
          from urllib import request
          expected="ykvic1/korean-stock-private-data"
          repo=os.getenv("PRIVATE_REPO","")
          token=os.getenv("PRIVATE_TOKEN","")
          checks={
              "both_secrets_present":bool(repo and token),
              "repo_secret_matches_expected":repo==expected,
              "secret_has_pat_length":len(token)>=35,
              "storage_live_activated":os.getenv("STORAGE_AUTHORIZED")=="true",
          }
          if not all([checks["both_secrets_present"],checks["repo_secret_matches_expected"],checks["secret_has_pat_length"]]):
              print(json.dumps({"status":"blocked","checks":checks},sort_keys=True))
              raise SystemExit(1)
          # Validate via GitHub only. No original KRX HTTP calls, no uploads,
          # no file writes; never print token, raw URLs or vendor exceptions.
          try:
              url="https://api.github.com/repos/"+expected
              req=request.Request(url,headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/vnd.github+json",
                  "User-Agent":"private-archive-credential-readonly-check"})
              with request.urlopen(req,timeout=18) as response:
                  meta=json.loads(response.read(250000))
              checks["token_can_read_private_repo"]=(
                  meta.get("private") is True
                  and meta.get("full_name","").casefold()==expected.casefold())
              permitted=meta.get("permissions",{})
              checks["token_reports_write_permission"]=(
                  isinstance(permitted,dict) and permitted.get("push") is True)
          except Exception:
              checks["token_can_read_private_repo"]=False
              checks["token_reports_write_permission"]=False
          ok=(checks["token_can_read_private_repo"]
              and checks["token_reports_write_permission"])
          print(json.dumps({"status":"verified_readonly" if ok else "blocked",
                            "checks":checks,
                            "source_api_calls":0,
                            "private_source_files_written":0,
                            "secrets_logged":False},sort_keys=True))
          if not ok:raise SystemExit(1)
          PY
