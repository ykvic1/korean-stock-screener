name: V3 One-Shot KRX Historical Legal Gap Ledger 20261123

on:
  push:
    branches: [v30b-official-corporate-gap-ledger-20261123]
    paths:
      - .github/workflows/v3-one-shot-legal-gap-ledger-20261123.yml

permissions:
  contents: read

jobs:
  verify-existing-private-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3' 'pyarrow>=20,<27' 'pandas>=2,<3'
      - name: Negative-case research tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v3_historical_official_holder_gap_ledger.py' -v
      - name: Download immutable original 2025/2026 independent research price sources
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/93713f5a0a80ff29dc10e5aba9c8a51353e0e1b4/data/marcap-2025.parquet -o pilot-2025.parquet
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/24a2bec363aaad0ba2e3494966108995d196702d/data/marcap-2026.parquet -o pilot-2026.parquet
          curl -fsSL --max-time 30 https://raw.githubusercontent.com/FinanceData/fdr_krx_data_cache/05a17038b3cddf7a6f48105913e46fd37d96a21e/data/listing/krx/2026-11-13.csv -o pilot-2026-11-13.csv
      - name: Verify 687 unpriced holder legal-gap dates against 245 archived official CLOSEs
        env:
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/corporate-gap-audit.json"
          python v3_historical_close_archive_audit.py "$RUNNER_TEMP/pilot-2025.parquet" "$RUNNER_TEMP/pilot-2026.parquet" "$RUNNER_TEMP/pilot-2026-11-13.csv" > "$result"
          jq -c .holder_legal_unpriced_gap_ledger "$result" > "$RUNNER_TEMP/corporate-gap-public-aggregate.json"
          jq -e '.holder_legal_unpriced_gap_ledger.all_corporate_action_gaps_accounted_for == true and .holder_legal_unpriced_gap_ledger.eligible_holder_day_cells == 4148 and .holder_legal_unpriced_gap_ledger.unpriced_corporate_gap_holder_date_cells == 687 and .holder_legal_unpriced_gap_ledger.verified_no_original_trade_after_last_trade == 687 and .holder_legal_unpriced_gap_ledger.new_krx_market_api_requests == 0 and .holder_legal_unpriced_gap_ledger.new_private_archive_reads == 0 and .holder_legal_unpriced_gap_ledger.continuous_adjusted_intraday_low_verified == false and .holder_legal_unpriced_gap_ledger.first_intraday_reference_touch_proven == false and .holder_legal_unpriced_gap_ledger.performance_validated == false and .holder_legal_unpriced_gap_ledger.v30b_release_ready == false' "$result" >/dev/null
          jq . "$RUNNER_TEMP/corporate-gap-public-aggregate.json" >> "$GITHUB_STEP_SUMMARY"
          jq -c . "$RUNNER_TEMP/corporate-gap-public-aggregate.json"
      - name: Archive aggregate only, never individual issuer or quote rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-legal-gap-aggregate
          path: ${{ runner.temp }}/corporate-gap-public-aggregate.json
          if-no-files-found: ignore
          retention-days: 90
