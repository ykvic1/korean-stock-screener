name: V3 One Shot Third Pre First LOW 10 Days 20261123

# Branch-only single execution, removed before integration.
# Never re-request dates already frozen in first or second KRX evidence.
on:
  push:
    branches: [v30b-third-pre-first-low-10days-20261123]
    paths: [.github/workflows/v3-one-shot-third-pre-first-low-10days-20261123.yml]

permissions:
  contents: read

concurrency:
  group: v30b-krx-third-low-ten-new-days
  cancel-in-progress: false

jobs:
  exact-ten-new-official-low-market-days:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3' 'pyarrow>=20,<27' 'pandas>=2,<3'
      - name: Strict negative-case tests before contacting official KRX
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v3_historical_pretouch_official_low_third.py' -v
      - name: Download immutable public historical OHLC and corporate inputs
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/93713f5a0a80ff29dc10e5aba9c8a51353e0e1b4/data/marcap-2025.parquet -o pilot-2025.parquet
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/24a2bec363aaad0ba2e3494966108995d196702d/data/marcap-2026.parquet -o pilot-2026.parquet
          curl -fsSL --max-time 30 https://raw.githubusercontent.com/FinanceData/fdr_krx_data_cache/05a17038b3cddf7a6f48105913e46fd37d96a21e/data/listing/krx/2026-11-13.csv -o pilot-2026-11-13.csv
      - name: Verify all three frozen KRX batches without requerying any providers
        run: |
          set -euo pipefail
          python v3_historical_pretouch_official_low_third.py "$RUNNER_TEMP/pilot-2025.parquet" "$RUNNER_TEMP/pilot-2026.parquet" "$RUNNER_TEMP/pilot-2026-11-13.csv" > "$RUNNER_TEMP/third-offline-verified.json"
          jq -e '.pre_touch_public_traded_holder_days == 752 and .pre_touch_holder_days_on_existing_official_ohlc_dates == 308 and .pre_touch_holder_days_without_existing_official_ohlc_date == 444 and .independently_authenticated_new_pre_touch_holder_lows == 140 and .third_batch_additional_original_successor_lows == 58 and .third_batch_new_official_market_days == 10 and .offline_replay_new_krx_market_api_requests == 0 and .first_touch_earliest_low_certified == false and .v30b_release_ready == false' "$RUNNER_TEMP/third-offline-verified.json" >/dev/null
          jq -c . "$RUNNER_TEMP/third-offline-verified.json"
          jq . "$RUNNER_TEMP/third-offline-verified.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Reconcile all 245 market CLOSE sessions and 308 separately verified LOWs
        env:
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
        run: |
          set -euo pipefail
          python v3_historical_close_archive_audit.py "$RUNNER_TEMP/pilot-2025.parquet" "$RUNNER_TEMP/pilot-2026.parquet" "$RUNNER_TEMP/pilot-2026-11-13.csv" > "$RUNNER_TEMP/third-archived-close-audit.json"
          jq -e '.official_sessions_compared == 245 and .pre_first_low_official_ohlc_coverage.pre_touch_holder_days_on_existing_official_ohlc_dates == 308 and .pre_first_low_official_ohlc_coverage.pre_touch_holder_days_without_existing_official_ohlc_date == 444 and .pre_first_low_official_ohlc_coverage.first_touch_earliest_low_certified == false and .pre_first_low_official_ohlc_coverage.v30b_release_ready == false and .new_market_api_calls == 0' "$RUNNER_TEMP/third-archived-close-audit.json" >/dev/null
          jq -c .pre_first_low_official_ohlc_coverage "$RUNNER_TEMP/third-archived-close-audit.json"
      - name: Keep only anonymous aggregate OHLC evidence (never raw share prices)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: third-ten-new-official-pre-first-low-dates
          path: |
            ${{ runner.temp }}/third-offline-verified.json
          if-no-files-found: ignore
          retention-days: 90
