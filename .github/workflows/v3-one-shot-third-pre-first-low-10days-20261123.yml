name: V3 One Shot Third Pre First LOW 10 Days 20261123

# Branch-only single execution, removed before integration.
# Never re-request dates already frozen in first or second KRX evidence.
on:
  push:
    branches: [v30b-third-pre-first-low-10days-20261123]
    paths: [.github/workflows/v3-one-shot-third-pre-first-low-10days-20261123.yml]

permissions:
  contents: read

concurrency:
  group: v30b-krx-third-low-ten-new-days
  cancel-in-progress: false

jobs:
  exact-ten-new-official-low-market-days:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3' 'pyarrow>=20,<27' 'pandas>=2,<3'
      - name: Strict negative-case tests before contacting official KRX
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v3_historical_pretouch_official_low_third.py' -v
      - name: Download immutable public historical OHLC and corporate inputs
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/93713f5a0a80ff29dc10e5aba9c8a51353e0e1b4/data/marcap-2025.parquet -o pilot-2025.parquet
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/24a2bec363aaad0ba2e3494966108995d196702d/data/marcap-2026.parquet -o pilot-2026.parquet
          curl -fsSL --max-time 30 https://raw.githubusercontent.com/FinanceData/fdr_krx_data_cache/05a17038b3cddf7a6f48105913e46fd37d96a21e/data/listing/krx/2026-11-13.csv -o pilot-2026-11-13.csv
      - name: Prior authenticated 250 official holder LOWs and next ten target dates
        run: |
          set -euo pipefail
          python v3_historical_pretouch_official_low_third.py "$RUNNER_TEMP/pilot-2025.parquet" "$RUNNER_TEMP/pilot-2026.parquet" "$RUNNER_TEMP/pilot-2026-11-13.csv" > "$RUNNER_TEMP/third-prior-verified.json"
          jq -e '.pre_touch_public_traded_holder_days == 752 and .pre_touch_holder_days_on_existing_official_ohlc_dates == 250 and .pre_touch_holder_days_without_existing_official_ohlc_date == 502 and .bounded_next_issuer_low_observations == 30 and .first_touch_earliest_low_certified == false and .v30b_release_ready == false' "$RUNNER_TEMP/third-prior-verified.json" >/dev/null
          jq -c . "$RUNNER_TEMP/third-prior-verified.json"
      - name: Collect maximum two sequential five-date official KRX batches and 20 market requests
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          set -euo pipefail
          python v3_historical_pretouch_official_low_third.py "$RUNNER_TEMP/pilot-2025.parquet" "$RUNNER_TEMP/pilot-2026.parquet" "$RUNNER_TEMP/pilot-2026-11-13.csv" --probe > "$RUNNER_TEMP/third-ten-day-low-evidence.json"
          jq -e '.previously_authenticated_holder_lows == 250 and .new_official_market_days == 10 and .maximum_official_krx_market_requests == 20 and .new_official_traded_holder_lows >= 50 and (.two_five_day_batches|length) == 2 and .first_touch_earliest_low_certified == false and .all_prior_official_lows_covered == false and .performance_validated == false and .v30b_release_ready == false' "$RUNNER_TEMP/third-ten-day-low-evidence.json" >/dev/null
          jq '{schema,previously_authenticated_holder_lows,new_official_market_days,new_official_traded_holder_lows,maximum_official_krx_market_requests,first_touch_earliest_low_certified,performance_validated,v30b_release_ready}' "$RUNNER_TEMP/third-ten-day-low-evidence.json" >> "$GITHUB_STEP_SUMMARY"
          jq -c . "$RUNNER_TEMP/third-ten-day-low-evidence.json"
      - name: Keep only anonymous aggregate OHLC evidence (never raw share prices)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: third-ten-new-official-pre-first-low-dates
          path: |
            ${{ runner.temp }}/third-prior-verified.json
            ${{ runner.temp }}/third-ten-day-low-evidence.json
          if-no-files-found: ignore
          retention-days: 90
