name: V3 KRX Official Close Momentum Recovery (90 First)

on:
  push:
    branches: [main]
    paths:
      - v3_krx_close_momentum_recovery.py
      - .github/workflows/v3-krx-close-momentum-recovery.yml
  pull_request:
    paths:
      - v3_krx_close_momentum_recovery.py
      - tests/test_v3_krx_close_momentum_recovery.py
      - .github/workflows/v3-krx-close-momentum-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: korea-stock-screener-publication
  cancel-in-progress: false

jobs:
  source_contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt 'exchange-calendars==4.13.1'
      - run: python -m unittest tests.test_v3_krx_close_momentum_recovery -v

  recover:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt 'exchange-calendars==4.13.1'
      - name: Observe exact dated 121-session closing paths
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python v3_krx_close_momentum_recovery.py
      - name: Validate and publish derived momentum observations
        id: publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          snapshot_sha=$(git rev-parse HEAD:docs/data.json)
          if ! git diff --quiet -- docs/data.json; then
            python v22_full_universe_audit.py --daily docs/data.json
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          git add docs/data.json docs/v3-krx-close-momentum-recovery.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish official close-derived 121-session momentum observations'
          git fetch origin main
          if [[ $(git rev-parse origin/main:docs/data.json) != "$snapshot_sha" ]]; then
            echo 'Saved market changed during KRX recovery.' >&2
            exit 1
          fi
          git rebase origin/main
          git push origin HEAD:main
      - name: Refresh the operational scorecard
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run v3-operational-research-score.yml --repo "$GITHUB_REPOSITORY" --ref main
