name: KRX two-market historical daily pilot (manual only)

on:
  workflow_dispatch:
    inputs:
      dates:
        description: '1-5 ascending COMPLETE KRX weekdays YYYY-MM-DD, separated by commas (holidays rejected by source)'
        required: true
        type: string
        default: '2026-10-15,2026-10-16'
      mode:
        description: 'Dry-run without any KRX calls (default), or live bounded KRX pair requests'
        required: true
        type: choice
        options: [dry_run, live]
        default: dry_run

permissions:
  contents: read

concurrency:
  group: krx-historical-pilot
  cancel-in-progress: false

jobs:
  two-market-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install KRX read-only client dependency
        run: python -m pip install 'requests>=2.31,<3'
      - name: Offline history validation and privacy regression (no key/network)
        run: python -m unittest discover -s tests -p 'test_v3_krx_history_collection.py' -v
      - name: Run bounded historical pair pilot; raw source NOT saved on runner
        env:
          PILOT_DATES: ${{ inputs.dates }}
          PILOT_MODE: ${{ inputs.mode }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--dates "$PILOT_DATES" --output evidence/krx_history/summary.json)
          if [[ "$PILOT_MODE" == live ]]; then
            args+=(--live)
          fi
          # No --private-db: ephemeral GitHub runner is not durable KRX archive.
          # No scheduled event and no public docs/ file modifications.
          python -m v3_krx_history_collection "${args[@]}"
      - name: Report sanitized result or failure context without raw vendor data
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          path=Path('evidence/krx_history/summary.json')
          if not path.is_file():
              print('::warning::KRX history pilot did not create a diagnostic summary.')
              raise SystemExit(0)
          try:
              d=json.loads(path.read_text(encoding='utf-8'))
          except (OSError, ValueError, UnicodeError):
              print('::warning::KRX history pilot summary unreadable.')
              raise SystemExit(0)
          if d.get('status') == 'blocked':
              market=d.get('failed_market')
              day=d.get('failed_date')
              reason=d.get('reason')
              market=market if market in ('KOSPI','KOSDAQ') else 'unavailable'
              reason=(reason if isinstance(reason,str) and
                      re.fullmatch(r'[a-z0-9_]{1,100}',reason) else 'unknown')
              day=(day if isinstance(day,str) and
                   re.fullmatch(r'[0-9]{4}-[0-9]{2}-[0-9]{2}',day) else 'unavailable')
              n=d.get('completed_pairs_before_failure')
              n=n if type(n) is int and 0 <= n <= 5 else 0
              print('::warning::KRX history blocked: date='+day+' market='+market+
                    ' reason='+reason+' prior_complete_days='+str(n))
              counts=d.get('code_anomaly_counts')
              labels=('missing_code','non_string_code','non_six_digit_code',
                      'duplicate_six_digit_code','prefixed_six_digit_pattern',
                      'twelve_character_pattern')
              if (isinstance(counts,dict) and set(counts)==set(labels)
                      and all(type(counts[k]) is int and 0<=counts[k]<=20000 for k in labels)):
                  print('::warning::KRX identity shapes: '+
                        ' '.join(k+'='+str(counts[k]) for k in labels)+
                        ' (raw identifiers withheld)')

          else:
              n=d.get('observed_days')
              n=n if type(n) is int and 0 <= n <= 5 else 0
              print('::notice::KRX paired-day pilot finished, paired_days='+str(n)+
                    '; investment eligibility remains false.')
          PY
      - name: Keep research-only counts and SHA manifest as a private seven-day artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-historical-pilot-${{ github.run_id }}
          path: evidence/krx_history/summary.json
          if-no-files-found: warn
          retention-days: 7
