name: V3 One-Shot Second Pre-First LOW KRX 20261123

# Branch-only, removed after success. Exactly five newly missing sessions.
# Rerun after fixing mocked Path.exists in offline unit test.
on:
  push:
    branches: [v30b-second-pre-touch-low-20261123]
    paths: [.github/workflows/v3-one-shot-second-pre-first-low-20261123.yml]

permissions:
  contents: read

concurrency:
  group: v30b-one-shot-second-pre-first-low-five-sessions
  cancel-in-progress: false

jobs:
  check-five-more-official-low-days:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3' 'pyarrow>=20,<27' 'pandas>=2,<3'
      - name: Negative-case tests no repeated KRX calls
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v3_historical_pretouch_official_low_second.py' -v
      - name: Fetch immutable historical public inputs
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/93713f5a0a80ff29dc10e5aba9c8a51353e0e1b4/data/marcap-2025.parquet -o pilot-2025.parquet
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/24a2bec363aaad0ba2e3494966108995d196702d/data/marcap-2026.parquet -o pilot-2026.parquet
          curl -fsSL --max-time 30 https://raw.githubusercontent.com/FinanceData/fdr_krx_data_cache/05a17038b3cddf7a6f48105913e46fd37d96a21e/data/listing/krx/2026-11-13.csv -o pilot-2026-11-13.csv
      - name: Derive second batch from authenticated first KRX proof offline
        run: |
          set -euo pipefail
          python v3_historical_pretouch_official_low_second.py "$RUNNER_TEMP/pilot-2025.parquet" "$RUNNER_TEMP/pilot-2026.parquet" "$RUNNER_TEMP/pilot-2026-11-13.csv" > "$RUNNER_TEMP/second-prior-worklist.json"
          jq -e '.pre_touch_holder_days_on_existing_official_ohlc_dates == 215 and .pre_touch_holder_days_without_existing_official_ohlc_date == 537 and .bounded_next_issuer_low_observations == 35 and .first_touch_earliest_low_certified == false and .v30b_release_ready == false' "$RUNNER_TEMP/second-prior-worklist.json" >/dev/null
      - name: Revalidate 35 frozen official KRX LOWs in second batch without API calls
        run: |
          set -euo pipefail
          python v3_historical_pretouch_official_low_second.py "$RUNNER_TEMP/pilot-2025.parquet" "$RUNNER_TEMP/pilot-2026.parquet" "$RUNNER_TEMP/pilot-2026-11-13.csv" > "$RUNNER_TEMP/second-offline-verified.json"
          jq -e '.pre_touch_public_traded_holder_days == 752 and .pre_touch_holder_days_on_existing_official_ohlc_dates == 250 and .pre_touch_holder_days_without_existing_official_ohlc_date == 502 and .independently_authenticated_new_pre_touch_holder_lows == 82 and .second_batch_additional_original_successor_lows == 35 and .offline_replay_new_krx_market_api_requests == 0 and .first_touch_earliest_low_certified == false and .v30b_release_ready == false' "$RUNNER_TEMP/second-offline-verified.json" >/dev/null
          jq . "$RUNNER_TEMP/second-offline-verified.json" >> "$GITHUB_STEP_SUMMARY"
          jq -c . "$RUNNER_TEMP/second-offline-verified.json"
      - name: Re-audit all 245 archived market CLOSE sessions plus new direct LOW evidence
        env:
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
        run: |
          set -euo pipefail
          python v3_historical_close_archive_audit.py "$RUNNER_TEMP/pilot-2025.parquet" "$RUNNER_TEMP/pilot-2026.parquet" "$RUNNER_TEMP/pilot-2026-11-13.csv" > "$RUNNER_TEMP/second-low-full-market-audit.json"
          jq -e '.official_sessions_compared == 245 and .pre_first_low_official_ohlc_coverage.pre_touch_holder_days_on_existing_official_ohlc_dates == 250 and .pre_first_low_official_ohlc_coverage.pre_touch_holder_days_without_existing_official_ohlc_date == 502 and .pre_first_low_official_ohlc_coverage.first_touch_earliest_low_certified == false and .pre_first_low_official_ohlc_coverage.v30b_release_ready == false and .new_market_api_calls == 0' "$RUNNER_TEMP/second-low-full-market-audit.json" >/dev/null
          jq -c .pre_first_low_official_ohlc_coverage "$RUNNER_TEMP/second-low-full-market-audit.json"
      - name: Retain only non-identifying official marketwide hash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: second-pre-first-low-krx-evidence
          path: |
            ${{ runner.temp }}/second-prior-worklist.json
            ${{ runner.temp }}/second-offline-verified.json
          if-no-files-found: ignore
          retention-days: 90
