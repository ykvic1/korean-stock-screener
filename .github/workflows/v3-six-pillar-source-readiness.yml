name: V3 Six-Pillar Source Readiness Audit (offline)

on:
  workflow_dispatch:
  # Independent morning watchdog (Tue-Sat 07:00 KST), including nights when
  # a previous 18:30 batch failed and thus emitted no successful workflow_run.
  schedule:
    - cron: '0 22 * * 1-5'
  # Recheck current saved evidence after the real weekday 18:30 full-market
  # publisher completes. Runs zero extra exchange/DART API calls.
  workflow_run:
    workflows: ['Full-Market 100-Stock Batches']
    types: [completed]
  # Recheck read-only whenever the diagnostic itself changes on main.
  push:
    branches: [main]
    paths:
      - 'v3_six_pillar_source_readiness.py'
      - 'v3_continuous_quality_watch.py'
      - 'v3_dart_four_year_reference.py'
      - 'v3_dart_offline_lag_plan.py'
      - '.github/workflows/v3-six-pillar-source-readiness.yml'

permissions:
  contents: read

concurrency:
  group: v3-offline-source-readiness-audit
  cancel-in-progress: false

jobs:
  audited-source-inventory:
    # An audit-only manual market run or an upstream failed/unfinished scan
    # cannot certify that there is a new market snapshot. Never mislabel it.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out currently published source snapshots
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Use standard-library Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit date and source coverage without guessing investment scores
        run: |
          python v3_six_pillar_source_readiness.py \
            --market docs/data.json \
            --catalog docs/v22-market-catalog.json \
            --book docs/v3-dart-book-reference.json \
            --output reports/v3-source-readiness.json
      - name: Independently check source age, full-market coverage and V3 daily + weekly hooks
        if: always()
        shell: bash
        run: |
          python v3_continuous_quality_watch.py \
            --market docs/data.json \
            --catalog docs/v22-market-catalog.json \
            --book docs/v3-dart-book-reference.json \
            --four-year docs/v3-dart-four-year-reference.json \
            --output reports/v3-continuous-quality-watch.json \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Offline bounded four-year DART cohort plan from actual published issuer list
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          from v3_dart_offline_lag_plan import report
          inputs={}
          for name,path in (
              ('market','docs/data.json'),
              ('catalog','docs/v22-market-catalog.json'),
              ('book','docs/v3-dart-book-reference.json')):
              inputs[name]=json.loads(Path(path).read_text(encoding='utf8'))
          prior_path=Path('docs/v3-dart-four-year-reference.json')
          prior=json.loads(prior_path.read_text(encoding='utf8')) if prior_path.exists() else None
          data=report(inputs['market'],inputs['catalog'],inputs['book'],
                      prior=prior,limit=2)
          Path('reports').mkdir(exist_ok=True)
          Path('reports/v3-fouryear-offline-plan.json').write_text(
              json.dumps(data,indent=2,sort_keys=True),encoding='utf8')
          print('Four-year offline cohort status:',json.dumps(data))
          PY
      - name: Preserve reports even if severe source-quality issue trips CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-six-pillar-source-readiness-${{ github.run_id }}
          path: |
            reports/v3-source-readiness.json
            reports/v3-continuous-quality-watch.json
            reports/v3-fouryear-offline-plan.json
          if-no-files-found: warn
          retention-days: 14
