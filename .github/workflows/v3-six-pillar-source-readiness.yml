name: V3 Six-Pillar Source Readiness Audit (offline)

on:
  workflow_dispatch:
  # Recheck current saved evidence after the real weekday 18:30 full-market
  # publisher completes. Runs zero extra exchange/DART API calls.
  workflow_run:
    workflows: ['Full-Market 100-Stock Batches']
    types: [completed]
  # Recheck read-only whenever the diagnostic itself changes on main.
  push:
    branches: [main]
    paths:
      - 'v3_six_pillar_source_readiness.py'
      - '.github/workflows/v3-six-pillar-source-readiness.yml'

permissions:
  contents: read

concurrency:
  group: v3-offline-source-readiness-audit
  cancel-in-progress: false

jobs:
  audited-source-inventory:
    # An audit-only manual market run or an upstream failed/unfinished scan
    # cannot certify that there is a new market snapshot. Never mislabel it.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out currently published source snapshots
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Use standard-library Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit date and source coverage without guessing investment scores
        run: |
          python v3_six_pillar_source_readiness.py \
            --market docs/data.json \
            --catalog docs/v22-market-catalog.json \
            --book docs/v3-dart-book-reference.json \
            --output reports/v3-source-readiness.json
      - name: Save private diagnostic artifact only
        uses: actions/upload-artifact@v4
        with:
          name: v3-six-pillar-source-readiness-${{ github.run_id }}
          path: reports/v3-source-readiness.json
          if-no-files-found: error
          retention-days: 14
