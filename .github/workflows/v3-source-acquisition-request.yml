name: V3 Explicit Source Acquisition Request
on:
  push:
    branches: [main]
    paths: [ops/source-acquisition-request.json]
permissions:
  contents: read
  actions: write
concurrency:
  group: v3-explicit-source-acquisition-request
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute the recorded same-date source operation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python v3_source_acquisition_request.py
