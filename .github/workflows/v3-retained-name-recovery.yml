name: V3 Verified Same-Close Name Retention Recovery
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: v3-operational-research-score-publisher
  queue: max
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          ref: 38dc699f09de6cbb45757b1639f668ef72ccb6da
          path: .retained-before-label-change
          persist-credentials: false
          sparse-checkout: |
            docs/v3-operational-research-scores.json
            docs/v3-dart-book-reference.json
            docs/v3-dart-bulk-history.json
          sparse-checkout-cone-mode: false
      - name: Restore only unchanged-issuer prior observations from a published snapshot
        run: |
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          from v3_operational_research_score import unchanged_fiscal_identity
          root=Path('docs');read=lambda n:json.loads((root/n).read_text())
          old=json.loads(Path('.retained-before-label-change/docs/v3-operational-research-scores.json').read_text())
          current=read('v3-operational-research-scores.json');catalog=read('v22-market-catalog.json')
          book=read('v3-dart-book-reference.json');history=read('v3-dart-bulk-history.json')
          hashes={n:sha256((root/n).read_bytes()).hexdigest() for n in
              ('v3-dart-book-reference.json','v3-dart-bulk-history.json')}
          assert current['asof']==old['asof']==catalog['date']=='2026-11-06'
          saved=Path('.retained-before-label-change/docs')
          old_book=json.loads((saved/'v3-dart-book-reference.json').read_text())
          old_history=json.loads((saved/'v3-dart-bulk-history.json').read_text())
          for filename in hashes:
              assert sha256((saved/filename).read_bytes()).hexdigest()==old['source_hashes'][filename]
          old_books={row['code']:row for row in old_book['records']}
          books={row['code']:row for row in book['records']}
          restored=[]
          for member in catalog['rows']:
              prior=old['rows'].get(member['code'])
              if prior is None or prior['name']==member['name']:continue
              code=member['code']
              # Other issuers may update the file: prove THIS issuer's
              # official receipt and every archived fact stayed identical.
              assert old_books[code]['annual']==books[code]['annual']
              assert old_history['records'][code]==history['records'][code]
              rebound={**old,'source_hashes':{**old['source_hashes'],**hashes}}
              assert unchanged_fiscal_identity(code,member,prior,catalog['date'],rebound,hashes,book,history)
              current['rows'][member['code']]=prior
              restored.append(member['code'])
          assert set(restored)=={'000040','148250'}
          current['source_hashes'].update(hashes)
          (root/'v3-operational-research-scores.json').write_text(json.dumps(current,ensure_ascii=False),encoding='utf8')
          print(json.dumps({'verified_same_close_name_continuity':restored,'financial_source_values_changed':False}))
          PY
          python v3_operational_research_score.py
          python v3_operational_evidence_priority.py
          python v3_operational_model_diagnostics.py
      - name: Publish independently reconciled scores and their observation history
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          paths=(docs/v3-operational-research-scores.json docs/v3-operational-research-scores.csv docs/v3-operational-research-comparison.json docs/v3-operational-evidence-priority.json docs/v3-operational-model-diagnostics.json docs/score-history/)
          git add "${paths[@]}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Retain same-issuer dated observations across verified display-name changes'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            python v3_operational_research_score.py
            python v3_operational_evidence_priority.py
            python v3_operational_model_diagnostics.py
            git add "${paths[@]}"
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Refresh the published dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
