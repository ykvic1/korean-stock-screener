name: V3.0b Historical Official Close Archive Audit

on:
  push:
    branches: [main]
    paths:
      - v3_historical_close_archive_audit.py
      - v3_historical_official_share_event_anchors.py
      - ops/v3-performance-reviewed-share-actions-20251113.csv
      - v3_historical_downside_official_ohlc_evidence.py
      - v3_historical_extreme_direct_low_evidence.py
      - v3_historical_pilot_official_prices.py
      - ops/v3-historical-turnover-corroboration-20261117.json
      - ops/v3-historical-turnover-corroboration-20261122.json
      - ops/v3-historical-extreme-direct-low-20261122.json
      - tests/test_v3_historical_extreme_direct_low_evidence.py
      - v3_historical_prior_direct_low_evidence.py
      - ops/v3-historical-prior-extreme-direct-low-20261122.json
      - tests/test_v3_historical_prior_direct_low_evidence.py
      - v3_historical_reference_touch_direct_probe.py
      - v3_historical_reference_touch_direct_low_evidence.py
      - ops/v3-historical-first-touch-official-low-20261122.json
      - ops/v3-performance-downside-reference-20251113.csv
      - tests/test_v3_historical_reference_touch_direct_probe.py
      - tests/test_v3_historical_reference_touch_direct_low_evidence.py
      - ops/v3-performance-downside-horizons-20251113.csv
      - .github/workflows/v3-historical-close-archive-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v30b-historical-close-archive-audit
  cancel-in-progress: false

jobs:
  archived-closes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3' 'pyarrow>=20,<27' 'pandas>=2,<3'
      - name: Download pinned public replay inputs
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/93713f5a0a80ff29dc10e5aba9c8a51353e0e1b4/data/marcap-2025.parquet -o pilot-2025.parquet
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/24a2bec363aaad0ba2e3494966108995d196702d/data/marcap-2026.parquet -o pilot-2026.parquet
          curl -fsSL --max-time 30 https://raw.githubusercontent.com/FinanceData/fdr_krx_data_cache/05a17038b3cddf7a6f48105913e46fd37d96a21e/data/listing/krx/2026-11-13.csv -o pilot-2026-11-13.csv
      - name: Quantify existing authenticated historical OHLC coverage without provider calls
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/historical-downside-official-ohlc-coverage.json"
          python v3_historical_downside_official_ohlc_evidence.py > "$result"
          jq . "$result" >> "$GITHUB_STEP_SUMMARY"
          jq -c . "$result"
      - name: Validate pinned exact-security KRX downside LOW evidence (offline)
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v3_historical_extreme_direct_low_evidence.py' -v
          result="$RUNNER_TEMP/historical-extreme-direct-low-coverage.json"
          python v3_historical_extreme_direct_low_evidence.py > "$result"
          jq -e '.new_direct_low_compared_dates == 27 and .direct_low_trading_symbol_date_pairs == 33 and .prior_41_horizons_marketwide_day_only_not_directly_authenticated == 41 and .historical_adjusted_path_certified == false and .point_in_time_scores_verified == false and .performance_validated == false and .v30b_release_ready == false' "$result" >/dev/null
          jq . "$result" >> "$GITHUB_STEP_SUMMARY"
          jq -c . "$result"
      - name: Reconcile all 35 historical extrema at exact originating or successor security LOW (offline)
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v3_historical_prior_direct_low_evidence.py' -v
          result="$RUNNER_TEMP/historical-all-extreme-direct-low-coverage.json"
          python v3_historical_prior_direct_low_evidence.py > "$result"
          jq -e '.prior_marketwide_only_dates_now_exact_security_checked == 8 and .previously_exact_security_checked_dates == 27 and .all_35_extreme_dates_direct_security_checked == 35 and .all_extreme_trading_security_date_pairs == 53 and .all_85_horizon_extreme_dates_directly_checked == 85 and .regular_only_volume_verified == false and .historical_adjusted_path_certified == false and .point_in_time_scores_verified == false and .performance_validated == false and .v30b_release_ready == false' "$result" >/dev/null
          jq . "$result" >> "$GITHUB_STEP_SUMMARY"
          jq -c . "$result"
      - name: Validate independently pinned original and successor reference-line LOW (offline)
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v3_historical_reference_touch_direct_probe.py' -v
          python -m unittest discover -s tests -p 'test_v3_historical_reference_touch_direct_low_evidence.py' -v
          result="$RUNNER_TEMP/historical-reference-touch-direct-low-coverage.json"
          python v3_historical_reference_touch_direct_low_evidence.py > "$result"
          jq -e '.newly_verified_first_touch_security_days == 11 and .unique_new_official_first_touch_dates == 10 and .all_reported_first_touch_security_days_with_exact_ohlc == 14 and .new_provider_calls_in_readonly_replay == 0 and .first_touch_is_earliest_trade_proven == false and .pre_touch_complete_adjusted_path_verified == false and .regular_only_volume_verified == false and .historical_point_in_time_scores_certified == false and .performance_validated == false and .v30b_release_ready == false' "$result" >/dev/null
          jq . "$result" >> "$GITHUB_STEP_SUMMARY"
          jq -c . "$result"
      - name: Compare closes, listed shares and observable trade status
        env:
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/historical-close-archive-audit.json"
          python v3_historical_close_archive_audit.py "$RUNNER_TEMP/pilot-2025.parquet" "$RUNNER_TEMP/pilot-2026.parquet" "$RUNNER_TEMP/pilot-2026-11-13.csv" > "$result"
          jq 'del(.by_session)' "$result" >> "$GITHUB_STEP_SUMMARY"
          jq -c 'del(.by_session)' "$result"
      - name: Retain aggregate comparisons and official source fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-close-archive-audit
          path: |
            ${{ runner.temp }}/historical-close-archive-audit.json
            ${{ runner.temp }}/historical-downside-official-ohlc-coverage.json
            ${{ runner.temp }}/historical-extreme-direct-low-coverage.json
            ${{ runner.temp }}/historical-all-extreme-direct-low-coverage.json
            ${{ runner.temp }}/historical-reference-touch-direct-low-coverage.json
          if-no-files-found: ignore
          retention-days: 90
