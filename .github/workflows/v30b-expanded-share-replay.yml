name: Frozen historical share adjustment replay
on:
  push:
    branches: [v30b-fixed-snapshot-verification-expansion]
    paths: [.github/workflows/v30b-expanded-share-replay.yml]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3' 'pyarrow>=20,<27' 'pandas>=2,<3'
      - name: Download fixed public replay inputs
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/93713f5a0a80ff29dc10e5aba9c8a51353e0e1b4/data/marcap-2025.parquet -o pilot-2025.parquet
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/24a2bec363aaad0ba2e3494966108995d196702d/data/marcap-2026.parquet -o pilot-2026.parquet
          curl -fsSL --max-time 30 https://raw.githubusercontent.com/FinanceData/fdr_krx_data_cache/05a17038b3cddf7a6f48105913e46fd37d96a21e/data/listing/krx/2026-11-13.csv -o pilot-2026-11-13.csv
      - name: Recompute historical units and price paths from pinned market panels
        run: |
          set -euo pipefail
          python v3_historical_market_share_actions.py "$RUNNER_TEMP/pilot-2025.parquet" "$RUNNER_TEMP/pilot-2026.parquet" "$RUNNER_TEMP/pilot-2026-11-13.csv" --verify ops/v3-performance-market-share-action-replay-20251113.json > "$RUNNER_TEMP/share-replay.json"
          jq '{signal_session, entry_session, events:(.matched_events|length), incorporated:([.matched_events[]|select(.incorporated_into_path)]|length), official_adjusted_history_verified}' "$RUNNER_TEMP/share-replay.json"
