name: One-off KRX private derived-only 40-session retry verification
on:
  push:
    branches: [v3-krx-after-readback-fix-live-20261021]
    paths:
      - .github/workflows/v3-krx-readback-postfix-20261021-once.yml

permissions:
  contents: read

concurrency:
  group: v3-krx-private-derived-history
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-krx-after-readback-fix-live-20261021
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing official KRX source/calendar dependencies
        run: python -m pip install 'requests>=2.31,<3' 'exchange-calendars==4.13.1'
      - name: No-raw source, replay, late GitHub readback and corruption regression
        run: |
          set -euo pipefail
          python -m py_compile v3_krx_private_github_backfill.py v3_krx_derived_5day.py v3_krx_derived_backfill.py
          python -m unittest discover -s tests -p 'test_v3_krx_derived_5day.py' -v
          python -m unittest discover -s tests -p 'test_v3_krx_derived_backfill.py' -v
      - name: Resume real historical 5-session private factors with only derived values saved
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
          V3_DERIVED_BATCH_WINDOWS: "8"
        run: |
          set -euo pipefail
          python v3_krx_derived_backfill.py
