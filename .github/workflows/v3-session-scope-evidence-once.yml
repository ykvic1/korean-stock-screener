name: V3 KRX and NXT dated session-scope evidence
on:
  push:
    branches: [v30b-audit-session-scope-20261123]
    paths: [.github/workflows/v3-session-scope-evidence-once.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        asof: ['2026-11-19', '2026-11-20']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'pandas>=2,<3'
      - name: Compare dated aggregate evidence
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          MARKET_DATE: ${{ matrix.asof }}
        run: python v3_nxt_session_volume_probe.py --mode live --asof "$MARKET_DATE" --compare-krx
