name: V3 Early Operational Research Score R1a (Saved Sources Only)

on:
  pull_request:
    paths:
      - v3_operational_research_score.py
      - docs/operational-score.js
      - tests/test_v3_operational_research_score.py
      - .github/workflows/v3-operational-research-score.yml
  push:
    branches: [main]
    paths:
      - v3_operational_research_score.py
      - docs/operational-score.js
      - .github/workflows/v3-operational-research-score.yml
  workflow_run:
    workflows:
      - V3 Current Close All-Listed Observed Partial CSV (live source ceiling)
    types: [completed]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python v3_operational_research_score.py
      - run: python -m unittest discover -s tests -p 'test_v3_operational_research_score.py' -v
      - run: node --check docs/operational-score.js
  publish:
    needs: offline
    if: >-
      ${{ github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_run' ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: v3-operational-research-score-publisher
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recompute from saved ledgers without provider calls or collection locks
        run: python v3_operational_research_score.py
      - name: Publish parallel model and append versioned observations
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git add docs/v3-operational-research-scores.json docs/v3-operational-research-scores.csv docs/v3-operational-research-comparison.json docs/score-history/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish parallel R1a operational research scores from saved inputs'
            git pull --rebase origin main
            # Re-read newly merged input data before publishing; a failure
            # leaves the previously published scores untouched.
            python v3_operational_research_score.py
            git add docs/v3-operational-research-scores.json docs/v3-operational-research-scores.csv docs/v3-operational-research-comparison.json docs/score-history/
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
