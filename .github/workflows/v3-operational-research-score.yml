name: V3 Operational Research Score R1d (Saved Sources Only)

on:
  pull_request:
    paths:
      - v3_verified_eps_basis.py
      - tests/test_v3_verified_eps_basis.py
      - v3_dart_revenue_2023_comparative.py
      - tests/test_v3_dart_revenue_2023_comparative.py
      - v3_dart_revenue_2022.py
      - tests/test_v3_dart_revenue_2022.py
      - v3_pages_deployment_retry.py
      - tests/test_v3_pages_deployment_retry.py
      - v3_revenue_growth_evidence.py
      - tests/test_v3_revenue_growth_evidence.py
      - v3_operational_model_diagnostics.py
      - tests/test_v3_operational_model_diagnostics.py
      - v3_operational_evidence_priority.py
      - tests/test_v3_operational_evidence_priority.py
      - v3_operational_research_score.py
      - v3_ma_slope_transition.py
      - v3_actual_money_structure.py
      - v3_breakout_followthrough.py
      - docs/operational-score.js
      - tests/test_v3_operational_research_score.py
      - tests/test_v3_ma_slope_transition.py
      - tests/test_v3_breakout_followthrough.py
      - .github/workflows/v3-operational-research-score.yml
  push:
    branches: [main]
    paths:
      - v3_verified_eps_basis.py
      - tests/test_v3_verified_eps_basis.py
      - v3_dart_revenue_2023_comparative.py
      - tests/test_v3_dart_revenue_2023_comparative.py
      - v3_dart_revenue_2022.py
      - tests/test_v3_dart_revenue_2022.py
      - v3_pages_deployment_retry.py
      - tests/test_v3_pages_deployment_retry.py
      - v3_revenue_growth_evidence.py
      - tests/test_v3_revenue_growth_evidence.py
      - v3_operational_model_diagnostics.py
      - tests/test_v3_operational_model_diagnostics.py
      - v3_operational_evidence_priority.py
      - tests/test_v3_operational_evidence_priority.py
      - v3_operational_research_score.py
      - v3_ma_slope_transition.py
      - v3_actual_money_structure.py
      - v3_breakout_followthrough.py
      - docs/operational-score.js
      - .github/workflows/v3-operational-research-score.yml
  workflow_run:
    workflows:
      - V3 Latest Annual EPS Share-Basis Audit
      - V3 DART FY2023 Strict Comparative Revenue Recovery
      - V3 DART 2022 Receipt-Matched Revenue Recovery
      - V3 Current Close All-Listed Observed Partial CSV (live source ceiling)
      - Full-Market 100-Stock Batches
      - V3 Actual Money Personal Participation Score
    types: [completed]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconcile the retained issuer ledger in the offline workspace
        run: python v3_current_observed_scorecard.py --mode write --refresh-derived
      - run: |
          python v3_operational_research_score.py
          python v3_operational_evidence_priority.py
          python v3_operational_model_diagnostics.py
      - run: python -m unittest discover -s tests -p 'test_v3_verified_eps_basis.py' -v
      - run: python -m unittest discover -s tests -p 'test_v3_revenue_growth_evidence.py' -v
      - run: python -m unittest discover -s tests -p 'test_v3_operational_model_diagnostics.py' -v
      - run: python -m unittest discover -s tests -p 'test_v3_operational_evidence_priority.py' -v
      - run: python -m unittest discover -s tests -p 'test_v3_operational_research_score.py' -v
      - run: python -m unittest discover -s tests -p 'test_v3_breakout_followthrough.py' -v
      - run: python -m unittest discover -s tests -p 'test_v3_pages_deployment_retry.py' -v
      - run: node --check docs/operational-score.js
  publish:
    needs: offline
    if: >-
      ${{ github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_run' ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      actions: read
    concurrency:
      group: v3-operational-research-score-publisher
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recompute from saved ledgers without provider calls or collection locks
        run: |
          python v3_operational_research_score.py
          python v3_operational_evidence_priority.py
          python v3_operational_model_diagnostics.py
      - name: Publish parallel model and append versioned observations
        id: publish_scores
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/v3-operational-research-scores.json docs/v3-operational-research-scores.csv docs/v3-operational-research-comparison.json docs/v3-operational-evidence-priority.json docs/v3-operational-model-diagnostics.json docs/score-history/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish R1d operational research scores and recovery bounds'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            # Re-read newly merged input data before publishing; a failure
            # leaves the previously published scores untouched.
            python v3_operational_research_score.py
            python v3_operational_evidence_priority.py
            python v3_operational_model_diagnostics.py
            git add docs/v3-operational-research-scores.json docs/v3-operational-research-scores.csv docs/v3-operational-research-comparison.json docs/v3-operational-evidence-priority.json docs/v3-operational-model-diagnostics.json docs/score-history/
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo '::error::r1d_score_push_retries_exhausted'
          exit 1
      - name: Check failed Pages publication even when scores are unchanged
        id: pages_recovery
        if: steps.publish_scores.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "retry=false" >> "$GITHUB_OUTPUT"
          # A failed metadata read must not change scores or authorize a retry.
          if ! pages_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" --jq '.workflows[] | select(.path == "dynamic/pages/pages-build-deployment") | .id'); then
            echo "::warning::pages_retry_metadata_unavailable"
            exit 0
          fi
          if [[ ! "$pages_id" =~ ^[0-9]+$ ]]; then
            echo "::warning::pages_workflow_identity_not_unique"
            exit 0
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$pages_id/runs?per_page=100" > /tmp/v3-pages-runs.json; then
            echo "::warning::pages_retry_runs_unavailable"
            exit 0
          fi
          if ! retry=$(python v3_pages_deployment_retry.py --runs /tmp/v3-pages-runs.json); then
            echo "::warning::pages_retry_metadata_not_verified"
            exit 0
          fi
          echo "retry=$retry" >> "$GITHUB_OUTPUT"
      - name: Refresh Pages after score changes or a failed deployment
        if: steps.publish_scores.outputs.changed == 'true' || steps.pages_recovery.outputs.retry == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
