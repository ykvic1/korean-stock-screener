name: One-time real private KRX incremental quality checkpoint adoption

on:
  push:
    branches: [v3-corporate-action-risk-flags-real-derived-20261020]
    paths:
      - .github/workflows/v3-incremental-quality-adopt-once.yml
permissions:
  contents: read
concurrency:
  group: v3-krx-private-derived-history
  cancel-in-progress: false
jobs:
  adopt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-corporate-action-risk-flags-real-derived-20261020
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install imported validator/calendar packages, no vendor calls
        run: python -m pip install 'requests>=2.31,<3' 'exchange-calendars==4.13.1'
      - name: Confirm private-only synthetic + action screening incremental recovery
        run: |
          set -euo pipefail
          python -m py_compile v3_krx_derived_corporate_action_risk.py v3_krx_corporate_risk_incremental.py
          python -m unittest discover -s tests -p 'test_v3_krx_derived_corporate_action_risk.py' -v
          python -m unittest discover -s tests -p 'test_v3_krx_corporate_risk_incremental.py' -v
      - name: Anchor genuine 2016 first-nine-cohort risk report to private compact checkpoint
        env:
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
        run: |
          set -euo pipefail
          python v3_krx_corporate_risk_incremental.py
