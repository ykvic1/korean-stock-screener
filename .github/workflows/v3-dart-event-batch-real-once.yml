name: One-time historical OpenDART risk filing batch resume
on:
  push:
    branches: [v3-real-dart-event-crosscheck-20261020]
    paths:
      - .github/workflows/v3-dart-event-batch-real-once.yml
permissions:
  contents: read
concurrency:
  group: v3-krx-private-derived-history
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-real-dart-event-crosscheck-20261020
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing DART client dependencies
        run: python -m pip install 'requests>=2.31,<3' 'exchange-calendars==4.13.1'
      - name: Offline partial page and issuer identity evidence checks
        run: |
          python -m py_compile v3_dart_event_filing_batches.py
          python -m unittest discover -s tests -p 'test_v3_dart_event_filing_batches.py' -v
          python -m unittest discover -s tests -p 'test_v3_dart_event_filing_research.py' -v
      - name: Adopt first 6 proven official filings as resumable private checkpoint
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
        run: python v3_dart_event_filing_batches.py
      - name: Query up to next ten historical KRX-risk issuers and store only filing receipts
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
        run: python v3_dart_event_filing_batches.py
