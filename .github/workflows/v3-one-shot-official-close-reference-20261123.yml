name: V3 One Shot 245 KRX Official Closing Support Breach 20261123
# Retry after restricting synthetic fixture exceptions to unit tests only.

on:
  push:
    branches: [v30b-official-close-stop-reference-20261123]
    paths: [.github/workflows/v3-one-shot-official-close-reference-20261123.yml]

permissions:
  contents: read

jobs:
  audit-official-close-chronology:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3' 'pyarrow>=20,<27' 'pandas>=2,<3'
      - name: Strict negative-case stop-reference tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v3_historical_official_close_stop_reference.py' -v
      - name: Download exact frozen public source inputs
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/93713f5a0a80ff29dc10e5aba9c8a51353e0e1b4/data/marcap-2025.parquet -o pilot-2025.parquet
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/24a2bec363aaad0ba2e3494966108995d196702d/data/marcap-2026.parquet -o pilot-2026.parquet
          curl -fsSL --max-time 30 https://raw.githubusercontent.com/FinanceData/fdr_krx_data_cache/05a17038b3cddf7a6f48105913e46fd37d96a21e/data/listing/krx/2026-11-13.csv -o pilot-2026-11-13.csv
      - name: Replay all 245 archived KRX closes and source-consistent historical first lows
        env:
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/historical-close-reference.json"
          python v3_historical_close_archive_audit.py "$RUNNER_TEMP/pilot-2025.parquet" "$RUNNER_TEMP/pilot-2026.parquet" "$RUNNER_TEMP/pilot-2026-11-13.csv" > "$output"
          jq -c .holder_close_reference_chronology "$output" > "$RUNNER_TEMP/historical-close-reference-aggregate.json"
          jq -e '.official_sessions_compared == 245 and .holder_close_reference_chronology.all_official_closing_breaches_consistent_with_frozen_public_first_lows == true and .holder_close_reference_chronology.official_close_observation_holder_days == 3461 and .holder_close_reference_chronology.new_krx_market_api_requests == 0 and .holder_close_reference_chronology.new_private_archive_reads == 0 and .holder_close_reference_chronology.first_intraday_reference_touch_certified == false and .holder_close_reference_chronology.v30b_release_ready == false' "$output" >/dev/null
          jq . "$RUNNER_TEMP/historical-close-reference-aggregate.json" >> "$GITHUB_STEP_SUMMARY"
          jq -c . "$RUNNER_TEMP/historical-close-reference-aggregate.json"
      - name: Retain aggregate only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-shot-krx-close-reference-aggregate
          path: ${{ runner.temp }}/historical-close-reference-aggregate.json
          if-no-files-found: ignore
          retention-days: 90
