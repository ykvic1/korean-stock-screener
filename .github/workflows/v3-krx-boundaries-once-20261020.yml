# Rerun after syntax validation fix, no prior vendor calls or writes.
name: One-time real KRX historical boundary-derived research probe

on:
  push:
    branches: [v3-krx-derived-boundary-research-20261020]
    paths:
      - .github/workflows/v3-krx-boundaries-once-20261020.yml

permissions:
  contents: read

concurrency:
  group: v3-krx-private-derived-history
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-krx-derived-boundary-research-20261020
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded provider packages
        run: python -m pip install 'requests>=2.31,<3' 'exchange-calendars==4.13.1'
      - name: Synthetic four-call bridge and private data non-disclosure test
        run: |
          python -m py_compile v3_krx_derived_bridges.py
          python -m unittest discover -s tests -p 'test_v3_krx_derived_bridges.py' -v
      - name: Bridge up to eight observed real historical KRX cohort boundaries
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
        run: |
          set -euo pipefail
          python v3_krx_derived_bridges.py
