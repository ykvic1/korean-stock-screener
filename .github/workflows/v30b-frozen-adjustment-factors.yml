name: Compare frozen split and consolidation factors
on:
  push:
    branches: [v30b-frozen-adjusted-close-paths]
    paths: [.github/workflows/v30b-frozen-adjustment-factors.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow requests
      - name: Download pinned unadjusted prices
        run: |
          curl -fsSL --retry 2 --max-time 90 https://raw.githubusercontent.com/FinanceData/marcap/93713f5a0a80ff29dc10e5aba9c8a51353e0e1b4/data/marcap-2025.parquet -o "$RUNNER_TEMP/2025.parquet"
          curl -fsSL --retry 2 --max-time 90 https://raw.githubusercontent.com/FinanceData/marcap/24a2bec363aaad0ba2e3494966108995d196702d/data/marcap-2026.parquet -o "$RUNNER_TEMP/2026.parquet"
          curl -fsSL --retry 2 --max-time 60 https://raw.githubusercontent.com/FinanceData/fdr_krx_data_cache/05a17038b3cddf7a6f48105913e46fd37d96a21e/data/listing/krx/2026-11-13.csv -o "$RUNNER_TEMP/endpoint.csv"
      - name: Compare holder unit changes with independent adjusted close pairs
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          python - <<'PY'
          import csv
          from collections import Counter
          from datetime import datetime
          from fractions import Fraction
          from hashlib import sha256
          import json
          import os
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          import pyarrow.parquet as pq
          import requests
          from official_probe.clients import KRXClient

          baseline = json.loads(Path("ops/v3-historical-close-archive-audit-20251113.json").read_text())
          sources = {}
          for year, digest in zip((2025, 2026), baseline["public_inputs_sha256"][:2], strict=True):
              path = Path(os.environ["RUNNER_TEMP"]) / f"{year}.parquet"
              if sha256(path.read_bytes()).hexdigest() != digest:
                  raise ValueError("raw_price_source_changed")
              sources[year] = path

          endpoint = Path(os.environ["RUNNER_TEMP"]) / "endpoint.csv"
          if sha256(endpoint.read_bytes()).hexdigest() != baseline["public_inputs_sha256"][2]:
              raise ValueError("endpoint_hash_changed")
          with endpoint.open(encoding="utf-8-sig", newline="") as stream:
              end_rows = {r["Code"]: r for r in csv.DictReader(stream)}

          def raw_price(code, day, column):
              table = pq.read_table(sources[day.year], columns=[column, "Volume"],
                                    filters=[("Code", "=", code), ("Date", "=", day)])
              rows = table.to_pylist()
              if len(rows) != 1 or rows[0]["Volume"] <= 0 or rows[0][column] <= 0:
                  raise ValueError("missing_officially_crosschecked_trade_anchor")
              return int(rows[0][column])

          official_days = {}

          def official_day(market, day):
              key = market, day
              if key not in official_days:
                  if len(official_days) >= 60:
                      raise ValueError("unexpected_number_of_reference_changes")
                  rows, payload = client.daily_market(market, day.date().isoformat())
                  official_days[key] = {r["ISU_CD"]: r for r in rows}, sha256(payload).hexdigest()
                  if len(official_days[key][0]) != len(rows):
                      raise ValueError("ambiguous_official_identity")
              return official_days[key]

          def official_factor_bounds(code, days, prior, listing):
              market = end_rows[code]["Market"]
              market = "KOSDAQ" if market == "KOSDAQ GLOBAL" else market
              hashes = []
              official = []
              for day, raw_close in zip(days, (prior, listing), strict=True):
                  rows, digest = official_day(market, day)
                  matches = [rows[code]] if code in rows and rows[code].get("BAS_DD") == day.strftime("%Y%m%d") else []
                  if len(matches) != 1 or int(matches[0]["TDD_CLSPRC"]) != raw_close:
                      raise ValueError("official_price_anchor_mismatch")
                  official.append(matches[0])
                  hashes.append(digest)
              row = official[-1]
              if not re.fullmatch(r"[+-]?[0-9]+", str(row.get("CMPPREVDD_PRC", ""))):
                  raise ValueError("unusable_official_price_change")
              change = int(row["CMPPREVDD_PRC"])
              base = listing - change
              # Independent consistency check against KRX's published two-decimal percentage.
              if base <= 0 or abs(Fraction(str(row["FLUC_RT"])) - Fraction(100 * change, base)) > Fraction(1, 100):
                  raise ValueError("official_change_and_rate_inconsistent")
              return Fraction(base, prior), hashes

          client = KRXClient(os.environ["KRX_API_KEY"])
          outcomes = []
          with open("ops/v3-performance-share-adjustments-20251113.csv") as stream:
              events = list(csv.DictReader(stream))
          for event in events:
              code = event["code"]
              days = [datetime.fromisoformat(event[key]) for key in ("prior_trade_on", "listing_on")]
              raw_before, raw_after = [raw_price(code, day, "Close") for day in days]
              response = requests.get("https://fchart.stock.naver.com/sise.nhn",
                                      params={"symbol": code, "timeframe": "day", "startTime": "20251113",
                                              "endTime": "20261113", "requestType": "1"},
                                      timeout=(8, 25))
              response.raise_for_status()
              if len(response.content) > 2_000_000:
                  raise ValueError("oversize_adjusted_response")
              xml = response.content.decode("cp949")
              channel = ET.fromstring(re.sub(r"^<\?xml[^?]*\?>", "", xml.lstrip())).find("chartdata")
              prices = {}
              if channel is not None and channel.get("symbol") == code:
                  for item in channel.findall("item"):
                      parts = item.get("data", "").split("|")
                      if len(parts) >= 6 and re.fullmatch(r"[0-9]+", parts[4]) and int(parts[4]) > 0:
                          if parts[0] in prices:
                              raise ValueError("duplicate_adjusted_session")
                          prices[parts[0]] = int(parts[4])
              before, after = [prices.get(day.strftime("%Y%m%d")) for day in days]
              state = "adjusted_anchor_unavailable"
              detail = {}
              if before and after:
                  expected = Fraction(int(event["old_units"]), int(event["new_units"]))
                  observed = Fraction(before * raw_after, after * raw_before)
                  detail = {"expected_multiplier": str(expected), "observed_multiplier": str(observed),
                            "prior_matches_unadjusted": before == raw_before,
                            "listing_matches_unadjusted": after == raw_after}
                  # Two integer adjusted closes can each be rounded by half a won.
                  lower = Fraction((2*before-1)*raw_after, (2*after+1)*raw_before)
                  upper = Fraction((2*before+1)*raw_after, (2*after-1)*raw_before)
                  reference = None
                  if code == "028080" and event["listing_on"] == "2026-04-30":
                      detail["kind_notice"] = "https://kind.krx.co.kr/external/2026/04/29/001058/20260429002274/70795.htm"
                      reference = 7520
                  elif code == "121850" and event["listing_on"] == "2025-12-10":
                      detail["kind_notice"] = "https://kind.krx.co.kr/external/2025/12/09/000506/20251209001663/70793.htm"
                      # KIND defines the first auction trade within these published limits as the base.
                      opening = raw_price(code, days[1], "Open")
                      if 2825 <= opening <= 8480:
                          reference = opening
                  if reference is not None:
                      target = Fraction(reference, raw_before)
                      detail["notice_reference_factor_match"] = (
                          "exact" if observed == target else "within_rounding"
                          if lower <= target <= upper else "different_factor")
                  official_factor, hashes = official_factor_bounds(code, days, raw_before, raw_after)
                  detail["official_daily_source_sha256"] = hashes
                  detail["official_daily_reference_factor_match"] = (
                      "exact" if observed == official_factor else "within_rounding"
                      if lower <= official_factor <= upper else "different_factor")
                  state = ("exact" if observed == expected else "within_rounding"
                           if lower <= expected <= upper else "different_factor")
              sessions = {}
              for path in sources.values():
                  series = pq.read_table(path, columns=["Date", "Close", "Volume"],
                                         filters=[("Code", "=", code), ("Date", ">=", datetime(2025, 11, 13)),
                                                  ("Date", "<", datetime(2026, 11, 13))])
                  for quote in series.to_pylist():
                      if quote["Volume"] > 0 and quote["Close"] > 0:
                          date = quote["Date"].strftime("%Y%m%d")
                          if date in sessions:
                              raise ValueError("duplicate_raw_session")
                          sessions[date] = int(quote["Close"])
              final = end_rows[code]
              if int(final["Volume"]) > 0 and int(final["Close"]) > 0:
                  sessions["20261113"] = int(final["Close"])
              links = Counter()
              dates = sorted(sessions)
              for first, last in zip(dates, dates[1:]):
                  v1, v2 = prices.get(first), prices.get(last)
                  if v1 is None or v2 is None:
                      links["missing_adjusted_anchor"] += 1
                      continue
                  r1, r2 = sessions[first], sessions[last]
                  low = Fraction((2*v1-1)*r2, (2*v2+1)*r1)
                  high = Fraction((2*v1+1)*r2, (2*v2-1)*r1)
                  if low <= 1 <= high:
                      links["consistent_with_unchanged_scale"] += 1
                      continue
                  pair = [datetime.strptime(day, "%Y%m%d") for day in (first, last)]
                  factor, _ = official_factor_bounds(code, pair, r1, r2)
                  links["krx_reference_match" if low <= factor <= high else "krx_reference_differs"] += 1
              detail["year_path"] = {"raw_traded_sessions": len(dates),
                                     "adjusted_positive_closes_on_traded_sessions": sum(d in prices for d in dates),
                                     "adjacent_traded_session_pairs": links}
              outcomes.append({"event_date": event["listing_on"], "state": state, **detail,
                               "adjusted_response_sha256": sha256(response.content).hexdigest()})
          client.session.close()
          result = {"source": "Naver historical chart", "event_count": len(events), "outcomes": outcomes,
                    "official_market_day_sha256": {f"{market}_{day:%Y%m%d}": item[1] for (market, day), item in official_days.items()},
                    "counts": dict(Counter(item["state"] for item in outcomes)),
                    "official_adjusted_history_verified": False}
          print(json.dumps(result))
          Path("adjustment-factor-comparison.json").write_text(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adjustment-factor-comparison
          path: adjustment-factor-comparison.json
          if-no-files-found: error
