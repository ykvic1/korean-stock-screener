name: V3 Official Parent Equity Gap Pilot
on:
  pull_request:
    paths:
      - v3_dart_parent_equity_pilot.py
      - tests/test_v3_dart_parent_equity_pilot.py
      - .github/workflows/v3-parent-equity-pilot.yml
  push:
    branches: [main]
    paths:
      - v3_dart_parent_equity_pilot.py
      - tests/test_v3_dart_parent_equity_pilot.py
      - .github/workflows/v3-parent-equity-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact receipt, balance sheet and total-minus-NCI guards
        run: |
          python -m unittest discover -s tests -p 'test_v3_dart_parent_equity_pilot.py' -v
          python v3_dart_parent_equity_pilot.py --mode dry-run --limit 7
  live_research:
    needs: offline
    # A protected main push runs the bounded pilot once after CI has passed.
    # Pull requests never receive the credential or make provider calls.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Check up to seven official annual statement identities without publishing data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python v3_dart_parent_equity_pilot.py --mode live --limit 7
