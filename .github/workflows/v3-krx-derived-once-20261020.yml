# Safe one-time retry to expose only allowlisted error categories.
name: One-time 5-session KRX derived factors private write (no raw source)

on:
  push:
    branches: [v3-krx-derived-five-session-live-20261020]
    paths:
      - .github/workflows/v3-krx-derived-once-20261020.yml

permissions:
  contents: read

concurrency:
  group: v3-krx-private-derived-research-once
  cancel-in-progress: false

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-krx-derived-five-session-live-20261020
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal providers (no extra paid services)
        run: python -m pip install 'requests>=2.31,<3'
      - name: Offline private-only derived research correctness tests
        run: |
          set -euo pipefail
          python -m py_compile v3_krx_derived_5day.py
          python -m unittest discover -s tests -p 'test_v3_krx_derived_5day.py' -v
      - name: Read KRX 5 market sessions and write only transformed private factors
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
        run: |
          set -euo pipefail
          # Derived factors only. Provider original JSON exists only in RAM;
          # no Actions artifacts, logs, workspace files or public repo commits.
          python v3_krx_derived_5day.py
