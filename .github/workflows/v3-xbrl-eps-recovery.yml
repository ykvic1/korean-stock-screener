name: V3 Original XBRL Reported Basic EPS Recovery
on:
  pull_request:
    paths:
      - v3_dart_xbrl_eps_recovery.py
      - tests/test_v3_dart_xbrl_eps_recovery.py
      - tests/test_v3_eps_independent_cfo.py
      - .github/workflows/v3-xbrl-eps-recovery.yml
  push:
    branches: [main]
    paths:
      - v3_dart_xbrl_eps_recovery.py
      - .github/workflows/v3-xbrl-eps-recovery.yml
  workflow_dispatch:
  schedule:
    - cron: '07 11 * * 1-5'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m unittest discover -s tests -p 'test_v3_dart_xbrl_eps_recovery.py' -v
          python -m unittest discover -s tests -p 'test_v3_eps_independent_cfo.py' -v
          python -m unittest discover -s tests -p 'test_v3_dart_reported_eps*.py' -v
          python -m unittest discover -s tests -p 'test_v3_dart_xbrl_cashflow_recovery.py' -v
          python v3_dart_xbrl_eps_recovery.py --mode dry-run --limit 16
  recover:
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    concurrency:
      # Share the existing EPS writer lock; no concurrent ledger overwrite.
      group: v3-dart-reported-basic-eps
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: .cache/v3-dart-company-codes.json
          key: v3-dart-corp-map-v1-${{ hashFiles('docs/v22-market-catalog.json') }}
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Recover only reported original basic EPS with independent scope and CFO anchors
        id: collect
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          set -euo pipefail
          interrupted=1
          # A provider may transiently reject one official archive even after
          # earlier issuer-year reviews were checkpointed. Retry only once,
          # after a short backoff, against those checkpoints. A second failure
          # still publishes verified partial progress before surfacing failure.
          # Two bounded <=360-second source passes leave time for publication
          # under the 20-minute job limit; no unbounded API retry loops.
          for attempt in 1 2; do
            if python v3_dart_xbrl_eps_recovery.py --mode live --limit 16; then
              interrupted=0
              break
            fi
            if [ "$attempt" -eq 1 ]; then sleep 12; fi
          done
          echo "interrupted=$interrupted" >> "$GITHUB_OUTPUT"
      - name: Verify and publish derived observations before reporting any interruption
        id: publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python v3_dart_reported_eps.py --mode refresh
          python v3_dart_reported_eps.py --mode verify
          git add docs/v3-dart-reported-eps.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Recover independently anchored original reported basic EPS'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            python v3_dart_reported_eps.py --mode refresh
            git add docs/v3-dart-reported-eps.json
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
            python v3_dart_reported_eps.py --mode verify
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo '::error::verified_eps_push_retries_exhausted'
          exit 1
      - name: Replay validated current observations even after a partial collection
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/v3-current-observed-scorecard.yml/dispatches" -f ref=main -f 'inputs[mode]=write' --silent
      - name: Check for another unreviewed receipt-matched original EPS batch
        id: remaining
        if: steps.collect.outputs.interrupted == '0' && steps.publish.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # This is an offline, read-only check against the state successfully
          # published above. Each completed issuer gets a permanent same-receipt
          # positive or negative review marker: no repeat API loops.
          python v3_dart_xbrl_eps_recovery.py --mode dry-run --limit 1 > "$RUNNER_TEMP/v3-original-eps-remaining.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          result=json.loads((Path(os.environ['RUNNER_TEMP'])/'v3-original-eps-remaining.json').read_text())
          selected=result.get('selected')
          if type(selected) is not int or not 0<=selected<=1 or result.get('provider_calls')!=0:
              raise SystemExit('invalid_remaining_eps_research_plan')
          ready=selected>0
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('ready='+('true' if ready else 'false')+'\n')
          print(json.dumps({'unreviewed_original_eps_remaining':ready,'provider_calls':0}))
          PY
      - name: Continue finite original EPS source checks after saved progress
        if: steps.remaining.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/v3-xbrl-eps-recovery.yml/dispatches" -f ref=main --silent
      - name: Surface source interruption after preserving validated observations
        if: steps.collect.outputs.interrupted == '1'
        run: exit 1
