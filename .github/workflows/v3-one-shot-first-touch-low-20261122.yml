name: V3 One-Time KRX Historical First Touch LOW Comparison 20261122

# One-shot branch-only authenticated KRX evidence. Delete workflow before PR merge.
on:
  push:
    branches: [v30b-first-touch-low-direct-20261122]
    paths:
      - .github/workflows/v3-one-shot-first-touch-low-20261122.yml

permissions:
  contents: read

concurrency:
  group: v30b-first-touch-one-time-20261122
  cancel-in-progress: false

jobs:
  touch-low:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        group: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded replay dependencies
        run: pip install 'requests>=2.31,<3' 'pyarrow>=20,<27' 'pandas>=2,<3'
      - name: Validate exactly eleven security-days needing official touch LOW (offline)
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v3_historical_reference_touch_direct_probe.py' -v
      - name: Download pinned historical public price inputs
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/93713f5a0a80ff29dc10e5aba9c8a51353e0e1b4/data/marcap-2025.parquet -o pilot-2025.parquet
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/24a2bec363aaad0ba2e3494966108995d196702d/data/marcap-2026.parquet -o pilot-2026.parquet
          curl -fsSL --max-time 30 https://raw.githubusercontent.com/FinanceData/fdr_krx_data_cache/05a17038b3cddf7a6f48105913e46fd37d96a21e/data/listing/krx/2026-11-13.csv -o pilot-2026-11-13.csv
      - name: KRX direct LOW comparison and original/successor holding-unit math
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          TOUCH_GROUP: ${{ matrix.group }}
          PUBLIC_REPLAY_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/first-touch-low-${TOUCH_GROUP}.json"
          import json, os
          from pathlib import Path
          from official_probe.clients import KRXClient
          from v3_historical_reference_touch_direct_probe import (
              pending_first_touch_targets, compare_bounded_batch,
          )
          from v3_historical_market_coverage import read_panels
          from v3_historical_pilot_official_prices import read_turnover_panels
          from v3_krx_history_collection import validate_dates
          key=os.getenv("KRX_API_KEY", "")
          if not key.strip():
              raise SystemExit("official_krx_key_unavailable")
          targets=pending_first_touch_targets()
          all_dates=sorted(targets)
          if len(all_dates) != 10 or sum(len(v) for v in targets.values()) != 11:
              raise SystemExit("incorrect_first_touch_gap")
          group=int(os.environ["TOUCH_GROUP"])
          if group not in (0,1):
              raise SystemExit("invalid_touch_group")
          dates=all_dates[:5] if group == 0 else all_dates[5:]
          validate_dates(dates)
          directory=Path(os.environ["PUBLIC_REPLAY_DIR"])
          files=[directory / item for item in (
              "pilot-2025.parquet","pilot-2026.parquet","pilot-2026-11-13.csv")]
          panels=read_panels(files)
          money=read_turnover_panels(files, [
              __import__("datetime").date.fromisoformat(d) for d in dates])
          report=compare_bounded_batch(panels,money,KRXClient(key),dates,targets)
          print(json.dumps(report,sort_keys=True))
          if (report["target_security_days"] != report["verified_security_days"]
                  or not all(r["touch_holder_open_low_exact"] == r["reported_touch_security_days"]
                             for r in report["sessions"].values())
                  or report["first_touch_is_earliest_trade_proven"] is not False
                  or report["pre_touch_complete_adjusted_path_verified"] is not False
                  or report["regular_only_volume_verified"] is not False
                  or report["performance_validated"] is not False
                  or report["v30b_release_ready"] is not False):
              raise SystemExit("incomplete_official_touch_low_proof")
          PY
      - name: Retain anonymized official touch proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-touch-low-${{ matrix.group }}
          path: ${{ runner.temp }}/first-touch-low-${{ matrix.group }}.json
          if-no-files-found: ignore
          retention-days: 90
