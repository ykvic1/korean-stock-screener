name: One-Time V2.2 Real Price Error Cause Sample 2026-10-19

on:
  push:
    branches: [v22-error-diagnosis-and-valuation-research-20261019]

permissions:
  contents: read

concurrency:
  group: v22-price-reason-diagnostic-20261019
  cancel-in-progress: true

jobs:
  source-bound-price-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only FinanceDataReader and existing dependencies
        run: pip install -r requirements.txt
      - name: Offline safety and no-leak contract
        run: |
          python -m py_compile v22_price_error_triage.py v22_price_reason_recheck_once.py
          python -m unittest discover -s tests -p 'test_v22_price_error_triage.py' -v
      - name: Recheck exactly 24 current-listed failed 2026-10-19 price histories
        run: |
          set -euo pipefail
          python v22_price_reason_recheck_once.py
      - name: Explicit no-production-mutation marker
        if: always()
        run: |
          echo 'Research only: no score/price/supplier contract changed by this 24-symbol sample.'
