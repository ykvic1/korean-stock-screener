name: V3 KRX two-session private derived tail

on:
  push:
    branches: [main]
    paths:
      - v3_krx_derived_two_session_tail.py
      - tests/test_v3_krx_derived_two_session_tail.py
      - .github/workflows/v3-krx-two-session-tail.yml
  schedule:
    # Reuse the immutable private result if the first source attempt failed.
    - cron: '37 5 * * *'
  workflow_run:
    workflows:
      - V3 KRX historical derived-only backfill
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Manual defaults to test-only; live writes only private derived tail'
        type: choice
        options: [dry_run, live]
        default: dry_run
        required: true

permissions:
  contents: read

concurrency:
  group: v3-krx-two-session-derived-private
  cancel-in-progress: false

jobs:
  two-session-tail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official KRX client calendar imports
        run: python -m pip install 'requests>=2.31,<3' 'exchange-calendars==4.13.1'
      - name: Regression - never synthesize five sessions, prices or scores
        run: |
          set -euo pipefail
          python -m py_compile v3_krx_derived_two_session_tail.py
          python -m unittest discover -s tests -p 'test_v3_krx_derived_two_session_tail.py' -v
      - name: Save at most two observed sessions as private derived-only evidence
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
        run: |
          set -euo pipefail
          # Exactly 4 market calls on first success, zero thereafter.
          # Private derived ratios only; source OHLCV never saved or published.
          python v3_krx_derived_two_session_tail.py
