name: V3.0b Historical Pilot Official KRX Price Comparison

on:
  push:
    branches: [main]
    paths:
      - v3_historical_pilot_official_prices.py
      - .github/workflows/v3-historical-pilot-official-prices.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v30b-historical-pilot-official-prices
  cancel-in-progress: false

jobs:
  spotcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: [anchor, remaining]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3' 'pyarrow>=20,<27' 'pandas>=2,<3'
      - name: Download fixed public replay inputs
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/93713f5a0a80ff29dc10e5aba9c8a51353e0e1b4/data/marcap-2025.parquet -o pilot-2025.parquet
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/24a2bec363aaad0ba2e3494966108995d196702d/data/marcap-2026.parquet -o pilot-2026.parquet
          curl -fsSL --max-time 30 https://raw.githubusercontent.com/FinanceData/fdr_krx_data_cache/05a17038b3cddf7a6f48105913e46fd37d96a21e/data/listing/krx/2026-11-13.csv -o pilot-2026-11-13.csv
      - name: Compare official OHLC and historical membership in memory
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          PILOT_BATCH: ${{ matrix.batch }}
        run: |
          set -euo pipefail
          python v3_historical_pilot_official_prices.py --batch "$PILOT_BATCH" "$RUNNER_TEMP/pilot-2025.parquet" "$RUNNER_TEMP/pilot-2026.parquet" "$RUNNER_TEMP/pilot-2026-11-13.csv"
