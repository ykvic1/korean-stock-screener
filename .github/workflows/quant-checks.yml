          from pathlib import Path
          import re, subprocess
          for p in (Path('docs/index.html'),Path('docs/quant.html')):
              js='\n'.join(re.findall(r'<script>(.*?)</script>',p.read_text(),flags=re.S))
              temp=Path('/tmp/'+p.stem+'.js');temp.write_text(js)
              subprocess.run(['node','--check',str(temp)],check=True)
          PY
