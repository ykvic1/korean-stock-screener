name: Quant v2.1 correctness checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [upgrade-v21-quant]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Install pinned OPTIONAL XKRX calendar for offline candidate-contract tests
        run: python -m pip install 'exchange-calendars==4.13.1'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile screener.py quant_engine.py quant_fetch_history.py quant_excel.py official_data.py publish_quant.py recommendation_engine.py
      - name: Kiwoom Windows PowerShell offline mock (no credentials or network)
        shell: pwsh
        run: ./scripts/kiwoom_readonly_probe.ps1 -OfflineSelfTest
      - name: Kiwoom 3-page Windows PowerShell synthetic pagination (no network or keys)
        shell: pwsh
        run: ./scripts/kiwoom_pagination_probe.ps1 -OfflineSelfTest
      - name: OCI installer syntax only (no cloud access, no secrets)
        run: bash -n deploy/oci_prepare.sh
      - name: v2.2 complete listed universe PBR and flow references (offline)
        run: |
          python -m py_compile v22_active_market_catalog.py
          python -m unittest discover -s tests -p 'test_v22_active_market_catalog.py' -v
      - name: v2.2 106-price-error reason triage, exact 100-share batch accounting, and bounded retry sample (offline)
        run: |
          python -m py_compile v22_price_error_triage.py v22_price_reason_recheck_once.py
          python -m unittest discover -s tests -p 'test_v22_price_error_triage.py' -v
      - name: v2.2 recent-listing limited 60-159-day MA and OBV with NO unearned stock score (offline)
        run: |
          python -m py_compile v22_short_history_validation.py v22_short_history_observations.py
          python -m unittest discover -s tests -p 'test_v22_short_history_observations.py' -v
      - name: V3 manual research page short-history previews, source-date and no-order safety (offline)
        run: |
          node --check docs/v3-beta.js
          node tests/test_v22_short_history_ui.cjs
      - name: v2.2 full-market stock-by-stock accounting and quality safeguards (offline)
        run: |
          python -m py_compile v22_full_universe_audit.py
          python -m unittest discover -s tests -p 'test_v22_full_universe_audit.py' -v
          python v22_full_universe_audit.py --daily docs/data.json
      - name: V3 separately published real candidate quant, 40-peer cohort and no false prediction (offline)
        run: |
          python -m py_compile v3_priority_quant_feed.py
          python -m unittest discover -s tests -p 'test_v3_priority_quant_feed.py' -v
      - name: V3 actual shortlisted daily and Saturday quant workflow source-date publication guards
        run: |
          python -m unittest discover -s tests -p 'test_v3_priority_workflow_integration.py' -v
      - name: V3 bounded 20-stock annual financial reference from DART (offline mock, no secrets)
        run: |
          python -m py_compile official_data.py
          python -m unittest discover -s tests -p 'test_v3_bounded_financial_reference.py' -v
      - name: V3 ranked candidate historical study coverage and live published-snapshot audit (offline)
        run: |
          python -m py_compile v3_ranked_quant_coverage.py
          python -m unittest discover -s tests -p 'test_v3_ranked_quant_coverage.py' -v
          python v3_ranked_quant_coverage.py --output /tmp/v3-quant-readiness-ci.json
      - name: V3 score-first research candidates and actual same-date quant decision UI (offline)
        run: |
          node --check docs/v3-ranking.js
          node tests/test_v3_ranked_core.cjs
      - name: v3 user-facing paper-beta page and browser logic (offline)
        run: |
          node --check docs/v3-beta.js
          node tests/test_v3_user_beta.cjs
      - name: v3 first bounded KRX real-provider to partial technical pipeline (synthetic CI only)
        run: |
          python -m py_compile v3_krx_first_real_pipeline.py
          python -m unittest discover -s tests -p 'test_v3_krx_first_real_pipeline.py' -v
      - name: v3 decade-plus append-only history planning and source chain capacity (offline)
        run: |
          python -m py_compile v3_evidence_chain.py v3_local_private_store.py v3_krx_private_backfill_plan.py v3_price_feature_adapter.py
          python -m unittest discover -s tests -p 'test_v3_decade_history_archive.py' -v
      - name: v3 private daily candlestick chart with optional MA120 and MA240 (offline)
        run: |
          python -m py_compile v3_private_daily_chart.py v3_optional_technical_research.py
          python -m unittest discover -s tests -p 'test_v3_private_daily_chart.py' -v
      - name: v3 unscaled technical subfactor research when weekly MA120 is missing
        run: |
          python -m py_compile v3_research_factor_engine.py
          python -m unittest discover -s tests -p 'test_v3_optional_technical_factor.py' -v
      - name: v3 optional partial daily and weekly technical research (no mandatory MA120)
        run: |
          python -m py_compile v3_optional_technical_research.py
          python -m unittest discover -s tests -p 'test_v3_optional_technical_research.py' -v
      - name: v3 KRX private 100-ticker price panel bridge (offline, no score promotion)
        run: |
          python -m py_compile v3_krx_private_price_bridge.py
          python -m unittest discover -s tests -p 'test_v3_krx_private_price_bridge.py' -v
      - name: v3 offline private archive semantic replay and no-network resume guard
        run: |
          python -m py_compile v3_krx_archive_reaudit.py v3_krx_local_resume_batch.py
          python -m unittest discover -s tests -p 'test_v3_krx_archive_reaudit.py' -v
      - name: Bounded KRX versus XKRX observed-day challenge (all synthetic, no credential)
        run: |
          python -m py_compile v3_krx_session_challenge.py
          python -m unittest discover -s tests -p 'test_v3_krx_session_challenge.py' -v
      - name: Research-only XKRX holiday candidate calendar and 250-session resumable archive
        run: |
          python -m py_compile v3_krx_session_candidates.py
          python -m unittest discover -s tests -p 'test_v3_krx_xkrx_candidates.py' -v
      - name: KRX raw-zero OHLC fields vs aggregate volume and safe local live-resume integration
        run: |
          python -m py_compile v3_krx_zero_price_detail.py v3_krx_local_resume_batch.py
          python -m unittest discover -s tests -p 'test_v3_krx_zero_resume.py' -v
      - name: KRX daily unpriced row reasons, official-master offline identity and resumable private backfill
        run: |
          python -m py_compile v3_krx_daily_anomaly_triage.py v3_krx_private_backfill_plan.py v3_krx_issuer_master_audit.py
          python -m unittest discover -s tests -p 'test_v3_krx_anomaly_backfill.py' -v
          python -m unittest discover -s tests -p 'test_v3_krx_issuer_master_audit.py' -v
      - name: KRX real daily two-market history bounded offline contracts only
        run: |
          python -m py_compile v3_krx_history_collection.py
          python -m unittest discover -s tests -p 'test_v3_krx_history_collection.py' -v
      - name: KRX website investor flow offline contract (no network or keys)
        run: python -m unittest discover -s tests -p 'test_v3_krx_website_flow_pilot.py' -v
      - name: KRX official two-market private staging offline contract (no keys or network)
        run: python -m unittest discover -s tests -p 'test_v3_krx_private_daily.py' -v
      - name: v3 full-market 2200 synthetic issuer global normalization and safe 100-name partitions
        run: |
          python -m py_compile v3_fullmarket_stress.py
          python -m unittest discover -s tests -p 'test_v3_fullmarket_stress.py' -v
      - name: v3 no-partial KOSPI KOSDAQ staged pagination and fault-injected bounded retries
        run: |
          python -m py_compile v3_atomic_ingestion.py
          python -m unittest discover -s tests -p 'test_v3_atomic_ingestion.py' -v
      - name: v3 freeze-time scoring to quality-gated 1 2 3 6 12 month research backtest
        run: |
          python -m py_compile v3_frozen_score_backtest.py
          python -m unittest discover -s tests -p 'test_v3_frozen_score_backtest.py' -v
      - name: v3 daily and weekly causal structural pivot support and resistance offline
        run: |
          python -m py_compile v3_structural_levels.py
          python -m unittest discover -s tests -p 'test_v3_structural_levels.py' -v
      - name: v3 mandatory PIT and event quality screen always blocks unverified evidence
        run: |
          python -m py_compile v3_mandatory_quality_gate.py
          python -m unittest discover -s tests -p 'test_v3_mandatory_quality_gate.py' -v
      - name: v3 downside-first screen blocks high scoring broken support and equity loss (synthetic only)
        run: |
          python -m py_compile v3_loss_first_screen.py
          python -m unittest discover -s tests -p 'test_v3_loss_first_screen.py' -v
      - name: v3 private offline responsive mobile six-pillar preview and XSS/no-publish regression
        run: |
          python -m py_compile v3_mobile_report.py
          python -m unittest discover -s tests -p 'test_v3_mobile_report.py' -v
      - name: v3 market-scoped IAS/momentum/FCF overlap and rank-correlation diagnostics (synthetic only)
        run: |
          python -m py_compile v3_factor_overlap_audit.py
          python -m unittest discover -s tests -p 'test_v3_factor_overlap_audit.py' -v
      - name: v3 industry membership complete-cohort cycle and MA60 breadth (synthetic only)
        run: |
          python -m py_compile v3_industry_feature_adapter.py
          python -m unittest discover -s tests -p 'test_v3_industry_feature_adapter.py' -v
      - name: v3 4-year reported KRW financial cashflow growth and valuation raw feature calculations
        run: |
          python -m py_compile v3_financial_feature_adapter.py
          python -m unittest discover -s tests -p 'test_v3_financial_feature_adapter.py' -v
      - name: v3 runnable 64-stock synthetic six-pillar IAS + technical + portfolio risk workbench
        run: |
          python -m py_compile v3_offline_workbench.py
          python -m unittest discover -s tests -p 'test_v3_offline_workbench.py' -v
          python -m v3_offline_workbench --demo > /dev/null
      - name: v3 causal daily-weekly OHLCV to technical, OBV and momentum research features
        run: |
          python -m py_compile v3_price_feature_adapter.py
          python -m unittest discover -s tests -p 'test_v3_price_feature_adapter.py' -v
      - name: v3 executable 6-pillar raw features and IAS cohort normalization (synthetic only)
        run: |
          python -m py_compile v3_research_factor_engine.py
          python -m unittest discover -s tests -p 'test_v3_research_factor_engine.py' -v
      - name: v3 complete six-factor and IAS scoring contract offline checks
        run: python -m unittest discover -s tests -p 'test_v3_score_contract.py' -v
      - name: v3 walk-forward historical loss/target research and lookahead guard (synthetic only)
        run: |
          python -m py_compile v3_walkforward_research.py
          python -m unittest discover -s tests -p 'test_v3_walkforward_research.py' -v
      - name: v3 private local KRX two-market SQLite immutable archive and tamper check (mock only)
        run: |
          python -m py_compile v3_local_private_store.py
          python -m unittest discover -s tests -p 'test_v3_local_private_store.py' -v
      - name: v3 PIT/corporate-event quality-gated five-horizon walk-forward (synthetic only)
        run: |
          python -m py_compile v3_walkforward_quality_gate.py
          python -m unittest discover -s tests -p 'test_v3_walkforward_quality_gate.py' -v
      - name: v3 PIT aligned issuer, flow, filing and industry join contract (synthetic only)
        run: |
          python -m py_compile v3_pit_join.py
          python -m unittest discover -s tests -p 'test_v3_pit_join.py' -v
      - name: v3 two-market private evidence chain integrity and tamper/fork guard (synthetic only)
        run: |
          python -m py_compile v3_evidence_chain.py
          python -m unittest discover -s tests -p 'test_v3_evidence_chain.py' -v
      - name: v3 IAS 20/60/120/250-flow ledger no-double-count safeguards (synthetic only)
        run: |
          python -m py_compile v3_ias_flow_ledger.py
          python -m unittest discover -s tests -p 'test_v3_ias_flow_ledger.py' -v
      - name: v3 PIT historical universe and corporate-action quarantine (synthetic only)
        run: |
          python -m py_compile v3_historical_integrity.py
          python -m unittest discover -s tests -p 'test_v3_historical_integrity.py' -v
      - name: v3 portfolio downside budget, concentration and gap stress (synthetic only)
        run: |
          python -m py_compile v3_portfolio_risk.py
          python -m unittest discover -s tests -p 'test_v3_portfolio_risk.py' -v
      - name: Small technical watchlist offline safety checks (no APIs)
        run: node tests/test_v22_practical_watchlist.js
      - name: Full KOSPI-KOSDAQ universe without size count or turnover caps (offline)
        run: python -m unittest discover -s tests -p 'test_universe_rotation.py' -v
      - name: Complete-market 100-stock job slices and fail-closed aggregate (no network)
        run: python -m unittest discover -s tests -p 'test_full_market_batch.py' -v
      - name: Full-market evidence-led research selection, no forced20, daily entry/exit tracking
        run: python -m unittest discover -s tests -p 'test_recommendation_engine.py' -v
      - name: Top20 per-stock deep analysis published UI and stale fail-closed rendering
        run: node tests/test_recommendation_site.js
      - name: Client score normalization of obtained weight only, 70/85=82.3
        run: node tests/test_partial_score_ui.js
      - name: Investor-first homepage, stock-level quant lookup and automatic price-quality status
        run: node tests/test_stock_research_home.js
      - name: Syntax of new research UI JavaScript and patchnotes HTML
        run: |
          node --check docs/stock_research.js
          node --check docs/stock_research_ui.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
              pass
          P().feed(Path('docs/patch-notes.html').read_text(encoding='utf-8'))
          PY
      - name: JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          for p in (Path('docs/index.html'),Path('docs/quant.html')):
              js='\n'.join(re.findall(r'<script>(.*?)</script>',p.read_text(),flags=re.S))
              temp=Path('/tmp/'+p.stem+'.js');temp.write_text(js)
              subprocess.run(['node','--check',str(temp)],check=True)
          PY
