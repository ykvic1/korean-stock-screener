      - name: v3 executable 6-pillar raw features and IAS cohort normalization (synthetic only)
        run: |
          python -m py_compile v3_research_factor_engine.py
          python -m unittest discover -s tests -p 'test_v3_research_factor_engine.py' -v
      - name: V3 seven-calendar-day rotating all-listed research recalculation and coverage audit
        run: |
          python -m py_compile v3_weekly_rotation.py
          python -m unittest discover -s tests -p 'test_v3_weekly_rotation.py' -v
      - name: V3 real published all-listed sources read-only rotating rehearsal
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from datetime import date
          from pathlib import Path
          from v3_weekly_rotation import RotationError, source_tables

          docs = Path('docs')
          def read(name):
              return json.loads((docs/name).read_text(encoding='utf-8'))
          market = read('data.json')
          catalog = read('v22-market-catalog.json')
          book = read('v3-dart-book-reference.json')
          prior = read('v3-weekly-coverage.json')
          assert prior.get('schema') == 'v3-seven-day-research-coverage-0.1'
          when = max(date(2026,10,20),
                     date.fromisoformat(market['date']),
                     date.fromisoformat(prior['run_kst'])).isoformat()
          market_day = date.fromisoformat(market['date'])
          book_day = date.fromisoformat(book['asof'])
          if (book_day < market_day and (market_day-book_day).days <= 10
              and book.get('schema') ==
                  'v3-dart-current-listed-annual-book-reference-0.1'
              and type(book.get('market_listed_total')) is int
              and 1 <= book['market_listed_total'] <= 6000
              and book.get('historical_point_in_time_verified') is False
              and book.get('official_exchange_pbr_verified') is False):
              # A previous trading day's DART universe cannot be replayed
              # as fresh financial evidence. The CLI must hard-block it.
              try:
                  source_tables(market, catalog, book)
              except RotationError as error:
                  assert str(error) == 'untrusted_single_year_annual_reference', str(error)
              else:
                  raise AssertionError('stale annual reference was erroneously accepted')
              print('Read-only rotation waiting for same-day DART census; '
                    'no provider calls, score promotion or new publication')
          else:
              subprocess.run([sys.executable, 'v3_weekly_rotation.py',
                              '--when', when, '--mode', 'audit'], check=True)
              report = json.loads(
                  Path('reports/v3-weekly-rotation-audit.json')
                  .read_text(encoding='utf-8'))
              assert report['source_collection_calls'] == 0
              assert (report['processed_this_cycle'] + report['unprocessed_this_cycle']
                      == report['listed_total'])
              assert (report['all_issuers_updated_this_cycle'] is
                      (report['unprocessed_this_cycle'] == 0))
              # The fixed-roster unit test proves the normal 1/7 cadence.
              # A newly listed issuer can shift sorted bucket boundaries;
              # legitimate same-cycle catch-up may exceed a single seventh.
              assert (0 <= report['processed_today']
                      <= report['processed_this_cycle']
                      <= report['listed_total'])
              print('Saved-source rotation audit (no provider calls):',
                    report['processed_today'], 'today,',
                    report['unprocessed_this_cycle'], 'remaining')
          PY
