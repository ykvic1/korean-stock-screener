name: Quant v2.1 correctness checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [upgrade-v21-quant]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile screener.py quant_engine.py quant_fetch_history.py quant_excel.py official_data.py publish_quant.py recommendation_engine.py
      - name: Kiwoom Windows PowerShell offline mock (no credentials or network)
        shell: pwsh
        run: ./scripts/kiwoom_readonly_probe.ps1 -OfflineSelfTest
      - name: Kiwoom 3-page Windows PowerShell synthetic pagination (no network or keys)
        shell: pwsh
        run: ./scripts/kiwoom_pagination_probe.ps1 -OfflineSelfTest
      - name: OCI installer syntax only (no cloud access, no secrets)
        run: bash -n deploy/oci_prepare.sh
      - name: KRX website investor flow offline contract (no network or keys)
        run: python -m unittest discover -s tests -p 'test_v3_krx_website_flow_pilot.py' -v
      - name: KRX official two-market private staging offline contract (no keys or network)
        run: python -m unittest discover -s tests -p 'test_v3_krx_private_daily.py' -v
      - name: v3 market-scoped IAS/momentum/FCF overlap and rank-correlation diagnostics (synthetic only)
        run: |
          python -m py_compile v3_factor_overlap_audit.py
          python -m unittest discover -s tests -p 'test_v3_factor_overlap_audit.py' -v
      - name: v3 industry membership complete-cohort cycle and MA60 breadth (synthetic only)
        run: |
          python -m py_compile v3_industry_feature_adapter.py
          python -m unittest discover -s tests -p 'test_v3_industry_feature_adapter.py' -v
      - name: v3 4-year reported KRW financial cashflow growth and valuation raw feature calculations
        run: |
          python -m py_compile v3_financial_feature_adapter.py
          python -m unittest discover -s tests -p 'test_v3_financial_feature_adapter.py' -v
      - name: v3 runnable 64-stock synthetic six-pillar IAS + technical + portfolio risk workbench
        run: |
          python -m py_compile v3_offline_workbench.py
          python -m unittest discover -s tests -p 'test_v3_offline_workbench.py' -v
          python -m v3_offline_workbench --demo > /dev/null
      - name: v3 causal daily-weekly OHLCV to technical, OBV and momentum research features
        run: |
          python -m py_compile v3_price_feature_adapter.py
          python -m unittest discover -s tests -p 'test_v3_price_feature_adapter.py' -v
      - name: v3 executable 6-pillar raw features and IAS cohort normalization (synthetic only)
        run: |
          python -m py_compile v3_research_factor_engine.py
          python -m unittest discover -s tests -p 'test_v3_research_factor_engine.py' -v
      - name: v3 complete six-factor and IAS scoring contract offline checks
        run: python -m unittest discover -s tests -p 'test_v3_score_contract.py' -v
      - name: v3 walk-forward historical loss/target research and lookahead guard (synthetic only)
        run: |
          python -m py_compile v3_walkforward_research.py
          python -m unittest discover -s tests -p 'test_v3_walkforward_research.py' -v
      - name: v3 private local KRX two-market SQLite immutable archive and tamper check (mock only)
        run: |
          python -m py_compile v3_local_private_store.py
          python -m unittest discover -s tests -p 'test_v3_local_private_store.py' -v
      - name: v3 PIT/corporate-event quality-gated five-horizon walk-forward (synthetic only)
        run: |
          python -m py_compile v3_walkforward_quality_gate.py
          python -m unittest discover -s tests -p 'test_v3_walkforward_quality_gate.py' -v
      - name: v3 PIT aligned issuer, flow, filing and industry join contract (synthetic only)
        run: |
          python -m py_compile v3_pit_join.py
          python -m unittest discover -s tests -p 'test_v3_pit_join.py' -v
      - name: v3 two-market private evidence chain integrity and tamper/fork guard (synthetic only)
        run: |
          python -m py_compile v3_evidence_chain.py
          python -m unittest discover -s tests -p 'test_v3_evidence_chain.py' -v
      - name: v3 IAS 20/60/120/250-flow ledger no-double-count safeguards (synthetic only)
        run: |
          python -m py_compile v3_ias_flow_ledger.py
          python -m unittest discover -s tests -p 'test_v3_ias_flow_ledger.py' -v
      - name: v3 PIT historical universe and corporate-action quarantine (synthetic only)
        run: |
          python -m py_compile v3_historical_integrity.py
          python -m unittest discover -s tests -p 'test_v3_historical_integrity.py' -v
      - name: v3 portfolio downside budget, concentration and gap stress (synthetic only)
        run: |
          python -m py_compile v3_portfolio_risk.py
          python -m unittest discover -s tests -p 'test_v3_portfolio_risk.py' -v
      - name: Small technical watchlist offline safety checks (no APIs)
        run: node tests/test_v22_practical_watchlist.js
      - name: Full KOSPI-KOSDAQ universe without size count or turnover caps (offline)
        run: python -m unittest discover -s tests -p 'test_universe_rotation.py' -v
      - name: Complete-market 100-stock job slices and fail-closed aggregate (no network)
        run: python -m unittest discover -s tests -p 'test_full_market_batch.py' -v
      - name: Full-market evidence-led research selection, no forced20, daily entry/exit tracking
        run: python -m unittest discover -s tests -p 'test_recommendation_engine.py' -v
      - name: Top20 per-stock deep analysis published UI and stale fail-closed rendering
        run: node tests/test_recommendation_site.js
      - name: Client score normalization of obtained weight only, 70/85=82.3
        run: node tests/test_partial_score_ui.js
      - name: Investor-first homepage, stock-level quant lookup and automatic price-quality status
        run: node tests/test_stock_research_home.js
      - name: Syntax of new research UI JavaScript and patchnotes HTML
        run: |
          node --check docs/stock_research.js
          node --check docs/stock_research_ui.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
              pass
          P().feed(Path('docs/patch-notes.html').read_text(encoding='utf-8'))
          PY
      - name: JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          for p in (Path('docs/index.html'),Path('docs/quant.html')):
              js='\n'.join(re.findall(r'<script>(.*?)</script>',p.read_text(),flags=re.S))
              temp=Path('/tmp/'+p.stem+'.js');temp.write_text(js)
              subprocess.run(['node','--check',str(temp)],check=True)
          PY
