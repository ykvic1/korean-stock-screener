name: Quant v2.1 correctness checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [upgrade-v21-quant]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile screener.py quant_engine.py quant_fetch_history.py quant_excel.py official_data.py publish_quant.py
      - name: Kiwoom Windows PowerShell offline mock (no credentials or network)
        shell: pwsh
        run: ./scripts/kiwoom_readonly_probe.ps1 -OfflineSelfTest
      - name: Kiwoom 3-page Windows PowerShell synthetic pagination (no network or keys)
        shell: pwsh
        run: ./scripts/kiwoom_pagination_probe.ps1 -OfflineSelfTest
      - name: OCI installer syntax only (no cloud access, no secrets)
        run: bash -n deploy/oci_prepare.sh
      - name: KRX website investor flow offline contract (no network or keys)
        run: python -m unittest discover -s tests -p 'test_v3_krx_website_flow_pilot.py' -v
      - name: KRX official two-market private staging offline contract (no keys or network)
        run: python -m unittest discover -s tests -p 'test_v3_krx_private_daily.py' -v
      - name: v3 complete six-factor and IAS scoring contract offline checks
        run: python -m unittest discover -s tests -p 'test_v3_score_contract.py' -v
      - name: Small technical watchlist offline safety checks (no APIs)
        run: node tests/test_v22_practical_watchlist.js
      - name: 200-stock display and rotating 210-stock history window contract
        run: python -m unittest discover -s tests -p 'test_universe_rotation.py' -v
      - name: JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          for p in (Path('docs/index.html'),Path('docs/quant.html')):
              js='\n'.join(re.findall(r'<script>(.*?)</script>',p.read_text(),flags=re.S))
              temp=Path('/tmp/'+p.stem+'.js');temp.write_text(js)
              subprocess.run(['node','--check',str(temp)],check=True)
          PY
