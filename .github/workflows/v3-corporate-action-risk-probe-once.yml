name: One-shot real private KRX derived discontinuity risk audit

on:
  push:
    branches: [v3-corporate-action-risk-flags-real-derived-20261020]
    paths:
      - .github/workflows/v3-corporate-action-risk-probe-once.yml

permissions:
  contents: read

concurrency:
  group: v3-krx-private-derived-history
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-corporate-action-risk-flags-real-derived-20261020
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local session calendar and imported official-source validator dependencies
        run: python -m pip install 'requests>=2.31,<3' 'exchange-calendars==4.13.1'
      - name: Verify false positive guards, source integrity and no KRX calls
        run: |
          set -euo pipefail
          python -m py_compile v3_krx_derived_corporate_action_risk.py
          python -m unittest discover -s tests -p 'test_v3_krx_derived_corporate_action_risk.py' -v
      - name: Flag price discontinuity risk in actually saved private derived history
        env:
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
        run: |
          set -euo pipefail
          python v3_krx_derived_corporate_action_risk.py
