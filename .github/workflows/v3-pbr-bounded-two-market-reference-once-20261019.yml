name: One-Time Two-Market PBR Reference Feasibility 2026-10-19

on:
  push:
    branches: [research-pbr-all-current-stocks-two-request-pilot-20261019]

permissions:
  contents: read

jobs:
  two-market-pbr-reference-research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-pbr-all-current-stocks-two-request-pilot-20261019
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded PBR public-market research provider
        run: |
          python -m pip install 'pykrx>=1.0.48' 'pandas>=2,<3'
      - name: Offline two-market cohort safety and no raw-data publication
        run: |
          python -m py_compile v3_two_market_pbr_feasibility_once.py
          python -m unittest discover -s tests -p 'test_v3_two_market_pbr_feasibility_once.py' -v
      - name: Read ONLY two KOSPI KOSDAQ fundamentals snapshots and print aggregate readiness
        run: |
          python v3_two_market_pbr_feasibility_once.py
      - name: State that source permission and scoring are not established
        run: |
          echo 'Aggregate feasibility only. No stock-level PBR/raw frames persisted or republished.'
          echo 'Current dates, issue correction, licensing and PIT not independently verified.'
