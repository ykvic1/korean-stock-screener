name: V3.0b Manual Complete-Market Dated Source Collection
# One deliberately pinned manual same-KST-day acquisition for the
# completed 2026-11-12 session, after 21:00 and only from a verified prior
# day's published market census. No extra schedule: the independent
# 02:30 KST nightly collector remains unchanged.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v3-manual-complete-market-dated-source.yml
  workflow_dispatch:
    inputs:
      asof:
        description: 'Exact completed market date YYYY-MM-DD; must match published saved session'
        type: string
        required: true

permissions:
  contents: read
  actions: write

concurrency:
  group: korea-stock-screener-manual-dated-market-dispatch
  cancel-in-progress: false

jobs:
  dispatch-one-complete-market-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate latest completed session and exclude current intraday trading
        env:
          REQUESTED_ASOF: ${{ github.event_name == 'push' && '2026-11-12' || inputs.asof }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import date, datetime, timedelta
          from pathlib import Path
          from v3_aftermarket_cutoff import KST, target_policy
          asof = os.environ['REQUESTED_ASOF']
          assert date.fromisoformat(asof).isoformat() == asof, 'invalid_exact_source_date'
          catalog = json.loads(Path('docs/v22-market-catalog.json').read_text())
          priority = json.loads(Path('docs/v3-operational-evidence-priority.json').read_text())
          saved_asof = catalog.get('date')
          if (priority.get('asof') != saved_asof
                  or catalog.get('listed_total') != priority.get('listed_total')
                  or priority.get('missing_is_not_zero') is not True
                  or type(catalog.get('listed_total')) is not int
                  or catalog['listed_total'] < 2000):
              raise SystemExit('manual_full_market_saved_session_mismatch')
          # A new completed trading day is allowed ONE calendar day after
          # the last successfully published closing roster. An old saved
          # scorecard only determines batch priority, NEVER current scores.
          # No stale roster is accepted as today's live listing: the actual
          # 100-stock workflow re-fetches the exact date-pinned source.
          if saved_asof != asof:
              saved_day = date.fromisoformat(saved_asof)
              target_day = date.fromisoformat(asof)
              if (target_day - saved_day != timedelta(days=1)
                      or target_day != datetime.now(KST).date()
                      or target_day.weekday() > 4):
                  raise SystemExit('manual_full_market_new_session_not_validated')
          if os.getenv('GITHUB_EVENT_NAME') == 'push' and saved_asof == asof:
              raise SystemExit('manual_full_market_already_published')
          policy = target_policy(asof)
          if policy['complete_session_by_clock'] is not True:
              raise SystemExit('manual_full_market_aftermarket_not_complete')
          print(json.dumps({
              'manual_source_asof': asof,
              'previous_saved_asof': saved_asof,
              'previous_listed_total': catalog['listed_total'],
              'previous_90_or_more': priority['coverage_90_first']['already_90_or_more'],
              'mode': 'publish_exact_complete_session',
              'date_pinned_live_listing_required_downstream': True,
              'freshest_source_price_date_must_equal_asof': True,
              'source_regular_close_certified': False,
              'consolidated_volume_certified': False,
              'new_score_points_claimed': 0,
          }, sort_keys=True))
          PY
      - name: Start existing bounded 100-stock full-market publish with pinned date
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_ASOF: ${{ github.event_name == 'push' && '2026-11-12' || inputs.asof }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/full-market-batches.yml/dispatches" \
            -f ref=main -f "inputs[asof]=$REQUESTED_ASOF" -f 'inputs[mode]=publish' --silent
          echo "Full-market scan dispatched; no claim of completed market observation yet."
