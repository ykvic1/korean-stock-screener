name: V3 Private Direct DART Receipt Fast Lane (Stop at 120 Months)

on:
  # Personal-use temporary catch-up: 24 ADDITIONAL bounded private batches
  # per day, until exactly 120 months. Existing 12 regular runs remain.
  # Shared concurrency lock, immutable private checkpoint and 72-call cap
  # prevent concurrent writes and accidental unbounded request bursts.
  schedule:
    - cron: '31 * * * *' # hourly at :31 UTC, up to 24 x 72 calls/day
  push:
    branches: [main]
    paths:
      - .github/workflows/v3-dart-historical-direct-fastlane.yml
  workflow_dispatch:
    inputs:
      mode:
        description: 'Manual collection: dry_run does not request DART; live adds at most 72 official calls'
        type: choice
        options: [dry_run, live]
        default: dry_run
        required: true

permissions:
  contents: read

concurrency:
  group: v3-dart-private-historical-event-receipts
  cancel-in-progress: false

jobs:
  additional-private-collection:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private Git storage transport only
        run: python -m pip install 'requests>=2.31,<3'
      - name: Validate bounded receipt parser and completion guard offline
        run: |
          set -euo pipefail
          python -m py_compile v3_dart_historical_event_receipts.py
          python -m unittest discover -s tests -p 'test_v3_dart_historical_event_receipts.py' -v
      - name: Skip at exactly 120 source-verified completed months
        id: completion
        if: >-
          ${{ github.event_name == 'schedule' ||
              (github.event_name == 'workflow_dispatch' && inputs.mode == 'live') ||
              (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'feat(v3.0b): continuous direct DART fast-lane until 120 months')) }}
        run: |
          set -euo pipefail
          python -c 'import json,os; from v3_dart_historical_event_receipts import public_progress_complete; d=json.load(open("docs/v3-dart-historical-receipt-progress.json",encoding="utf-8")); v="true" if public_progress_complete(d) else "false"; open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8").write("done="+v+"\n"); print("archive_120_months_gate_"+v)'
      - name: Collect up to max 72 more private official DART receipt pages
        if: ${{ steps.completion.outputs.done == 'false' }}
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
        run: |
          set -euo pipefail
          # No public receipts, API secrets or original filing bodies. Provider
          # quota status 020 fails closed; cursor is CAS-protected and resumable.
          # Once 120 months are done, Python collects zero provider calls even
          # if the anonymous public completion checkpoint has not refreshed.
          python v3_dart_historical_event_receipts.py
