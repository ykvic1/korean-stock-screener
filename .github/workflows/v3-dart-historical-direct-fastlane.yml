name: V3 Private Direct DART Receipt Fast Lane (Stop at 120 Months)

on:
  pull_request:
    paths:
      - .github/workflows/v3-dart-historical-direct-fastlane.yml
  # Existing hourly fast lane owns the catch-up lock while processing consecutive
  # 72-call private checkpoint segments. Once 120 months are done, it is a no-op.
  # One five-hour run may complete the remaining archive; standard short jobs
  # remain a fail-safe if quota or transport forces another attempt.
  schedule:
    - cron: '31 * * * *' # hourly UTC fallback; active long run supersedes short slots
  # GitHub may delay/drop scheduled events. A successfully completed short
  # official DART collection is also a safe, source-locked catch-up trigger.
  # No loop: the short collector does not listen to this workflow.
  workflow_run:
    workflows:
      - V3 Private Historical OpenDART Filing Receipts (Research Only)
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/v3-dart-historical-direct-fastlane.yml
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry_run tests offline; live resumes up to 50 bounded segments/5 hours'
        type: choice
        options: [dry_run, live]
        default: dry_run
        required: true

permissions:
  contents: read

jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private Git storage transport only
        run: python -m pip install 'requests>=2.31,<3'
      - name: Validate bounded receipt parser and completion guard offline
        run: |
          set -euo pipefail
          python -m py_compile v3_dart_historical_event_receipts.py v3_dart_continuous_catchup.py
          python -m unittest discover -s tests -p 'test_v3_dart_historical_event_receipts.py' -v
          python -m unittest discover -s tests -p 'test_v3_dart_continuous_catchup.py' -v
  additional-private-collection:
    needs: offline-safety
    if: >-
      ${{ github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'live') ||
          (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'feat(v3.0b): continuous direct DART fast-lane until 120 months')) ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'schedule' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # Offline tests never wait for or occupy the private ingestion queue.
    concurrency:
      group: v3-dart-private-historical-event-receipts
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private Git storage transport only
        run: python -m pip install 'requests>=2.31,<3'
      - name: Skip at exactly 120 source-verified completed months
        id: completion
        run: |
          set -euo pipefail
          python -c 'import json,os; from v3_dart_historical_event_receipts import public_progress_complete; d=json.load(open("docs/v3-dart-historical-receipt-progress.json",encoding="utf-8")); v="true" if public_progress_complete(d) else "false"; open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8").write("done="+v+"\n"); print("archive_120_months_gate_"+v)'
      - name: Finish private DART archive through chained 72-page checkpoints
        if: ${{ steps.completion.outputs.done == 'false' }}
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
        run: |
          set -euo pipefail
          # Each segment is limited to 72 official calls with read-back CAS.
          # A run stops after 50 segments or 5h, and restarts later if needed.
          # Quota failures stop safely; secrets, source and issuer IDs stay private.
          python v3_dart_continuous_catchup.py
