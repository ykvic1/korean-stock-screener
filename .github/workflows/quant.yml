name: Korean Stock Quant Study v2.1

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Korean Stock Screener v2
      - Full-Market 100-Stock Batches
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: korea-stock-screener-publication
  cancel-in-progress: false

jobs:
  study:
    # Never train/run from a failed source data update.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Unit tests and bias checks
        run: python -m unittest discover -s tests -v

      - name: Restore OHLCV history cache
        uses: actions/cache/restore@v4
        with:
          path: cache/quant_history
          key: quant-history-${{ github.run_id }}
          restore-keys: |
            quant-history-

      - name: Read source date
        id: source
        shell: bash
        run: |
          echo "asof=$(python -c 'import json;print(json.load(open("docs/data.json"))["date"])')" >> "$GITHUB_OUTPUT"

      - name: Fetch OHLCV history for research
        run: |
          python quant_fetch_history.py --asof "${{ steps.source.outputs.asof }}" --max-stocks 120

      - name: Store OHLCV cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/quant_history
          key: quant-history-${{ github.run_id }}

      - name: Compute forward-only historical outcomes
        id: engine
        continue-on-error: true
        run: |
          python quant_engine.py --asof "${{ steps.source.outputs.asof }}" --max-stocks 120

      - name: Export quant and combined dated Excel, optional official data
        if: always() && steps.engine.outcome != 'skipped'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python publish_quant.py
      - name: Re-evaluate dynamic deep dossiers with newly updated quant observations
        if: steps.engine.outcome == 'success'
        run: python recommendation_engine.py --snapshot docs/data.json --docs docs

      - name: Confirm every displayed candidate has been included in today's quant research
        if: steps.engine.outcome == 'success'
        run: |
          python v3_ranked_quant_coverage.py \
            --screen docs/data.json \
            --recommendations docs/recommendations.json \
            --quant docs/quant.json \
            --output docs/v3-quant-coverage.json \
            --assert-study-candidates
      - name: Refresh V3 ranked-candidate quant from SAME-DAY observed cohort
        if: steps.engine.outcome == 'success'
        run: |
          set -euo pipefail
          # Derived source-day quant for actual ranked candidates only.
          # Zero second market fetch; source history stays in private job cache.
          python v3_priority_quant_feed.py \
            --market docs/data.json \
            --recommendations docs/recommendations.json \
            --quant docs/quant.json \
            --output docs/v3-priority-quant.json
      - name: Commit dashboard and study results
        if: steps.engine.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/quant.json docs/official.json docs/history.json docs/archive/ docs/reports/ docs/recommendations.json docs/recommendation_history.json docs/v3-quant-coverage.json docs/v3-priority-quant.json
          git diff --cached --stat
          git add docs/reports/quant_*.xlsx 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Publish quant study ${{ steps.source.outputs.asof }}"
            git pull --rebase origin main
            python - <<'PY'
          import json
          from v3_ranked_quant_coverage import audit_recommended_quant
          market=json.load(open('docs/data.json',encoding='utf-8'))
          rec=json.load(open('docs/recommendations.json',encoding='utf-8'))
          study=json.load(open('docs/quant.json',encoding='utf-8'))
          published=json.load(open('docs/v3-quant-coverage.json',encoding='utf-8'))
          fresh=audit_recommended_quant(market,rec,study)
          if not fresh['quant_study_same_date'] or any(
                  fresh['candidate_status_counts'][key]
                  for key in ('awaiting_fresh_study',)):
              raise ValueError('failed_live_recommendation_quant_reconciliation')
          if published != fresh:
              raise ValueError('quant_research_document_and_market_mismatch')
          # Git may have rebased against another market data update.
          # Recheck that the exact committed V3 shortlist quant feed still
          # derives from the FINAL source-date files before any push.
          from v3_priority_quant_feed import build_priority_feed
          candidate=json.load(open('docs/v3-priority-quant.json',encoding='utf-8'))
          regenerated=build_priority_feed(market,rec,study)
          if candidate!=regenerated:
              raise ValueError('stale_ranked_priority_quant_after_rebase')
          PY
            git push origin HEAD:main
          fi

      - name: Upload audit and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quant-study-audit-${{ github.run_id }}
          path: |
            docs/quant.json
            docs/official.json
            cache/quant_history/cache_status.json
            reports/*.xlsx
          if-no-files-found: warn
          retention-days: 90

      - name: Report insufficient evidence as a failed research run
        if: steps.engine.outcome != 'success'
        run: |
          echo "Insufficient or failed historical study. Please inspect docs/quant.json and logs." >&2
          exit 1
