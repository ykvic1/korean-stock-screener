name: V3 Actual DART 3Y Cashflow and CAPEX (strict source-only pilot)

on:
  push:
    branches: [main]
    paths:
      - v3_dart_cashflow_enrichment.py
      - tests/test_v3_dart_cashflow_name_recheck.py
      - v3_dart_cashflow_factor_preview.py
      - v3_dart_cashflow_gap_audit.py
      - tests/test_v3_dart_cashflow_gap_audit.py
      - v3_dart_source_day_preflight.py
      - .github/workflows/v3-dart-cashflow.yml
  # Three serial exact-name recovery batches of at most 40 issuers each.
  # The saved receipt recheck marker skips prior checks in every next batch.
  # Each collector invocation independently enforces its 121-call budget.
  # 47 past the hour avoids the 29-minute
  # bulk-history slot. Dedicated concurrency avoids displacement by the
  # 18:30 full-market queue; source commits rebase on the latest main.
  # The existing bulk major-account collector remains independent.
  schedule:
    - cron: '47 * * * *'
  workflow_run:
    workflows:
      - V3 Bulk OpenDART Four-Year Listed History (100 issuers per request)
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry-run, live, recover-name-fallback]
        default: dry-run
        required: true

permissions:
  contents: write

concurrency:
  group: korea-stock-screener-dart-cashflow
  cancel-in-progress: false

jobs:
  cashflow-source:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore SAME listed-company DART identity cache as major-account runner
        uses: actions/cache@v4
        with:
          path: .cache/v3-dart-company-codes.json
          key: v3-dart-corp-map-v1-${{ hashFiles('docs/v22-market-catalog.json') }}
      - name: Run no-network receipt-matched IFRS and exact-name CAPEX tests
        # Changed code is covered by push/PR CI; manual dry-run retains tests.
        # Unchanged scheduled or manual-live refreshes use receipt verification.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run') }}
        run: |
          set -euo pipefail
          python -m py_compile v3_dart_cashflow_enrichment.py v3_dart_cashflow_factor_preview.py v3_dart_cashflow_gap_audit.py
          python -m unittest discover -s tests -p 'test_v3_dart_cashflow_enrichment.py' -v
          python -m unittest discover -s tests -p 'test_v3_dart_cashflow_name_recheck.py' -v
          python -m unittest discover -s tests -p 'test_v3_dart_cashflow_factor_preview.py' -v
          python -m unittest discover -s tests -p 'test_v3_dart_cashflow_gap_audit.py' -v
          python -m unittest discover -s tests -p 'test_v3_dart_source_day_preflight.py' -v
      - name: Install official DART HTTP dependencies for source collection
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'live' || inputs.mode == 'recover-name-fallback' }}
        run: python -m pip install 'requests>=2.31,<3'
      - name: Gate cashflow ingestion on the latest verified major-account market date
        id: date_gate
        run: |
          set -euo pipefail
          python v3_dart_source_day_preflight.py --kind major
      - name: Query verified annual cashflows then one-time exact-name CAPEX gaps
        id: cashflow_collection
        if: ${{ steps.date_gate.outputs.ready == 'true' }}
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'recover-name-fallback' }}
        run: |
          set -euo pipefail
          # A later batch may fail after earlier source-verified issuer-years
          # were saved. Publish those checkpoints first and fail the job after
          # publication; never treat an outage as a clean complete harvest.
          interrupted=0
          if [[ "$MODE" == "recover-name-fallback" ]]; then
            for round in 1 2 3; do
              echo "::group::Bounded source recovery batch $round/3"
              if ! python v3_dart_cashflow_enrichment.py --mode "$MODE" --issuer-limit 40 \
                      | tee /tmp/v3-cashflow-batch.json; then
                interrupted=1
              elif grep -q '"status": "partial_observed_cashflow_saved"' /tmp/v3-cashflow-batch.json; then
                interrupted=1
              fi
              echo "::endgroup::"
              if (( interrupted )); then break; fi
            done
          else
            if ! python v3_dart_cashflow_enrichment.py --mode "$MODE" --issuer-limit 40 \
                    | tee /tmp/v3-cashflow-batch.json; then
              interrupted=1
            elif grep -q '"status": "partial_observed_cashflow_saved"' /tmp/v3-cashflow-batch.json; then
              interrupted=1
            fi
          fi
          echo "interrupted=$interrupted" >> "$GITHUB_OUTPUT"
      - name: Publish derived cashflow ONLY after successfully validated source
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.mode == 'live' || inputs.mode == 'recover-name-fallback') && steps.date_gate.outputs.ready == 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f docs/v3-dart-cashflow-reference.json ]]; then
            python v3_dart_cashflow_factor_preview.py --mode write
            python v3_dart_cashflow_gap_audit.py --mode write --issuer-out docs/v3-dart-cashflow-issuer-evidence.json
            python v3_dart_cashflow_enrichment.py --mode verify
            python v3_dart_cashflow_factor_preview.py --mode verify
            python v3_dart_cashflow_gap_audit.py --mode verify --issuer-out docs/v3-dart-cashflow-issuer-evidence.json
            git add docs/v3-dart-cashflow-reference.json docs/v3-dart-fcf-research-preview.json docs/v3-dart-cashflow-gap-summary.json docs/v3-dart-cashflow-issuer-evidence.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Bounded official FY2023-2025 cashflow/CAPEX observations (no scores)"
            # Three bounded compare/rebase retries; not a second DART fetch.
            # Revised fiscal receipts are quarantined issuer/year-locally before publication;
            # stale market days, invalid snapshots and file conflicts fail closed.
            for attempt in 1 2 3; do
              git pull --rebase origin main
              # A concurrent major-account backfill may append new firms.
              # Rebind unchanged receipts only; any superseded fiscal year is
              # removed until independently refetched and matched.
              python v3_dart_cashflow_enrichment.py --mode rebind
              python v3_dart_cashflow_factor_preview.py --mode write
              python v3_dart_cashflow_gap_audit.py --mode write --issuer-out docs/v3-dart-cashflow-issuer-evidence.json
              git add docs/v3-dart-cashflow-reference.json docs/v3-dart-fcf-research-preview.json docs/v3-dart-cashflow-gap-summary.json docs/v3-dart-cashflow-issuer-evidence.json
              if ! git diff --cached --quiet; then
                git commit --amend --no-edit
              fi
              python v3_dart_cashflow_enrichment.py --mode verify
              python v3_dart_cashflow_factor_preview.py --mode verify
              python v3_dart_cashflow_gap_audit.py --mode verify --issuer-out docs/v3-dart-cashflow-issuer-evidence.json
              if git push origin HEAD:main; then
                echo "verified_cashflow_checkpoint_published"
                break
              fi
              if [[ "$attempt" == 3 ]]; then
                echo "::error::cashflow_publish_retries_exhausted"
                exit 1
              fi
            done
          fi
      - name: Report interrupted source only after preserving verified checkpoints
        if: ${{ steps.cashflow_collection.outputs.interrupted == '1' }}
        run: |
          echo "::error::cashflow_source_interrupted_after_publishing_valid_checkpoints"
          exit 1
      - name: Report real cashflow sources and missingness, never buy signals
        if: always()
        env:
          DAY_READY: ${{ steps.date_gate.outputs.ready }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          file=Path('docs/v3-dart-cashflow-reference.json')
          dest=Path(os.environ['GITHUB_STEP_SUMMARY'])
          lines=[
            '### V3 공식 재무현금흐름 실측 소스 · 매수 미인증',
            '단일회사 전체 재무제표에서 확인한 IFRS 표준 CF 계정 또는 같은 접수번호의 정확한 비표준 계정명만 이용합니다.',
            '비표준 계정명 재확인은 결측 회사·연도에 1회만 허용하며, 값이 없으면 결측으로 유지합니다.',
            'CAPEX 유형/무형 중 하나라도 없으면 FCF는 결측입니다.',
          ]
          if os.getenv("DAY_READY")!="true":
              lines.append('새 장마감일의 공식 DART 4개년 기준일 대기: 금회 API 호출 0, 신규 FCF 자료 0. 아래는 이전에 저장된 원장입니다.')
          if file.is_file():
              data=json.loads(file.read_text(encoding='utf8'))
              lines.extend('- '+k+': **'+str(v)+'**' for k,v in
                 data.get('metrics',{}).items())
              years=[year for company in data.get('records',{}).values()
                     for year in company.get('years',{}).values()]
              for field,label in (
                ('operating_cashflow_krw','CFO'),
                ('ppe_capex_krw','유형자산 취득액'),
                ('intangible_capex_krw','무형자산 취득액')):
                  lines.append('- '+label+' 미확인 회사·연도: **'+
                               str(sum(row.get(field) is None for row in years))+'**')
          else:
              lines.append('- 실제 소스 체크포인트 아직 없음')
          candidate=Path('docs/v3-dart-fcf-research-preview.json')
          if candidate.is_file():
              p=json.loads(candidate.read_text(encoding='utf8'))
              lines.append('- 3Y FCF/자산 진짜 원천 관측: **'+str(
                 p.get('real_fcf_assets_three_year_raw_issuer_count',0))+'**')
              lines.append('- 재무 FCF 4/15 연구점수 후보: **'+str(
                 p.get('financial_fcf4_research_candidate_issuer_count',0))+'**')
              lines.append('- 가치 FCF수익률 5/15 연구점수 후보: **'+str(
                 p.get('valuation_fcf5_research_candidate_issuer_count',0))+'**')
          gap=Path('docs/v3-dart-cashflow-gap-summary.json')
          if gap.is_file():
              g=json.loads(gap.read_text(encoding='utf8'))
              depth=g.get('three_year_issuer_depth')
              if isinstance(depth,dict):
                  lines.append('- 3Y FCF 기업별 미완성 원인(원천 연도 미취득 / 취득 후 계정 미확보 / 영수증 불일치 / 완전 확보): **'+
                      str(depth.get('saved_incomplete_years','미확인'))+' / '+
                      str(depth.get('three_years_attempted_missing_accounts','미확인'))+' / '+
                      str(depth.get('three_years_with_fcf_but_unmatched_receipts','미확인'))+' / '+
                      str(depth.get('three_year_source_receipt_complete','미확인'))+'**')
                  lines.append('- 현금흐름 자료를 전혀 저장 못한 종목: **'+
                      str(depth.get('no_saved_cashflow_years','미확인'))+'**')
                  lines.append('- 현재 공식 연차 영수증이 있어 추가 수집 가능한 기업·연도: **'+
                      str(g.get('source_eligible_unfetched_company_years','미확인'))+'**')
          lines.append('미확인 항목 0원 추정 없음; IAS·산업·재무15·가치15·PIT 인증 없음.')
          dest.write_text('\n'.join(lines)+'\n',encoding='utf8')
          PY
