name: V3 Actual DART 3Y Cashflow and CAPEX (strict source-only pilot)

on:
  push:
    branches: [main]
    paths:
      - v3_dart_cashflow_enrichment.py
      - .github/workflows/v3-dart-cashflow.yml
  # Twelve source-qualified issuers x three annual reports per two hours.
  # The existing bulk major-account collector remains independent.
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry-run, live]
        default: dry-run
        required: true

permissions:
  contents: write

concurrency:
  group: korea-stock-screener-publication
  cancel-in-progress: false

jobs:
  cashflow-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore SAME listed-company DART identity cache as major-account runner
        uses: actions/cache@v4
        with:
          path: .cache/v3-dart-company-codes.json
          key: v3-dart-corp-map-v1-${{ hashFiles('docs/v22-market-catalog.json') }}
      - name: Run no-network exact-IFRS cashflow and no-fabrication tests
        run: |
          set -euo pipefail
          python -m py_compile v3_dart_cashflow_enrichment.py
          python -m unittest discover -s tests -p 'test_v3_dart_cashflow_enrichment.py' -v
      - name: Install official DART HTTP dependencies only in live mode
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'live' }}
        run: python -m pip install 'requests>=2.31,<3'
      - name: Query only genuine fiscal 2023-2025 annual statement cashflows
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
        run: |
          set -euo pipefail
          python v3_dart_cashflow_enrichment.py --mode "$MODE" --issuer-limit 12
      - name: Publish derived cashflow ONLY after successfully validated source
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'live' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f docs/v3-dart-cashflow-reference.json ]]; then
            git add docs/v3-dart-cashflow-reference.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Bounded official FY2023-2025 cashflow/CAPEX observations (no scores)"
            git pull --rebase origin main
            python v3_dart_cashflow_enrichment.py --mode verify
            git push origin HEAD:main
          fi
      - name: Report real cashflow sources and missingness, never buy signals
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          file=Path('docs/v3-dart-cashflow-reference.json')
          dest=Path(os.environ['GITHUB_STEP_SUMMARY'])
          lines=[
            '### V3 공식 재무현금흐름 실측 소스 · 매수 미인증',
            '단일회사 전체 재무제표에서 실제 확인된 표준 계정만 이용합니다.',
            'CAPEX 유형/무형 중 하나라도 없으면 FCF는 결측입니다.',
          ]
          if file.is_file():
              data=json.loads(file.read_text(encoding='utf8'))
              lines.extend('- '+k+': **'+str(v)+'**' for k,v in
                 data.get('metrics',{}).items())
          else:
              lines.append('- 실제 소스 체크포인트 아직 없음')
          lines.append('미확인 항목 0원 추정 없음; IAS·산업·재무15·가치15·PIT 인증 없음.')
          dest.write_text('\n'.join(lines)+'\n',encoding='utf8')
          PY
