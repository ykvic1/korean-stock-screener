name: V3 Original Annual Parent Equity Recovery
on:
  pull_request:
    paths:
      - v3_dart_xbrl_parent_equity.py
      - v3_current_observed_scorecard.py
      - tests/test_v3_dart_xbrl_parent_equity.py
      - .github/workflows/v3-original-parent-equity.yml
  push:
    branches: [main]
    paths:
      - v3_dart_xbrl_parent_equity.py
      - .github/workflows/v3-original-parent-equity.yml
  workflow_dispatch:
  workflow_run:
    workflows:
      - V3 Verified Parent Equity Receipt Recovery
    types: [completed]
  schedule:
    - cron: '22 11 * * 1-5'
permissions:
  contents: read
jobs:
  offline:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      remaining: ${{ steps.work.outputs.remaining }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject unsupported source facts and forged receipt proofs
        id: work
        run: |
          python - <<'PY'
          import json, os, subprocess
          result=json.loads(subprocess.check_output([
              'python','v3_dart_xbrl_parent_equity.py','--mode','dry-run'],text=True))
          remaining=result.get('remaining')
          if type(remaining) is not int or remaining<0 or result.get('provider_calls')!=0:
              raise SystemExit('untrusted_parent_equity_work_plan')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f'remaining={remaining}\n')
          print(json.dumps({'unreviewed_parent_equity_remaining':remaining,'provider_calls':0}))
          PY
  recover:
    needs: offline
    if: github.event_name != 'pull_request' && needs.offline.outputs.remaining != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: write
    concurrency:
      group: v3-dart-parent-equity-supplement
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: .cache/v3-dart-company-codes.json
          key: v3-dart-corp-map-v1-${{ hashFiles('docs/v22-market-catalog.json') }}
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Read original same-instance CFO total equity and parent-equity facts
        id: collect
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          set -euo pipefail
          interrupted=0
          reviewed=0
          new=0
          if result="$(python v3_dart_xbrl_parent_equity.py --mode live)"; then
            echo "$result"
            reviewed="$(printf '%s' "$result" | python -c 'import json,sys; print(json.load(sys.stdin)["reviewed"])')"
            new="$(printf '%s' "$result" | python -c 'import json,sys; print(json.load(sys.stdin)["new_recoveries"])')"
          else
            echo "$result"
            interrupted=1
          fi
          echo "interrupted=$interrupted" >> "$GITHUB_OUTPUT"
          echo "reviewed=$reviewed" >> "$GITHUB_OUTPUT"
          echo "new_recoveries=$new" >> "$GITHUB_OUTPUT"
      - name: Verify and publish same-receipt proof, preserving commits through retries
        id: publish
        run: |
          set -euo pipefail
          python v3_dart_xbrl_parent_equity.py --mode verify
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          paths=()
          for path in docs/v3-dart-parent-equity-supplement.json docs/v3-dart-parent-equity-original-reviews.json; do
            if [ -f "$path" ]; then paths+=("$path"); fi
          done
          if [[ ${#paths[@]} == 0 ]]; then exit 0; fi
          git add "${paths[@]}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Recover CFO-anchored original annual parent equity'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            python v3_dart_xbrl_parent_equity.py --mode verify
            if git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo '::error::verified_parent_equity_push_retries_exhausted'
          exit 1
      - name: Replay authenticated valuation into current and R1d scorecards
        if: steps.publish.outputs.changed == 'true' && (steps.collect.outputs.new_recoveries != '0' || steps.collect.outputs.interrupted == '1')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/v3-current-observed-scorecard.yml/dispatches" -f ref=main -f 'inputs[mode]=write' --silent
      - name: Surface any provider interruption after publishing validated proofs
        if: steps.collect.outputs.interrupted == '1'
        run: exit 1
      - name: Continue only after actual source progress
        if: steps.publish.outputs.changed == 'true' && steps.collect.outputs.interrupted == '0' && steps.collect.outputs.reviewed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remaining="$(python v3_dart_xbrl_parent_equity.py --mode dry-run | python -c 'import json,sys; d=json.load(sys.stdin); assert d["provider_calls"]==0; print(d["remaining"])')"
          if [[ "$remaining" =~ ^[0-9]+$ ]] && (( remaining > 0 )); then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/v3-original-parent-equity.yml/dispatches" -f ref=main --silent
          fi
