name: V3 Verified Parent Equity Receipt Recovery
on:
  pull_request:
    paths:
      - v3_dart_parent_equity_recovery.py
      - v3_current_observed_scorecard.py
      - tests/test_v3_dart_parent_equity_recovery.py
      - .github/workflows/v3-parent-equity-recovery.yml
  push:
    branches: [main]
    paths:
      - v3_dart_parent_equity_recovery.py
      - .github/workflows/v3-parent-equity-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject unsupported source facts and forged receipt proofs
        run: |
          python -m unittest discover -s tests -p 'test_v3_dart_parent_equity_pilot.py' -v
          python -m unittest discover -s tests -p 'test_v3_dart_parent_equity_recovery.py' -v
          python -m unittest discover -s tests -p 'test_v3_current_observed_scorecard.py' -v
          python v3_dart_parent_equity_recovery.py --mode dry-run
  recover:
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: write
    concurrency:
      group: v3-dart-parent-equity-supplement
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: .cache/v3-dart-company-codes.json
          key: v3-dart-corp-map-v1-${{ hashFiles('docs/v22-market-catalog.json') }}
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Capture strictly reconciled reported noncontrolling equity without raw rows
        id: collect
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          set -euo pipefail
          interrupted=0
          if ! python v3_dart_parent_equity_recovery.py --mode live; then interrupted=1; fi
          echo "interrupted=$interrupted" >> "$GITHUB_OUTPUT"
      - name: Verify and publish same-receipt proof, preserving commits through retries
        id: publish
        run: |
          set -euo pipefail
          python v3_dart_parent_equity_recovery.py --mode verify
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ ! -f docs/v3-dart-parent-equity-supplement.json ]; then exit 0; fi
          git add docs/v3-dart-parent-equity-supplement.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record receipt-matched parent equity from explicit NCI'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            python v3_dart_parent_equity_recovery.py --mode verify
            if git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo '::error::verified_parent_equity_push_retries_exhausted'
          exit 1
      - name: Replay authenticated valuation into current and R1d scorecards
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/v3-current-observed-scorecard.yml/dispatches" -f ref=main -f 'inputs[mode]=write' --silent
      - name: Surface any provider interruption after publishing validated proofs
        if: steps.collect.outputs.interrupted == '1'
        run: exit 1
