name: V3 Exact Official Historical Gap MA Recovery

on:
  push:
    branches: [main]
    paths: [v3_official_gap_ma_recovery.py, .github/workflows/v3-official-gap-ma-recovery.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: korea-stock-screener-publication
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt 'exchange-calendars==4.13.1'
      - name: Match official closing anchors and recover the exact missing session
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python v3_official_gap_ma_recovery.py
      - name: Validate and publish derived MA and completed-week RSI evidence
        id: publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- docs/data.json; then
            python v22_full_universe_audit.py --daily docs/data.json
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          git add docs/data.json docs/v3-official-gap-ma-recovery.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish derived MA and weekly RSI evidence from KRX gap recovery'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Refresh the operational scorecard
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run v3-operational-research-score.yml --repo "$GITHUB_REPOSITORY" --ref main
