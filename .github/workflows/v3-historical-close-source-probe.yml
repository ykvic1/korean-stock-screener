name: V3 Priority Historical Close Source Comparison

on:
  push:
    branches: [main]
    paths:
      - v3_historical_close_source_probe.py
      - .github/workflows/v3-historical-close-source-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-historical-close-source-probe
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3' 'pandas>=2,<3'
      - name: Crosscheck alternative historic closes using official KRX
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python v3_historical_close_source_probe.py --mode live
      - name: Publish the dated comparison counts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/v3-historical-close-source-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record official historical close comparison counts'
          git pull --rebase origin main
          git push origin HEAD:main
