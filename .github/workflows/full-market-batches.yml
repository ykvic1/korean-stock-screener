name: Full-Market 100-Stock Batches

on:
  # One real full-market audit (2498 attempted/2369 priced) already passed.
  # Automatically recompute ALL surviving ordinary stocks in 100-stock slices
  # on weekdays; this replaces the legacy time-limited daily schedule.
  schedule:
    # 02:30 KST Tuesday-Saturday (17:30 UTC Monday-Friday), targeting the
    # PRIOR KST calendar day. Actual source daily CSVs were refreshed after
    # 21:30 on multiple recently observed sessions (e.g. 23:19 on Nov 10).
    # This reduces the risk of hashing a still-changing after-market source.
    - cron: '30 17 * * 1-5' # 02:30 KST Tue-Sat: prior weekday data
    - cron: '30 22 * * 1-5' # 07:30 KST Tue-Sat: recover unpublished data
  # Run in the next day's early hours after BOTH KRX and NXT evening
  # sessions. Scheduling later lets the daily provider settle, but does NOT
  # turn FChart prices into certified
  # KRX 15:30 regular closes or certify KRX+NXT consolidated volumes.
  # Code pushes must
  # not start another 2,500-history scrape during intraday trading or duplicate
  # a close-of-day batch. Use workflow_dispatch with an explicit asof for a
  # genuine urgent backfill, and keep its default mode read-only (audit).
  workflow_dispatch:
    inputs:
      asof:
        description: 'Manual asof YYYY-MM-DD; empty = today KST. Scheduled 02:30 KST uses previous day.'
        required: false
        default: ''
        type: string
      mode:
        description: 'audit = no Pages updates; publish = successful chunks with explicit incomplete coverage. Scheduled after-close runs publish.'
        required: true
        default: audit
        type: choice
        options: [audit, publish]

permissions:
  contents: read

# Reuse existing publication lock; do not publish racing daily/quant reports.
concurrency:
  group: korea-stock-screener-publication
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      already_published: ${{ steps.census.outputs.already_published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Skip another scheduled scan when the target is already published
        id: census
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          target=$(TZ=Asia/Seoul date --date=yesterday +%F)
          if jq -e --arg target "$target" '.date == $target' docs/data.json >/dev/null &&
             jq -e --arg target "$target" '.date == $target' docs/v22-market-catalog.json >/dev/null; then
            echo 'already_published=true' >> "$GITHUB_OUTPUT"
            echo "Market snapshot and catalog are already published for $target"
          fi
      - name: Install full market listing dependencies
        if: steps.census.outputs.already_published != 'true'
        run: pip install -r requirements.txt
      # Source computation tests are checked by code-change CI, not rerun
      # on every unchanged-data collection schedule.
      - id: plan
        if: steps.census.outputs.already_published != 'true'
        name: Plan all stocks, codes only, chunks of 100
        env:
          REQUESTED_ASOF: ${{ inputs.asof }}
          # FDR cached exact-day market listing is publicly date-indexed;
          # do not require private KRX login for issuer roster discovery.
        shell: bash
        run: |
          set -euo pipefail
          # Public same-day saved roster is an audit-only continuation when
          # KRX listing authentication is unavailable. Scheduled/manual
          # publication still requires the live listing and will fail closed.
          fallback_args=(--priority-file docs/v3-operational-evidence-priority.json --priority-catalog docs/v22-market-catalog.json)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.mode }}" == "audit" ]]; then
            fallback_args+=(--fallback-catalog docs/v22-market-catalog.json)
          fi
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            # Never use the runtime's post-midnight "today" as the market date.
            # Delayed starts can still use the prior date before 09:00 KST.
            python full_market_batch.py plan --date-pinned-roster --overnight-previous-day --out batch-plan "${fallback_args[@]}"
          elif [[ -n "$REQUESTED_ASOF" ]]; then
            python full_market_batch.py plan --date-pinned-roster --asof "$REQUESTED_ASOF" --out batch-plan "${fallback_args[@]}"
          else
            python full_market_batch.py plan --date-pinned-roster --out batch-plan "${fallback_args[@]}"
          fi
          # Fail before launching up to 25 costly worker jobs if manual
          # publication is requested while either evening venue is open.
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.mode }}" == "publish" ]]; then
            python v3_aftermarket_cutoff.py --manifest batch-plan/manifest.json --published-snapshot docs/data.json
          fi
          echo "matrix=$(python -c 'import json;print(json.dumps(json.load(open("batch-plan/matrix.json")),separators=(",",":")))')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.census.outputs.already_published != 'true'
        with:
          name: market-code-plan-${{ github.run_id }}
          path: batch-plan/manifest.json
          retention-days: 1
          if-no-files-found: error

  analyze:
    needs: prepare
    if: needs.prepare.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: market-code-plan-${{ github.run_id }}
          path: batch-plan
      - name: Analyze this 100-stock chunk
        env:
          CHUNK_INDEX: ${{ matrix.part }}
        shell: bash
        run: |
          set -euo pipefail
          python full_market_batch.py scan \
            --manifest batch-plan/manifest.json \
            --part "$CHUNK_INDEX" --out batch-parts --workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: market-part-${{ github.run_id }}-${{ matrix.part }}
          path: batch-parts/part-*.json
          if-no-files-found: error
          retention-days: 1

  combine:
    needs: [prepare, analyze]
    outputs:
      published: ${{ steps.publish.outputs.published }}
    # An isolated 100-stock worker can fail without discarding all successful
    # batch results. Account for missing whole jobs as UNATTEMPTED, not zero.
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.already_published != 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: market-code-plan-${{ github.run_id }}
          path: batch-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: market-part-${{ github.run_id }}-*
          merge-multiple: true
          path: batch-parts
      - name: Refuse same-day publication before all aftermarket sessions close
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'publish' }}
        run: python v3_aftermarket_cutoff.py --manifest batch-plan/manifest.json
      - name: Reconcile batch census; schedule publishes, manual audit is read-only
        env:
          MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode }}
          # publish() re-reads the same exact-day public cache and verifies
          # its SHA-256 before joining issuer identities. KRX login secrets
          # remain optional here for the separately scoped investor flow.
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODE" == "publish" ]]; then
            python -m playwright install --with-deps chromium
            python full_market_batch.py merge \
              --manifest batch-plan/manifest.json --parts batch-parts --publish
          else
            python full_market_batch.py merge \
              --manifest batch-plan/manifest.json --parts batch-parts
          fi
      - name: Reconcile every stock outcome before public v2.2 publication
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'publish' }}
        run: |
          set -euo pipefail
          # Generated report is ONLY aggregate coverage and error categories;
          # fail-closed if any attempted stock has no accountably distinct outcome.
          python v22_full_universe_audit.py \
            --daily docs/data.json --output docs/v22-coverage.json
      - name: Audit research-only daily path source availability (no extra investment points)
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'publish' }}
        run: |
          set -euo pipefail
          python v3_unscored_path_coverage.py --daily docs/data.json --output docs/v3-unscored-path-coverage.json
          python v3_unscored_path_coverage.py --verify --daily docs/data.json --output docs/v3-unscored-path-coverage.json
      - name: Publish ONE final v2 Pages/Excel snapshot after complete union
        id: publish
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'publish' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/history.json docs/recommendations.json docs/recommendation_history.json docs/v22-coverage.json docs/v3-unscored-path-coverage.json docs/v22-market-catalog.json docs/v22-partial-history.json docs/reports/ docs/archive/
          if ! git diff --cached --quiet; then
            git commit -m "Full-market batch-derived v2 screen"
            # A delayed manual job must not restore an older trading day.
            # A concurrent push after this fetch is rejected by Git.
            git fetch origin main
            git show FETCH_HEAD:docs/data.json > "$RUNNER_TEMP/published-market.json"
            python v3_aftermarket_cutoff.py --manifest batch-plan/manifest.json \
              --published-snapshot "$RUNNER_TEMP/published-market.json"
            git rebase FETCH_HEAD
            git push origin HEAD:main
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Keep only final derived Excel and failure audit after requested publication
        if: ${{ always() && (github.event_name == 'schedule' || inputs.mode == 'publish') }}
        uses: actions/upload-artifact@v4
        with:
          name: full-market-final-report-${{ github.run_id }}
          path: |
            reports/*.xlsx
            logs/
          if-no-files-found: warn
          retention-days: 30

  dispatch-close-followups:
    needs: combine
    if: needs.combine.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - workflow: v3-rolling-dart-annual-book.yml
          - workflow: v3-regular-close-indicators.yml
          - workflow: v3-current-price-replay.yml
            mode: write
    steps:
      # A catchup dispatch can already be at the workflow_run chain limit.
      # Use explicit dispatches after the census has been pushed to main.
      - name: Start saved-census followup
        env:
          GH_TOKEN: ${{ github.token }}
          FOLLOWUP: ${{ matrix.workflow }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$MODE" ]]; then args+=(-f "mode=$MODE"); fi
          gh workflow run "$FOLLOWUP" --repo "$GITHUB_REPOSITORY" --ref main "${args[@]}"
