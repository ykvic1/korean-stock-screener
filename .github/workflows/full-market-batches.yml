name: Full-Market 100-Stock Batches

on:
  # One real full-market audit (2498 attempted/2369 priced) already passed.
  # Automatically recompute ALL surviving ordinary stocks in 100-stock slices
  # on weekdays; this replaces the legacy time-limited daily schedule.
  schedule:
    - cron: '30 12 * * 1-5' # 21:30 KST, 90 minutes after 20:00 aftermarket close
  # Run once after BOTH KRX and NXT evening sessions. Scheduling later lets
  # the daily provider settle; it does NOT turn FChart prices into certified
  # KRX 15:30 regular closes or certify KRX+NXT consolidated volumes.
  # Code pushes must
  # not start another 2,500-history scrape during intraday trading or duplicate
  # a close-of-day batch. Use workflow_dispatch with an explicit asof for a
  # genuine urgent backfill, and keep its default mode read-only (audit).
  workflow_dispatch:
    inputs:
      asof:
        description: 'Korean market date YYYY-MM-DD; empty = today KST (scheduled 21:30)'
        required: false
        default: ''
        type: string
      mode:
        description: 'audit = no Pages updates; publish = successful chunks with explicit incomplete coverage. Scheduled after-close runs publish.'
        required: true
        default: audit
        type: choice
        options: [audit, publish]

permissions:
  contents: read

# Reuse existing publication lock; do not publish racing daily/quant reports.
concurrency:
  group: korea-stock-screener-publication
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install full market listing dependencies
        run: pip install -r requirements.txt
      # Source computation tests are checked by code-change CI, not rerun
      # on every unchanged-data collection schedule.
      - id: plan
        name: Plan all stocks, codes only, chunks of 100
        env:
          REQUESTED_ASOF: ${{ inputs.asof }}
          # FDR's current KRX-MARCAP issuer roster can require a KRX login.
          # The manual and scheduled batch path must use the same configured
          # identity as the legacy emergency publisher, without logging it.
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        shell: bash
        run: |
          set -euo pipefail
          # Public same-day saved roster is an audit-only continuation when
          # KRX listing authentication is unavailable. Scheduled/manual
          # publication still requires the live listing and will fail closed.
          fallback_args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.mode }}" == "audit" ]]; then
            fallback_args=(--fallback-catalog docs/v22-market-catalog.json)
          fi
          if [[ -n "$REQUESTED_ASOF" ]]; then
            python full_market_batch.py plan --asof "$REQUESTED_ASOF" --out batch-plan "${fallback_args[@]}"
          else
            python full_market_batch.py plan --out batch-plan "${fallback_args[@]}"
          fi
          # Fail before launching up to 25 costly worker jobs if manual
          # publication is requested while either evening venue is open.
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.mode }}" == "publish" ]]; then
            python v3_aftermarket_cutoff.py --manifest batch-plan/manifest.json
          fi
          echo "matrix=$(python -c 'import json;print(json.dumps(json.load(open("batch-plan/matrix.json")),separators=(",",":")))')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: market-code-plan-${{ github.run_id }}
          path: batch-plan/manifest.json
          retention-days: 1
          if-no-files-found: error

  analyze:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: market-code-plan-${{ github.run_id }}
          path: batch-plan
      - name: Analyze this 100-stock chunk
        env:
          CHUNK_INDEX: ${{ matrix.part }}
        shell: bash
        run: |
          set -euo pipefail
          python full_market_batch.py scan \
            --manifest batch-plan/manifest.json \
            --part "$CHUNK_INDEX" --out batch-parts --workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: market-part-${{ github.run_id }}-${{ matrix.part }}
          path: batch-parts/part-*.json
          if-no-files-found: error
          retention-days: 1

  combine:
    needs: [prepare, analyze]
    # An isolated 100-stock worker can fail without discarding all successful
    # batch results. Account for missing whole jobs as UNATTEMPTED, not zero.
    if: ${{ always() && needs.prepare.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: market-code-plan-${{ github.run_id }}
          path: batch-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: market-part-${{ github.run_id }}-*
          merge-multiple: true
          path: batch-parts
      - name: Refuse same-day publication before all aftermarket sessions close
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'publish' }}
        run: python v3_aftermarket_cutoff.py --manifest batch-plan/manifest.json
      - name: Reconcile batch census; schedule publishes, manual audit is read-only
        env:
          MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode }}
          # publish() re-reads KRX-MARCAP before joining issuer identities.
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODE" == "publish" ]]; then
            python -m playwright install --with-deps chromium
            python full_market_batch.py merge \
              --manifest batch-plan/manifest.json --parts batch-parts --publish
          else
            python full_market_batch.py merge \
              --manifest batch-plan/manifest.json --parts batch-parts
          fi
      - name: Reconcile every stock outcome before public v2.2 publication
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'publish' }}
        run: |
          set -euo pipefail
          # Generated report is ONLY aggregate coverage and error categories;
          # fail-closed if any attempted stock has no accountably distinct outcome.
          python v22_full_universe_audit.py \
            --daily docs/data.json --output docs/v22-coverage.json
      - name: Audit research-only daily path source availability (no extra investment points)
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'publish' }}
        run: |
          set -euo pipefail
          python v3_unscored_path_coverage.py --daily docs/data.json --output docs/v3-unscored-path-coverage.json
          python v3_unscored_path_coverage.py --verify --daily docs/data.json --output docs/v3-unscored-path-coverage.json
      - name: Publish ONE final v2 Pages/Excel snapshot after complete union
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'publish' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/history.json docs/recommendations.json docs/recommendation_history.json docs/v22-coverage.json docs/v3-unscored-path-coverage.json docs/v22-market-catalog.json docs/v22-partial-history.json docs/reports/ docs/archive/
          if ! git diff --cached --quiet; then
            git commit -m "Full-market batch-derived v2 screen"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Keep only final derived Excel and failure audit after requested publication
        if: ${{ always() && (github.event_name == 'schedule' || inputs.mode == 'publish') }}
        uses: actions/upload-artifact@v4
        with:
          name: full-market-final-report-${{ github.run_id }}
          path: |
            reports/*.xlsx
            logs/
          if-no-files-found: warn
          retention-days: 30
