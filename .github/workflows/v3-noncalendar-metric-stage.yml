name: V3 Non-December Verified Metric Stage
on:
  push:
    branches: [main]
    paths: [ops/v3-noncalendar-history-followup-20261125.json]
  pull_request:
    paths:
      - ops/v3-noncalendar-history-followup-20261125.json
      - v3_dart_noncalendar_metric_stage.py
      - .github/workflows/v3-noncalendar-metric-stage.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v3-noncalendar-metric-stage
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: .cache/v3-dart-company-codes.json
          key: v3-dart-corp-map-v1-${{ hashFiles('docs/v22-market-catalog.json') }}
      - name: Test derived metrics and missing data guards
        run: |
          python -m py_compile v3_dart_noncalendar_metric_stage.py
          python - <<'PY'
          from v3_dart_noncalendar_metric_stage import metrics
          assert metrics({},100)=={}
          latest={'revenue':1000000000,'operating_income':100000000,'assets':2000000000,'liabilities':1000000000,'equity':1000000000}
          assert metrics({2025:latest},100)=={'sales_to_market_cap':0.1,'liabilities_to_assets_pct':50.0}
          assert metrics({y:latest for y in (2023,2024,2025)},100)['operating_margin_3y_pct']==10
          assert 'operating_margin_3y_pct' not in metrics({y:dict(latest,revenue=0) for y in (2023,2024,2025)},100)
          print('4 derived metric checks passed')
          PY
          python v3_dart_noncalendar_metric_stage.py --mode dry-run --followup > "${RUNNER_TEMP}/fiscal-metric-inventory.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'fiscal-metric-inventory.json').read_bytes())
          assert result['selected'] == 2 and result['provider_calls'] == 0
          PY
      - name: Derive metrics only from unchanged verified receipts
        if: github.event_name != 'pull_request'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python -m pip install 'requests>=2.31,<3'
          python v3_dart_noncalendar_metric_stage.py --mode live --followup
