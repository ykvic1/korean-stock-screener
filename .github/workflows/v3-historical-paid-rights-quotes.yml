name: V3 Historical KRX Paid Rights Quote Probe

on:
  push:
    branches: [v30b-rights-source-check]
    paths:
      - v3_krx_paid_rights_quotes.py
      - .github/workflows/v3-historical-paid-rights-quotes.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quote-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Query the two fixed historical rights sessions
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python v3_krx_paid_rights_quotes.py "$RUNNER_TEMP/rights-quotes.json"
      - name: Retain only validated target rows and request statuses
        uses: actions/upload-artifact@v4
        with:
          name: rights-quotes
          path: ${{ runner.temp }}/rights-quotes.json
          if-no-files-found: error
          retention-days: 7
