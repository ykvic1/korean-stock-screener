name: V3 Forward Score Observation Capture

on:
  pull_request:
    paths:
      - v3_score_observation_capture.py
      - tests/test_v3_score_observation_capture.py
      - .github/workflows/v3-score-observation-capture.yml
  push:
    branches: [main]
    paths:
      - v3_score_observation_capture.py
      - .github/workflows/v3-score-observation-capture.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_v3_score_observation_capture.py' -v

  capture:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: v3-forward-score-observation-capture
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Save first aligned observation for each score date
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard FETCH_HEAD
            python v3_score_observation_capture.py --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
            if [[ -z $(git status --porcelain -- ops/forward-score-observations/) ]]; then exit 0; fi
            git add ops/forward-score-observations/
            git commit -m 'Record forward operational score observation'
            if git push origin HEAD:main; then exit 0; fi
          done
          echo '::error::score_observation_push_retries_exhausted'
          exit 1
