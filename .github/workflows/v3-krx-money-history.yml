name: V3 actual KRX trading-value private derived backfill

on:
  push:
    branches: [main]
    paths:
      - v3_krx_money_5day.py
      - v3_krx_money_backfill.py
      - v3_turnover_multihorizon.py
      - v3_krx_money_horizon_research.py
      - tests/test_v3_turnover_multihorizon.py
      - tests/test_v3_krx_money_horizon_research.py
      - .github/workflows/v3-krx-money-history.yml
  schedule:
    # Twelve staggered 16-cohort runs per day (<=1,920 KRX calls/day).
    # Personal/research source quota 10,000/day; isolated lock prevents overlap.
    # The collector advances one verified cohort at a time and stops at 490/490.
    - cron: '49 */2 * * *'
  workflow_dispatch:
    inputs:
      max_windows:
        description: 'Maximum five-session derived money cohorts (1/4/8/16)'
        required: true
        default: '16'
        type: choice
        options: ['1', '4', '8', '16']
      max_segments:
        description: 'Consecutive checkpointed batches (1 normal / 14 catch-up)'
        required: true
        default: '1'
        type: choice
        options: ['1', '14']

permissions:
  contents: read

concurrency:
  group: v3-krx-actual-money-private-derived-backfill
  cancel-in-progress: false

jobs:
  money-history:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded official KRX and calendar dependencies
        run: python -m pip install 'requests>=2.31,<3' 'exchange-calendars==4.13.1'
      - name: Validate private actual-money factor extraction and resume behavior
        run: |
          set -euo pipefail
          python -m py_compile v3_krx_money_5day.py v3_krx_money_backfill.py v3_krx_money_horizon_research.py v3_krx_money_public_progress.py
          python -m unittest discover -s tests -p 'test_v3_krx_money_backfill.py' -v
          python -m unittest discover -s tests -p 'test_v3_krx_money_horizon_research.py' -v
          python -m unittest discover -s tests -p 'test_v3_turnover_multihorizon.py' -v
          python -m unittest discover -s tests -p 'test_v3_krx_money_public_progress.py' -v
      - name: Resume bounded actual-money cohorts through private verified checkpoints
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
          V3_MONEY_BATCH_WINDOWS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_windows || '16' }}
          # The one-time merged feature commit starts the unattended catch-up.
          # All cron runs and other pushes keep the old 16-window call limit.
          V3_MONEY_BATCH_SEGMENTS: ${{ (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'feat(v3.0b): money history fast lane')) && '14' || (github.event_name == 'workflow_dispatch' && inputs.max_segments || '1') }}
        run: |
          set -euo pipefail
          if [[ "$V3_MONEY_BATCH_SEGMENTS" != '1' && "$V3_MONEY_BATCH_SEGMENTS" != '14' ]]; then
            echo '::error::invalid_money_history_segment_limit'
            exit 1
          fi
          # At most 14 x 16 x 10 = 2,240 official KRX market-day calls.
          # Every five-session cohort has its own immutable private file,
          # SHA readback and CAS checkpoint; partial work survives errors.
          for ((segment=1; segment<=V3_MONEY_BATCH_SEGMENTS; segment++)); do
            if ! result="$(python v3_krx_money_backfill.py)"; then
              # The collector prints only sanitized allowlisted diagnostics.
              echo "$result"
              echo '::error::private_actual_money_segment_stopped_after_checkpoint'
              exit 1
            fi
            echo "$result"
            remaining="$(printf '%s' "$result" | python -c 'import json,sys; print(json.load(sys.stdin)["historical_cohorts_remaining"])')"
            if ! [[ "$remaining" =~ ^[0-9]+$ ]]; then
              echo '::error::invalid_remaining_money_cohorts'
              exit 1
            fi
            echo "Remaining KRX actual-money five-session cohorts: $remaining" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$remaining" == '0' ]]; then
              echo '::notice::actual_money_historical_490_cohorts_finished'
              break
            fi
            # Leave the job timeout enough margin for a private checkpoint.
            if (( SECONDS >= 6000 )); then
              echo '::notice::money_history_soft_time_budget_reached'
              break
            fi
          done
