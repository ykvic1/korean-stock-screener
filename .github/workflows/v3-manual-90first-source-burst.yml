name: V3.0b Manual 90-First Source Recovery Burst
# One deliberate acquisition burst on first merge; later runs require manual
# dispatch. Scheduled collectors retain their existing schedules and locks.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v3-manual-90first-source-burst.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: korea-stock-screener-manual-90-first-dispatch
  cancel-in-progress: false

jobs:
  preflight-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate saved source date and count eligible 90-first work
        id: gaps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from v3_saved_close_path_recovery import select_targets, RecoveryError
          root = Path("docs")
          load = lambda name: json.loads((root / name).read_text(encoding="utf-8"))
          market = load("data.json")
          score = load("v3-operational-research-scores.json")
          priority = load("v3-operational-evidence-priority.json")
          catalog = load("v22-market-catalog.json")
          day = market.get("date")
          census = market.get("candidate_count")
          # Financial and private-money collectors independently check their
          # exact source dates. Do not block them merely because the *price*
          # presenter counts eligible candidates, not all listed issuers.
          consistent = {
              "priority_schema": priority.get("schema") == "v3-r1d-observation-work-priority-v1",
              "catalog_schema": catalog.get("schema") == "v22-current-listed-catalog-0.1",
              "score_priority_date": priority.get("asof") == score.get("asof"),
              "catalog_priority_date": priority.get("asof") == catalog.get("date"),
              "score_priority_census": priority.get("listed_total") == score.get("listed_total"),
              "catalog_priority_census": priority.get("listed_total") == catalog.get("listed_total"),
              "missing_not_zero": priority.get("missing_is_not_zero") is True,
          }
          if not all(consistent.values()):
              print(json.dumps({"source_preflight": "blocked",
                                "reconciliation_checks": consistent}, sort_keys=True))
              raise SystemExit("manual_90first_score_catalog_or_priority_mismatch")
          # Saved-close path replay is different: it requires the same market
          # date and a fully accounted local candidate set. If that path alone
          # is stale, keep it disabled without suppressing other collectors.
          path_source_ready = (
              day == score.get("asof")
              and type(census) is int
              and type(market.get("stocks")) is list
              and len(market["stocks"]) == census)
          coverage = priority["coverage_90_first"]
          if (coverage.get("recovery_not_a_score_or_observation") is not True
                  or coverage.get("independent_source_recoverability_not_proven") is not True
                  or coverage.get("missing_data_never_zero_filled") is not True):
              raise SystemExit("manual_90first_unverified_priority_contract")
          counts = coverage["family_upper_bound_counts"]
          price_candidates = 0
          path_state = "price_presenter_date_or_candidate_count_mismatch"
          if path_source_ready:
              try:
                  below, other = select_targets(market, score)
                  price_candidates = len(below) + len(other)
                  path_state = "valid_source_selection"
              except RecoveryError:
                  path_state = "source_selection_blocked"
          flags = {
              "price": price_candidates > 0,
              "cashflow": counts.get("dart_cashflow_capex", 0) > 0,
              "money": counts.get("exchange_actual_money_windows", 0) > 0,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in flags.items():
                  output.write(key + "=" + str(value).lower() + "\n")
          print(json.dumps({
              "operational_asof": priority["asof"], "price_presenter_asof": day,
              "listed_total": priority["listed_total"],
              "price_candidate_count": census,
              "price_source_ready": path_source_ready,
              "below_90": coverage["below_90_issuers"],
              "price_path_exact_recovery_candidates": price_candidates,
              "price_path_selection": path_state,
              "cashflow_conditional_90first_issuers": counts.get("dart_cashflow_capex", 0),
              "money_conditional_90first_issuers": counts.get("exchange_actual_money_windows", 0),
              "dispatch": flags, "points_added_by_dispatch": 0,
              "no_missing_source_guessed": True,
          }, sort_keys=True))
          PY
      - name: Manually start bounded original DART CAPEX recovery
        if: steps.gaps.outputs.cashflow == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/v3-reported-capex-total.yml/dispatches" -f ref=main --silent
      - name: Manually start 90-first exact saved-close path collection
        if: steps.gaps.outputs.price == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/v3-saved-close-path-recovery.yml/dispatches" -f ref=main --silent
      - name: Manually start historical KRX reported-money week gap recovery
        if: steps.gaps.outputs.money == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/v3-krx-money-week-repair.yml/dispatches" -f ref=main --silent
      - name: Explain strict acquisition boundaries
        run: |
          echo "Only existing source-verified collectors were dispatched."
          echo "No V3.0b investment-score points are credited by the dispatcher."
          echo "Official-price/regular-close and consolidated NXT volume are not certified."
