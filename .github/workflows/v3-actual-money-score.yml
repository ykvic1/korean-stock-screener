name: V3 Actual Money Personal Participation Score

on:
  pull_request:
    paths:
      - v3_actual_money_participation.py
      - v3_actual_money_contract.py
      - tests/test_v3_actual_money_participation.py
      - .github/workflows/v3-actual-money-score.yml
  push:
    branches: [main]
    paths:
      - v3_actual_money_participation.py
      - v3_actual_money_contract.py
      - .github/workflows/v3-actual-money-score.yml
  workflow_run:
    workflows:
      - V3 Private Calendar Week Actual Money
      - V3 KRX actual-money after-anchor forward private derived cohorts
      - Full-Market 100-Stock Batches
    types: [completed]
  schedule:
    - cron: '44 2,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - run: python -m unittest discover -s tests -p 'test_v3_actual_money_participation.py' -v
  publish:
    needs: offline
    if: >-
      ${{ github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_run' ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: korea-stock-screener-current-observed-publisher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: ykvic1/korean-stock-private-data
          ref: main
          token: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
          path: .money-private
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /derived/money-five-session/
            /derived/money-calendar-weeks/
            /derived/money-historical-checkpoint.json
            /derived/money-forward-checkpoint.json
            /derived/money-calendar-week-checkpoint.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt 'exchange-calendars==4.13.1'
      - name: Derive only bounded six-point money evidence from pinned private snapshot
        id: projection
        env:
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
        run: |
          set -euo pipefail
          revision=$(git -C .money-private rev-parse HEAD)
          python v3_actual_money_participation.py --private-snapshot .money-private --private-revision "$revision" --allow-incomplete
      - name: Remove private snapshot before any public staging
        if: always()
        run: rm -rf -- .money-private
      - name: Replay public point receipt into UI, issuer ledger and personal ranking
        if: steps.projection.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python v3_volume_participation.py --mode write
          python v3_current_observed_scorecard.py --mode write --refresh-derived
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/v3-actual-money-participation.json docs/v3-actual-money-coverage-summary.json docs/v3-volume-obv-observed.json docs/v3-volume-obv-observed.csv docs/v3-current-observed-all-listed.csv docs/v3-current-observed-all-listed-summary.json docs/v3-issuer-last-observed-factors.json docs/v3-personal-adjusted-scores.csv docs/v3-personal-adjusted-score-summary.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Publish provisional actual-money participation6 and consistent personal scores'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            python v3_volume_participation.py --mode write
            python v3_current_observed_scorecard.py --mode write --refresh-derived
            git add -- docs/v3-volume-obv-observed.json docs/v3-volume-obv-observed.csv docs/v3-current-observed-all-listed.csv docs/v3-current-observed-all-listed-summary.json docs/v3-issuer-last-observed-factors.json docs/v3-personal-adjusted-scores.csv docs/v3-personal-adjusted-score-summary.json
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
            python v3_volume_participation.py --mode verify
            python v3_current_observed_scorecard.py --mode verify --refresh-derived
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
