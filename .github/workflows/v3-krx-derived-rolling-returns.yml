name: V3 KRX Private Derived-Only 20/60/120/250-Session Return Research

on:
  # Replay once after a verified production-budget/source validation patch.
  push:
    branches: [main]
    paths:
      - v3_krx_derived_rolling_returns.py
      - tests/test_v3_krx_derived_rolling_returns.py
      - .github/workflows/v3-krx-derived-rolling-returns.yml
  # Recompute right after a successful private boundary join. A delayed
  # scheduled join must not leave newly connected history unrecalculated.
  workflow_run:
    workflows:
      - V3 KRX Derived-Only Historical Cohort Boundary Join
    types: [completed]
  # One independent daily fallback if GitHub drops a workflow_run event.
  # All rolling computations reuse verified private factors: 0 KRX calls.
  schedule:
    - cron: '11 18 * * *' # 03:11 KST
  workflow_dispatch:
    inputs:
      mode:
        description: 'Dry-run by default; live reads PRIVATE derived evidence only'
        type: choice
        options: [dry_run, live]
        default: dry_run
        required: true

permissions:
  contents: read

concurrency:
  group: v3-krx-private-derived-history
  cancel-in-progress: false

jobs:
  research:
    if: >-
      ${{
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install calendar and imported source validation dependencies (no live KRX calls)
        run: python -m pip install 'requests>=2.31,<3' 'exchange-calendars==4.13.1'
      - name: Test raw-source-free rolling transformed return verification
        run: |
          set -euo pipefail
          python -m py_compile v3_krx_derived_rolling_returns.py
          python -m unittest discover -s tests -p 'test_v3_krx_derived_rolling_returns.py' -v
      - name: Compound private 20-60-120-250-session approximations without a single KRX request
        env:
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
        run: |
          set -euo pipefail
          python v3_krx_derived_rolling_returns.py
