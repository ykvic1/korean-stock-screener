name: Rolling OpenDART Annual Book Reference - Current Listed

on:
  push:
    branches: [main]
    paths:
      - v3_dart_rolling_book_reference.py
  schedule:
    # Eight separated KST weekday windows, max 40 issuers each.
    # UTC Sunday-Thursday late hours correspond to KST Monday-Friday morning.
    # Keep the 02:30–08:50 KST daily market publication window clear.
    # Stagger DART outside that window; full-market explicit followups still run.
    - cron: '17 16 * * 0-4'  # 01:17 KST Mon-Fri (previous UTC day)
    - cron: '37 2 * * 1-5'   # 11:37 KST Mon-Fri
    - cron: '37 10 * * 1-5'  # 19:37 KST Mon-Fri
    - cron: '17 1 * * 1-5'   # 10:17 KST Mon-Fri
    - cron: '17 4 * * 1-5'   # 13:17 KST Mon-Fri
    - cron: '17 7 * * 1-5'   # 16:17 KST Mon-Fri
    - cron: '17 12 * * 1-5'  # 21:17 KST Mon-Fri; after 18:30 full-market
    - cron: '17 14 * * 1-5'  # 23:17 KST Mon-Fri
  workflow_dispatch:
    inputs:
      limit:
        description: 'New companies per run, 20 or 40'
        required: false
        default: '40'
        type: choice
        options: ['20', '40']

permissions:
  contents: write
  actions: write

concurrency:
  group: korea-stock-screener-publication
  cancel-in-progress: false

jobs:
  current-listed-annual-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing OpenDART HTTP dependency
        run: python -m pip install 'requests>=2.31,<3'
      - name: Offline completeness, receipt, market, no-secret and ratio tests
        run: |
          python -m py_compile v3_dart_rolling_book_reference.py
          python -m unittest discover -s tests -p 'test_v3_dart_rolling_book_reference.py' -v
      - name: Enrich source-dated live listed names without touching scores
        id: collect
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          REQUESTED_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime,date
          from zoneinfo import ZoneInfo
          from pathlib import Path
          import json,os
          from v22_full_universe_audit import audit_published_universe
          from v3_dart_rolling_book_reference import write
          market=json.loads(Path('docs/data.json').read_text(encoding='utf8'))
          catalog=json.loads(Path('docs/v22-market-catalog.json').read_text(encoding='utf8'))
          day=market['date']
          age=(datetime.now(ZoneInfo('Asia/Seoul')).date()-date.fromisoformat(day)).days
          if age not in range(0,10):
              raise ValueError('stale_dart_source_date')
          census=audit_published_universe(market)
          if catalog['date']!=day or catalog['listed_total']!=census['market_listing_size']:
              raise ValueError('current_market_census_changed')
          prior_path=Path('docs/v3-dart-book-reference.json')
          official_path=Path('docs/official.json')
          prior=json.loads(prior_path.read_text(encoding='utf8')) if prior_path.exists() else None
          official=json.loads(official_path.read_text(encoding='utf8')) if official_path.exists() else None
          bulk_path=Path('docs/v3-dart-bulk-history.json')
          bulk=json.loads(bulk_path.read_text(encoding='utf8')) if bulk_path.is_file() else None
          quota=int(os.getenv('REQUESTED_LIMIT') or '40')
          result=write(market,catalog,output=prior_path,prior=prior,official=official,bulk=bulk,
                       key=os.environ.get('DART_API_KEY'),limit=quota)
          if result['asof']!=day or result['market_listed_total']!=census['market_listing_size']:
              raise ValueError('derived_accounts_bad_scope')
          for k in ('official_exchange_pbr_verified','historical_point_in_time_verified',
                    'stock_buy_certified','score_weight_changed',
                    'raw_dart_account_rows_published'):
              if result[k] is not False:
                  raise ValueError('unearned_financial_certification')
          refreshed=result['corrected_annual_receipts_refreshed']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'refreshed={refreshed}\n')
          print('corrected_annual_receipts_refreshed=',refreshed,
                'listed=',result['market_listed_total'],
                'annual_observed=',result['observed_annual_count'],
                'simple_book_PB_available=',result['pbr_simple_reference_count'],
                'new_attempts=',result['new_attempts_this_run'],
                'official_exchange_pbr_or_trade_certified=False')
          PY
      - name: Commit after no-stale post-rebase source-day verification
        id: publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v3-dart-book-reference.json
          if ! git diff --cached --quiet; then
            git commit -m "Current-listed DART annual equity and simple non-scoring book reference"
            bulk_sha=$(git rev-parse HEAD:docs/v3-dart-bulk-history.json)
            git pull --rebase origin main
            if [[ $(git rev-parse HEAD:docs/v3-dart-bulk-history.json) != "$bulk_sha" ]]; then
              echo 'The bulk annual source changed during collection.'
              exit 1
            fi
            python - <<'PY'
          import json
          from pathlib import Path
          market=json.loads(Path('docs/data.json').read_text(encoding='utf8'))
          catalog=json.loads(Path('docs/v22-market-catalog.json').read_text(encoding='utf8'))
          book=json.loads(Path('docs/v3-dart-book-reference.json').read_text(encoding='utf8'))
          listed={r['code'] for r in catalog['rows']}
          codes=[r['code'] for r in book['records']]
          observed=[r['code'] for r in book['observations']]
          if (market['date']!=catalog['date'] or book['asof']!=market['date']
              or len(listed)!=book['market_listed_total']
              or not set(codes)<=listed or len(set(codes))!=len(codes)
              or not set(observed)<=set(codes)
              or len(codes)!=book['attempted_reference_count']
              or book['official_exchange_pbr_verified'] is not False
              or book['raw_dart_account_rows_published'] is not False
              or book['score_weight_changed'] is not False):
              raise ValueError('post_rebase_book_census_changed')
          print('Final same-date market and financial reference publication validated')
          PY
            git push origin HEAD:main
          fi
      - name: Recollect EPS for the newly verified annual receipts
        if: steps.collect.outputs.refreshed != '' && steps.collect.outputs.refreshed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run v3-dart-reported-eps.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=live
      - name: Start lagging research followups after a dispatched annual refresh
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub did not emit the downstream workflow_run for the dispatched
          # annual refresh. Check current main before making one bounded dispatch.
          git fetch origin main
          source_dir=$(mktemp -d)
          git archive FETCH_HEAD docs/data.json docs/v22-market-catalog.json \
            docs/v3-dart-book-reference.json docs/v3-dart-bulk-history.json | tar -x -C "$source_dir"
          annual=$(env -u GITHUB_OUTPUT python v3_dart_source_day_preflight.py --kind annual --docs "$source_dir/docs")
          if [[ $(jq -r '.ready' <<< "$annual") != true ]]; then exit 0; fi
          major=$(env -u GITHUB_OUTPUT python v3_dart_source_day_preflight.py --kind major --docs "$source_dir/docs")
          if [[ $(jq -r '.status' <<< "$major") == deferred_waiting_for_dart_same_market_day ]]; then
            gh workflow run v3-dart-bulk-four-year.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=live -f groups=1
          fi
          weekly=$(git show FETCH_HEAD:docs/v3-weekly-coverage.json)
          if ! jq -e --argjson annual "$annual" '
            .market_asof == $annual.market_asof and .listed_total == $annual.current_listed_total
          ' <<< "$weekly" > /dev/null; then
            gh workflow run v3-weekly-rotation.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=publish
          fi
      - name: No original filings or stock history artifact
        if: always()
        run: echo 'Only bounded annual derived fields; no raw OHLCV, score certification, or investment orders.'
