name: V3 Investor Flow One-Time Cross-Source Research

on:
  push:
    branches: [v3/npay-pykrx-independent-flow-crosscheck-20261017]
    paths: ['.github/workflows/v3-flow-crosscheck-once.yml']

permissions:
  contents: read

concurrency:
  group: v3-flow-crosscheck-temporary-once
  cancel-in-progress: false

jobs:
  once:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run offline dual-source mismatch and no-scoring tests
        run: python -m unittest discover -s tests -p 'test_v3_flow_crosscheck.py' -v
      - name: One symbol, one Npay request, one pykrx lookup, no raw investor numbers
        run: python -m v3_flow_crosscheck_once
