name: V3.0b One-Time KRX Remaining 22 Downside LOW Evidence 20261122

# This workflow is deliberately branch-scoped and one-shot. No schedule or
# workflow_dispatch. The five followup dates are now independently verified.
# Only the remaining 22 extreme dates are targeted; no repeat requests.
on:
  push:
    branches:
      - audit/v30b-krx-downside-followup-once-20261122
    paths:
      - .github/workflows/v30b-one-time-downside-followup-20261122.yml

permissions:
  contents: read

concurrency:
  group: v30b-krx-downside-followup-once-20261122
  cancel-in-progress: false

jobs:
  compare-twenty-two-remaining-extreme-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: [downside_tail_1, downside_tail_2, downside_tail_3, downside_tail_4, downside_tail_5]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3' 'pyarrow>=20,<27' 'pandas>=2,<3'
      - name: Download identical SHA-pinned public replay inputs
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/93713f5a0a80ff29dc10e5aba9c8a51353e0e1b4/data/marcap-2025.parquet -o pilot-2025.parquet
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/24a2bec363aaad0ba2e3494966108995d196702d/data/marcap-2026.parquet -o pilot-2026.parquet
          curl -fsSL --max-time 30 https://raw.githubusercontent.com/FinanceData/fdr_krx_data_cache/05a17038b3cddf7a6f48105913e46fd37d96a21e/data/listing/krx/2026-11-13.csv -o pilot-2026-11-13.csv
      - name: Audit only remaining extreme dates and actual issuer/successor LOW
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          PILOT_BATCH: ${{ matrix.batch }}
        run: |
          set -euo pipefail
          python v3_historical_pilot_official_prices.py --batch "$PILOT_BATCH" "$RUNNER_TEMP/pilot-2025.parquet" "$RUNNER_TEMP/pilot-2026.parquet" "$RUNNER_TEMP/pilot-2026-11-13.csv" | tee "$RUNNER_TEMP/v30b-official-${PILOT_BATCH}-20261122.json"
      - name: Retain anonymous market and actual-extreme-issuer aggregates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v30b-official-${{ matrix.batch }}-20261122
          path: ${{ runner.temp }}/v30b-official-${{ matrix.batch }}-20261122.json
          if-no-files-found: ignore
          retention-days: 90
