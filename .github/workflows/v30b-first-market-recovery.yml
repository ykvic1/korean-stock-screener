name: V3 first market refresh recovery
on:
  push:
    branches: [v30b-first-scheduled-market-recovery]
    paths: [.github/workflows/v30b-first-market-recovery.yml]
permissions:
  actions: write
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect collection scheduler and recover missing November 23 publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/388139855" --jq .state)
          echo "full_market_workflow_state=$state"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/388139855/runs?branch=main&per_page=10" --jq '.workflow_runs[] | [.id,.event,.status,.conclusion,.created_at] | @tsv'
          date=$(gh api "repos/$GITHUB_REPOSITORY/contents/docs/v22-market-catalog.json?ref=main" -H 'Accept: application/vnd.github.raw+json' --jq .date)
          echo "published_catalog_date=$date"
          if [[ "$date" < "2026-11-23" && "$state" == "active" ]]; then
            active=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/388139855/runs?branch=main&per_page=10" --jq '[.workflow_runs[] | select(.status != "completed")] | length')
            if [[ "$active" == "0" ]]; then
              gh workflow run full-market-batches.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=publish -f asof=2026-11-23
              echo "recovery_dispatched=true"
            fi
          fi
