name: One-time KRX private derived cohort orphan resume verification
on:
  push:
    branches: [v3-real-dart-event-crosscheck-20261020]
    paths:
      - .github/workflows/v3-krx-orphan-resume-retry-once.yml
permissions:
  contents: read
concurrency:
  group: v3-krx-private-derived-history
  cancel-in-progress: false
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-real-dart-event-crosscheck-20261020
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source/calendar validation imports
        run: python -m pip install 'requests>=2.31,<3' 'exchange-calendars==4.13.1'
      - name: Validate no-raw retention and resumable factor checkpoints
        run: |
          python -m unittest discover -s tests -p 'test_v3_krx_derived_5day.py' -v
          python -m unittest discover -s tests -p 'test_v3_krx_derived_backfill.py' -v
      - name: Reuse private orphan factors and resume at most eight historical cohorts
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
          V3_DERIVED_BATCH_WINDOWS: "8"
        run: |
          set -euo pipefail
          python v3_krx_derived_backfill.py
