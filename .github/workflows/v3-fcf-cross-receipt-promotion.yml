name: V3 Verified FCF Cross-Receipt Comparative Promotion
on:
  pull_request:
    paths:
      - v3_dart_fcf_comparative_promotion.py
      - v3_dart_fcf_2024_prior_probe.py
      - v3_dart_cashflow_enrichment.py
      - v3_dart_reviewed_capex.py
      - v3_dart_reviewed_capex_statements.json
      - tests/test_v3_dart_fcf_comparative_promotion.py
      - tests/test_v3_dart_reviewed_capex_partial.py
      - .github/workflows/v3-fcf-cross-receipt-promotion.yml
  push:
    branches: [main]
    paths:
      - v3_dart_fcf_comparative_promotion.py
      - v3_dart_fcf_2024_prior_probe.py
      - v3_dart_cashflow_enrichment.py
      - v3_dart_reviewed_capex.py
      - v3_dart_reviewed_capex_statements.json
      - .github/workflows/v3-fcf-cross-receipt-promotion.yml
  # Both comparative collectors dispatch this workflow after a changed
  # checkpoint is persisted. Also listening for completion duplicates the run.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test comparative promotion changes
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          python -m unittest discover -s tests -p 'test_v3_dart_fcf_comparative_promotion.py' -v
          python -m unittest discover -s tests -p 'test_v3_dart_reviewed_capex_partial.py' -v
          python -m unittest discover -s tests -p 'test_v3_dart_cashflow_enrichment.py' -v
          python -m unittest discover -s tests -p 'test_v3_dart_fcf_2024_prior_probe.py' -v
      - name: Validate saved comparative evidence
        run: python v3_dart_fcf_comparative_promotion.py --mode dry-run
  promote:
    needs: offline
    # Load main for verified publication, including explicit collector dispatches.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    concurrency:
      # Serialize with both the official same-year CF collector and original
      # XBRL CF recovery; all three modify the same cashflow reference file.
      group: korea-stock-screener-dart-cashflow
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Promote receipt-matched CAPEX from verified statements
        run: |
          python v3_dart_fcf_comparative_promotion.py --mode promote
          python v3_dart_cashflow_enrichment.py --mode verify
          python v3_dart_cashflow_factor_preview.py --mode write
          python v3_dart_cashflow_gap_audit.py --mode write --issuer-out docs/v3-dart-cashflow-issuer-evidence.json
      - name: Publish provenance-checked FCF source observations
        id: persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/v3-dart-cashflow-reference.json docs/v3-dart-fcf-research-preview.json docs/v3-dart-cashflow-gap-summary.json docs/v3-dart-cashflow-issuer-evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Promote CFO-matched original comparative CAPEX into FCF observations'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            python v3_dart_cashflow_enrichment.py --mode verify
            python v3_dart_cashflow_factor_preview.py --mode verify
            python v3_dart_cashflow_gap_audit.py --mode verify --issuer-out docs/v3-dart-cashflow-issuer-evidence.json
            if git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo '::error::verified_comparative_promotion_push_retries_exhausted'
          exit 1
      - name: Replay 100-point operational observations using saved sources
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/v3-current-observed-scorecard.yml/dispatches" -f ref=main -f 'inputs[mode]=write' --silent
