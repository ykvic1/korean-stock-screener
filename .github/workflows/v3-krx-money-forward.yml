name: V3 KRX actual-money after-anchor forward private derived cohorts

on:
  push:
    branches: [main]
    paths:
      - v3_krx_money_forward.py
      - tests/test_v3_krx_money_forward.py
      - .github/workflows/v3-krx-money-forward.yml
  schedule:
    # Check the recent live tail after EOD and twice overnight KST.
    # No KRX calls unless a NEW full 5-session candidate cohort exists.
    - cron: '57 11,16,22 * * *'
  workflow_dispatch:
    inputs:
      max_windows:
        type: choice
        required: true
        default: '8'
        options: ['1', '4', '8']

permissions:
  contents: read

# The historical and forward jobs share the SAME private writer lock.
concurrency:
  group: v3-krx-actual-money-private-derived-backfill
  cancel-in-progress: false

jobs:
  forward-private-money:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authenticated KRX client and candidate calendar
        run: python -m pip install 'requests>=2.31,<3' 'exchange-calendars==4.13.1'
      - name: Offline forward immutable prefix regression, no vendor access
        run: |
          set -euo pipefail
          python -m py_compile v3_krx_money_forward.py
          python -m unittest discover -s tests -p 'test_v3_krx_money_forward.py' -v
          python -m unittest discover -s tests -p 'test_v3_krx_money_backfill.py' -v
      - name: Resume forward five-session private money factors without source bars
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
          V3_MONEY_FORWARD_WINDOWS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_windows || '8' }}
        run: |
          set -euo pipefail
          python v3_krx_money_forward.py
