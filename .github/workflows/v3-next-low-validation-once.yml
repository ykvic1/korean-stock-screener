name: V3 final historical LOW offline replay
on:
  push:
    branches: [v30b-final-pretouch-low-coverage]
    paths: [.github/workflows/v3-next-low-validation-once.yml]

permissions:
  contents: read

concurrency:
  group: v30b-historical-close-archive-audit
  cancel-in-progress: false

jobs:
  archived-closes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3' 'pyarrow>=20,<27' 'pandas>=2,<3'
      - name: Download pinned public replay inputs
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/93713f5a0a80ff29dc10e5aba9c8a51353e0e1b4/data/marcap-2025.parquet -o pilot-2025.parquet
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/24a2bec363aaad0ba2e3494966108995d196702d/data/marcap-2026.parquet -o pilot-2026.parquet
          curl -fsSL --max-time 30 https://raw.githubusercontent.com/FinanceData/fdr_krx_data_cache/05a17038b3cddf7a6f48105913e46fd37d96a21e/data/listing/krx/2026-11-13.csv -o pilot-2026-11-13.csv
      - name: Quantify existing authenticated historical OHLC coverage without provider calls
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/historical-downside-official-ohlc-coverage.json"
          python v3_historical_downside_official_ohlc_evidence.py > "$result"
          jq . "$result" >> "$GITHUB_STEP_SUMMARY"
          jq -c . "$result"
      - name: Validate pinned exact-security KRX downside LOW evidence (offline)
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v3_historical_extreme_direct_low_evidence.py' -v
          result="$RUNNER_TEMP/historical-extreme-direct-low-coverage.json"
          python v3_historical_extreme_direct_low_evidence.py > "$result"
          jq -e '.new_direct_low_compared_dates == 27 and .direct_low_trading_symbol_date_pairs == 33 and .prior_41_horizons_marketwide_day_only_not_directly_authenticated == 41 and .historical_adjusted_path_certified == false and .point_in_time_scores_verified == false and .performance_validated == false and .v30b_release_ready == false' "$result" >/dev/null
          jq . "$result" >> "$GITHUB_STEP_SUMMARY"
          jq -c . "$result"
      - name: Reconcile all 35 historical extrema at exact originating or successor security LOW (offline)
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v3_historical_prior_direct_low_evidence.py' -v
          result="$RUNNER_TEMP/historical-all-extreme-direct-low-coverage.json"
          python v3_historical_prior_direct_low_evidence.py > "$result"
          jq -e '.prior_marketwide_only_dates_now_exact_security_checked == 8 and .previously_exact_security_checked_dates == 27 and .all_35_extreme_dates_direct_security_checked == 35 and .all_extreme_trading_security_date_pairs == 53 and .all_85_horizon_extreme_dates_directly_checked == 85 and .regular_only_volume_verified == false and .historical_adjusted_path_certified == false and .point_in_time_scores_verified == false and .performance_validated == false and .v30b_release_ready == false' "$result" >/dev/null
          jq . "$result" >> "$GITHUB_STEP_SUMMARY"
          jq -c . "$result"
      - name: Validate independently pinned original and successor reference-line LOW (offline)
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v3_historical_reference_touch_direct_probe.py' -v
          python -m unittest discover -s tests -p 'test_v3_historical_reference_touch_direct_low_evidence.py' -v
          result="$RUNNER_TEMP/historical-reference-touch-direct-low-coverage.json"
          python v3_historical_reference_touch_direct_low_evidence.py > "$result"
          jq -e '.newly_verified_first_touch_security_days == 11 and .unique_new_official_first_touch_dates == 10 and .all_reported_first_touch_security_days_with_exact_ohlc == 14 and .new_provider_calls_in_readonly_replay == 0 and .first_touch_is_earliest_trade_proven == false and .pre_touch_complete_adjusted_path_verified == false and .regular_only_volume_verified == false and .historical_point_in_time_scores_certified == false and .performance_validated == false and .v30b_release_ready == false' "$result" >/dev/null
          jq . "$result" >> "$GITHUB_STEP_SUMMARY"
          jq -c . "$result"
      - name: Fail closed on official 17-issuer holder quote and ratio discrepancies (offline)
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v3_historical_official_holder_terminal.py' -v
      - name: Strict original-to-successor holder daily quote regression (offline)
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v3_historical_official_holder_daily_path.py' -v
      - name: Verify original-security no-trade during 687 corporate rights gaps (offline)
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v3_historical_official_holder_gap_ledger.py' -v
      - name: Chronological KRX CLOSE reference-breach regression (offline)
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v3_historical_official_close_stop_reference.py' -v
      - name: Validate chronological pre-first LOW evidence priority without provider calls
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v3_historical_pretouch_official_low_gap.py' -v
      - name: Verify second official LOW five-day source and no repeated KRX requests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v3_historical_pretouch_official_low_second.py' -v
      - name: Verify third pre-first LOW no-repeat KRX offline tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v3_historical_pretouch_official_low_third.py' -v
      - name: Replay pinned fourth official LOW proof without provider calls
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/fourth-official-low-replay.json"
          python v3_historical_pretouch_official_low_fourth.py "$RUNNER_TEMP/pilot-2025.parquet" "$RUNNER_TEMP/pilot-2026.parquet" "$RUNNER_TEMP/pilot-2026-11-13.csv" > "$result"
          jq -e '.verified_holder_days == 329 and .unverified_holder_days == 423 and .replay_provider_calls == 0 and .v30b_release_ready == false' "$result" > /dev/null
          jq . "$result" >> "$GITHUB_STEP_SUMMARY"
      - name: Replay cumulative official LOW proofs without provider calls
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/historical-official-low-replay.json"
          python v3_historical_pretouch_official_low_fifth.py --include-seventh "$RUNNER_TEMP/pilot-2025.parquet" "$RUNNER_TEMP/pilot-2026.parquet" "$RUNNER_TEMP/pilot-2026-11-13.csv" > "$result"
          jq -e '.verified_holder_days == 590 and .unverified_holder_days == 162 and .replay_provider_calls == 0 and .v30b_release_ready == false' "$result" > /dev/null
          jq . "$result" >> "$GITHUB_STEP_SUMMARY"
      - name: Replay all eligible traded pre-touch LOW observations
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/final-official-low-replay.json"
          python v3_historical_pretouch_official_low_final.py "$RUNNER_TEMP/pilot-2025.parquet" "$RUNNER_TEMP/pilot-2026.parquet" "$RUNNER_TEMP/pilot-2026-11-13.csv" > "$result"
          jq -e '.verified_holder_days == 752 and .unverified_holder_days == 0 and .all_eligible_traded_pre_touch_lows_verified == true and .replay_provider_calls == 0 and .v30b_release_ready == false' "$result" > /dev/null
          jq . "$result" >> "$GITHUB_STEP_SUMMARY"
      - name: Compare closes, listed shares and observable trade status
        env:
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/historical-close-archive-audit.json"
          python v3_historical_close_archive_audit.py "$RUNNER_TEMP/pilot-2025.parquet" "$RUNNER_TEMP/pilot-2026.parquet" "$RUNNER_TEMP/pilot-2026-11-13.csv" > "$result"
          jq -e '.pre_first_low_official_ohlc_coverage.original_issuers_with_replayed_low_touch == 14 and .pre_first_low_official_ohlc_coverage.pre_touch_public_traded_holder_days == 752 and .pre_first_low_official_ohlc_coverage.pre_touch_holder_days_on_existing_official_ohlc_dates == 308 and .pre_first_low_official_ohlc_coverage.pre_touch_holder_days_without_existing_official_ohlc_date == 444 and .pre_first_low_official_ohlc_coverage.independently_authenticated_new_low_dates == 20 and .pre_first_low_official_ohlc_coverage.independently_authenticated_new_pre_touch_holder_lows == 140 and .pre_first_low_official_ohlc_coverage.third_batch_additional_original_successor_lows == 58 and .pre_first_low_official_ohlc_coverage.offline_replay_new_krx_market_api_requests == 0 and .pre_first_low_official_ohlc_coverage.offline_replay_new_krx_market_api_requests == 0 and .pre_first_low_official_ohlc_coverage.first_touch_earliest_low_certified == false and .pre_first_low_official_ohlc_coverage.performance_validated == false and .pre_first_low_official_ohlc_coverage.v30b_release_ready == false' "$result" >/dev/null
          jq -e '.holder_close_reference_chronology.all_official_closing_breaches_consistent_with_frozen_public_first_lows == true and .holder_close_reference_chronology.official_close_observation_holder_days == 3461 and .holder_close_reference_chronology.first_intraday_reference_touch_certified == false and .holder_close_reference_chronology.performance_validated == false and .holder_close_reference_chronology.v30b_release_ready == false' "$result" >/dev/null
          jq -e '.holder_legal_unpriced_gap_ledger.all_corporate_action_gaps_accounted_for == true and .holder_legal_unpriced_gap_ledger.eligible_holder_day_cells == 4148 and .holder_legal_unpriced_gap_ledger.unpriced_corporate_gap_holder_date_cells == 687 and .holder_legal_unpriced_gap_ledger.verified_no_original_trade_after_last_trade == 687 and .holder_legal_unpriced_gap_ledger.new_krx_market_api_requests == 0 and .holder_legal_unpriced_gap_ledger.first_intraday_reference_touch_proven == false and .holder_legal_unpriced_gap_ledger.v30b_release_ready == false' "$result" >/dev/null
          jq -e '.holder_daily_official_close_path.daily_close_and_holder_schedule_matched == true and .holder_daily_official_close_path.frozen_horizon_observation_counts_reproduced == 85 and .holder_daily_official_close_path.frozen_horizon_intraday_extremes_bound_official_close == 85 and .holder_daily_official_close_path.close_does_not_precede_frozen_first_low_touch == 85 and .holder_daily_official_close_path.new_krx_market_api_requests == 0 and .holder_daily_official_close_path.new_private_archive_reads == 0 and .holder_daily_official_close_path.earliest_intraday_low_touch_certified == false and .holder_daily_official_close_path.complete_adjusted_total_return_history_certified == false and .holder_daily_official_close_path.performance_validated == false and .holder_daily_official_close_path.v30b_release_ready == false' "$result" >/dev/null
          jq 'del(.by_session)' "$result" >> "$GITHUB_STEP_SUMMARY"
          jq -c 'del(.by_session)' "$result"
      - name: Retain aggregate comparisons and official source fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-close-archive-audit
          path: |
            ${{ runner.temp }}/historical-close-archive-audit.json
            ${{ runner.temp }}/final-official-low-replay.json
            ${{ runner.temp }}/historical-downside-official-ohlc-coverage.json
            ${{ runner.temp }}/historical-extreme-direct-low-coverage.json
            ${{ runner.temp }}/historical-all-extreme-direct-low-coverage.json
            ${{ runner.temp }}/historical-reference-touch-direct-low-coverage.json
          if-no-files-found: ignore
          retention-days: 90
