name: V3 Historical Subscription Rights Price Probe

on:
  push:
    branches: [main]
    paths:
      - v3_historical_rights_source_probe.py
      - .github/workflows/v3-historical-rights-source-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-historical-rights-source-probe
  cancel-in-progress: false

jobs:
  check-official-rights:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Check retained coverage without logging vendor prices
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          set -euo pipefail
          python v3_historical_rights_source_probe.py | tee -a "$GITHUB_STEP_SUMMARY"
