name: Korean Stock Screener v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['screener.py', 'config.json', '.github/workflows/daily.yml']
  schedule:
    - cron: '30 9 * * 1-5'  # 18:30 KST weekdays

permissions:
  contents: write

# Parallel runs caused push collisions in v1. Queue at most one pending run.
concurrency:
  group: korea-stock-screener-publication
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Analyze prices, flows and risk
        env:
          TZ: Asia/Seoul
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python screener.py
      - name: Save results to GitHub Pages docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/history.json docs/reports/ docs/archive/
          if ! git diff --cached --quiet; then
            git commit -m "Daily v2 multi-factor screen"
            git pull --rebase origin main
            git push
          fi
      - name: Keep Excel and failure logs for 90 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korea-screening-report-${{ github.run_id }}
          path: |
            reports/*.xlsx
            logs/
          if-no-files-found: warn
          retention-days: 90

