name: Dispatch complete v3.0b comparative reconciliation
on:
  push:
    branches: [manual-v30b-comparatives]
    paths: [.github/workflows/dispatch-comparatives-once.yml]
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the complete frozen-cohort replay
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run v30b-frozen-primary-statements.yml --ref v30b-annual-comparative-2022-2023 -f all_comparatives=true
