name: Official KRX and OpenDART API Probe (manual only)

on:
  workflow_dispatch:
    inputs:
      asof:
        description: 'Completed trade date YYYY-MM-DD; <= docs/data.json date'
        required: true
        type: string
      mode:
        description: 'dry_run before provider approval, live only after approval'
        required: true
        type: choice
        default: dry_run
        options: [dry_run, live]
      provider:
        description: 'KRX, DART or both (sample only)'
        type: choice
        default: both
        options: [both, krx, dart]
      symbols:
        description: 'Optional: up to 10 six-digit symbols from docs/data.json, comma separated'
        required: false
        type: string
      finance_sample:
        description: 'DART live only: max 2 prior-year annual CFS statements (unverified for backtests)'
        type: boolean
        default: false
      history_sample:
        description: 'DART live only: ONE symbol, prior 3 annual years + Q1/H1 fields (PIT unverified)'
        type: boolean
        default: false
      revision_audit:
        description: 'DART live only: one stock, 2025 filing timeline + max two original document hashes'
        type: boolean
        default: false
      revision_expected_receipt:
        description: '14-digit financial report receipt from previous run; required for revision audit'
        required: false
        type: string
      xbrl_compare:
        description: 'One company: 2025 original XBRL vs current DART annual financial API; unverified for PIT'
        type: boolean
        default: false
      xbrl_receipt:
        description: 'Prior verified annual filing receipt (14 digits); XBRL comparison only'
        required: false
        type: string
      xbrl_batch_cases:
        description: 'Research pilot: 2-5 CODE:14DIGIT_RECEIPT:OFS|CFS pairs, comma separated; disable xbrl_compare'
        required: false
        type: string
      xbrl_discover_receipts:
        description: 'Discover candidate 2025 annual receipts for 2-5 selected stocks only; manual review required'
        type: boolean
        default: false
      xbrl_fs_div:
        description: 'Known original accounting basis; never inferred from company name'
        required: true
        type: choice
        default: OFS
        options: [OFS, CFS]

permissions:
  contents: read

concurrency:
  group: official-api-probe
  cancel-in-progress: false

jobs:
  provider-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimum probe dependency
        run: python -m pip install 'requests>=2.31,<3'
      - name: Run offline regression suite
        run: |
          python -m unittest discover -s tests -p 'test_official_probe.py' -v
          python -m unittest discover -s tests -p 'test_official_probe_krx_diagnostics.py' -v
          python -m unittest discover -s tests -p 'test_dart_financial_sample.py' -v
          python -m unittest discover -s tests -p 'test_dart_history_research.py' -v
          python -m unittest discover -s tests -p 'test_dart_revision_audit.py' -v
          python -m unittest discover -s tests -p 'test_dart_xbrl_compare.py' -v
          python -m unittest discover -s tests -p 'test_dart_batch_discovery.py' -v
      - name: Probe only authorized and bounded providers
        env:
          ASOF: ${{ inputs.asof }}
          MODE: ${{ inputs.mode }}
          PROVIDER: ${{ inputs.provider }}
          SYMBOLS: ${{ inputs.symbols }}
          FINANCE_SAMPLE: ${{ inputs.finance_sample }}
          HISTORY_SAMPLE: ${{ inputs.history_sample }}
          REVISION_AUDIT: ${{ inputs.revision_audit }}
          REVISION_EXPECTED_RECEIPT: ${{ inputs.revision_expected_receipt }}
          XBRL_COMPARE: ${{ inputs.xbrl_compare }}
          XBRL_RECEIPT: ${{ inputs.xbrl_receipt }}
          XBRL_BATCH_CASES: ${{ inputs.xbrl_batch_cases }}
          XBRL_DISCOVER_RECEIPTS: ${{ inputs.xbrl_discover_receipts }}
          XBRL_FS_DIV: ${{ inputs.xbrl_fs_div }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--asof "$ASOF" --provider "$PROVIDER")
          if [[ "$MODE" == live ]]; then args+=(--live); fi
          if [[ -n "$SYMBOLS" ]]; then args+=(--symbols "$SYMBOLS"); fi
          if [[ "$FINANCE_SAMPLE" == "true" ]]; then
            if [[ "$MODE" != "live" || "$PROVIDER" != "dart" ]]; then
              echo '::error::Annual finance sample requires DART-only live mode.'
              exit 1
            fi
            args+=(--finance-sample)
          fi
          if [[ "$HISTORY_SAMPLE" == "true" ]]; then
            if [[ "$MODE" != "live" || "$PROVIDER" != "dart" || "$FINANCE_SAMPLE" == "true" || -z "$SYMBOLS" ]]; then
              echo '::error::History sample needs live DART, finance_sample=false, and one explicit stock.'
              exit 1
            fi
            args+=(--history-sample)
          fi
          if [[ "$REVISION_AUDIT" == "true" ]]; then
            if [[ "$MODE" != "live" || "$PROVIDER" != "dart" || "$FINANCE_SAMPLE" == "true" || "$HISTORY_SAMPLE" == "true" || -z "$REVISION_EXPECTED_RECEIPT" || -z "$SYMBOLS" ]]; then
              echo '::error::Revision audit requires live DART, single symbol, prior receipt and no other samples.'
              exit 1
            fi
            args+=(--revision-audit --revision-expected-receipt "$REVISION_EXPECTED_RECEIPT")
          elif [[ -n "$REVISION_EXPECTED_RECEIPT" ]]; then
            echo '::error::Prior receipt can only be used with revision audit.'
            exit 1
          fi
          if [[ "$XBRL_DISCOVER_RECEIPTS" == "true" ]]; then
            if [[ "$MODE" != "live" || "$PROVIDER" != "dart" || -z "$SYMBOLS" || "$XBRL_COMPARE" == "true" || -n "$XBRL_RECEIPT" || -n "$XBRL_BATCH_CASES" || "$FINANCE_SAMPLE" == "true" || "$HISTORY_SAMPLE" == "true" || "$REVISION_AUDIT" == "true" || -n "$REVISION_EXPECTED_RECEIPT" ]]; then
              echo '::error::Receipt discovery requires DART-only live and no other research modes.'
              exit 1
            fi
            args+=(--xbrl-discover-receipts)
          fi
          if [[ -n "$XBRL_BATCH_CASES" ]]; then
            if [[ "$MODE" != "live" || "$PROVIDER" != "dart" || -z "$SYMBOLS" || "$XBRL_COMPARE" == "true" || -n "$XBRL_RECEIPT" || "$FINANCE_SAMPLE" == "true" || "$HISTORY_SAMPLE" == "true" || "$REVISION_AUDIT" == "true" || -n "$REVISION_EXPECTED_RECEIPT" ]]; then
              echo '::error::XBRL batch requires DART-only live, explicit symbols/receipts, and no other modes.'
              exit 1
            fi
            args+=(--xbrl-batch-cases "$XBRL_BATCH_CASES")
          fi
          if [[ "$XBRL_COMPARE" == "true" ]]; then
            if [[ "$MODE" != "live" || "$PROVIDER" != "dart" || "$FINANCE_SAMPLE" == "true" || "$HISTORY_SAMPLE" == "true" || "$REVISION_AUDIT" == "true" || -z "$XBRL_RECEIPT" || -z "$SYMBOLS" ]]; then
              echo '::error::XBRL comparison requires live DART, one symbol, valid receipt and no other modes.'
              exit 1
            fi
            args+=(--xbrl-compare --xbrl-receipt "$XBRL_RECEIPT" --xbrl-fs-div "$XBRL_FS_DIV")
          elif [[ -n "$XBRL_RECEIPT" ]]; then
            echo '::error::Receipt is only applicable to XBRL compare mode.'
            exit 1
          fi
          python -m official_probe "${args[@]}"
      - name: Report clearly separated collection and validation status
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          outputs = sorted(Path('evidence/official_probe').glob('probe_*.json'))
          if not outputs:
              print('::warning::Official probe did not produce a result file.')
              raise SystemExit(0)
          r = json.loads(outputs[-1].read_text())
          krx = r.get('krx',{}).get('status','unavailable')
          dart = r.get('dart',{}).get('status','unavailable')
          message = ('Official provider API connectivity: KRX='+krx+', DART='+dart+'. '
                     'Regular-only volume/foreign-institution flows remain UNVERIFIED; '
                     'no investment score is authorized.')
          print('::notice::'+message)
          diag = r.get('krx',{}).get('diagnostic',{})
          safe_market = diag.get('market') if isinstance(diag,dict) else None
          safe_reason = diag.get('reason') if isinstance(diag,dict) else None
          safe_status = diag.get('http_status') if isinstance(diag,dict) else None
          from official_probe.clients import KRXProbeError
          safe_reasons = KRXProbeError.REASONS | {'response_validation_failed'}
          if krx == 'failed':
              print('::warning::KRX safe diagnostic market='+
                    (safe_market if safe_market in ('KOSPI','KOSDAQ') else 'unknown')+
                    ' reason='+(safe_reason if safe_reason in safe_reasons else 'unknown')+
                    ' http_status='+(str(safe_status) if type(safe_status) is int
                                      and 100 <= safe_status <= 599 else 'unavailable'))
          if 'companies_sampled' in r.get('dart', {}):
              for c in r['dart']['companies_sampled']:
                  if 'annual_receipt_discovery' in c:
                      discovery = c['annual_receipt_discovery']
                      print('::notice::DART annual receipt discovery code='+c['code']+
                            ' status='+discovery.get('status', 'unavailable')+
                            ' candidate values private; scope/PIT unverified.')
                  if 'xbrl_comparison' in c:
                      x = c['xbrl_comparison']
                      print('::notice::DART XBRL numeric crosscheck code='+c['code']+
                            ' status='+x.get('status','unavailable')+
                            ' matching_observed='+str(x.get('equal_observed_count',0))+
                            ' total=6; PIT_validated=false; value details only private artifact.')
                  if 'revision_audit' in c:
                      a = c['revision_audit']
                      print('::notice::DART revision code='+c['code']+
                            ' status='+a.get('status','unavailable')+
                            ' filing_versions='+str(a.get('version_count',0))+
                            ' numeric_revision_verified=false; PIT_validated=false.')
                  if 'history_sample' in c:
                      h = c['history_sample']
                      print('::notice::DART history code='+c['code']+
                            ' status='+h.get('status', 'unavailable')+
                            ' years='+str(h.get('annual_years_requested', 0))+
                            ' PIT_validated=false; values only in private artifact.')
                  if 'financial_sample' in c:
                      finance = c['financial_sample']
                      print('::notice::DART annual financial sample code='+c['code']+
                            ' status='+finance.get('status','unavailable')+
                            ' receipt_matched_before_asof='+str(finance.get('receipt_matched_before_asof',False))+
                            ' PIT_validated=false; values only in private artifact.')
          import os
          path = os.environ.get('GITHUB_STEP_SUMMARY')
          if path:
              with open(path,'a',encoding='utf-8') as f:
                  f.write('### Official API connectivity smoke test\n\n'
                          '- KRX status: **'+krx+'**\n'
                          '- OpenDART status: **'+dart+'**\n'
                          '- Regular-only KRX volume: **not verified**\n'
                          '- Foreign/institutional flows: **not verified**\n'
                          '- Investment scoring eligibility: **false**\n')
          PY
      - name: Keep report private; never publish to Pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-api-probe-${{ github.run_id }}
          path: evidence/official_probe/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Fail the workflow if requested live KRX observation failed
        if: always()
        env:
          ASOF: ${{ inputs.asof }}
          MODE: ${{ inputs.mode }}
          PROVIDER: ${{ inputs.provider }}
        run: |
          python -m official_probe.ci_gate --asof "$ASOF" --mode "$MODE" --provider "$PROVIDER"
