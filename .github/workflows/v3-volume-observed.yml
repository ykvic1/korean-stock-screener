name: V3 Source-Observed Volume and MA20/60 Cross 20-Point Research

on:
  push:
    branches: [main]
    paths:
      - v3_volume_participation.py
      - v3_actual_money_contract.py
      - v3_ma240_cross_research.py
      - docs/data.json
      - docs/v22-market-catalog.json
      - .github/workflows/v3-volume-observed.yml
  # Also recheck the latest actual market closing census independent of
  # the lagged DART BS/IS and FCF collector clocks.
  schedule:
    - cron: '12,42 * * * *'
  # GITHUB_TOKEN commits do not emit another push workflow event. Replay
  # the new MA-cross receipt immediately after a completed full-market batch,
  # without waiting for the next hourly timer.
  workflow_run:
    workflows:
      - Full-Market 100-Stock Batches
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [verify, write]
        default: verify
        required: true

permissions:
  contents: write

# The updated volume/OBV research NEVER blocks DART cashflow or the
# 18:30 KST full-market data collection, and cannot be displaced by them.
concurrency:
  group: korea-stock-screener-v3-volume-source
  cancel-in-progress: false

jobs:
  same-close-volume-obv:
    # Reject failed, forked or non-main upstream runs before any publication.
    if: ${{ github.event_name != 'workflow_run' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.head_branch == 'main' &&
             github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject fabricated volume and buyer attribution (no provider network)
        run: |
          set -euo pipefail
          python -m py_compile v3_volume_participation.py
          python -m unittest discover -s tests -p 'test_v3_volume_participation.py' -v
      - name: Recalculate EOD volume and dated MA intersection, 10-16 of 20
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'write' }}
        run: python v3_volume_participation.py --mode write
      - name: Publish ONLY volume-derived private-safe source evidence
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'write' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v3-volume-obv-observed.json docs/v3-volume-obv-observed.csv
          if ! git diff --cached --quiet; then
            git commit -m "Publish actual-market observed volume OBV provisional research"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              python v3_volume_participation.py --mode write
              git add docs/v3-volume-obv-observed.json docs/v3-volume-obv-observed.csv
              if ! git diff --cached --quiet; then
                git commit --amend --no-edit
              fi
              python v3_volume_participation.py --mode verify
              if git push origin HEAD:main; then
                echo "volume_source_published"
                break
              fi
              if [[ "$attempt" == 3 ]]; then
                echo "::error::volume_source_publish_retries_exhausted"
                exit 1
              fi
            done
          fi
      - name: Read-only recheck
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'verify' }}
        run: python v3_volume_participation.py --mode verify
      - name: Explain partial evidence and missingness
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          src=Path("docs/v3-volume-obv-observed.json")
          lines=[
            "### V3 거래량·MA20/60 교차점·OBV 괴리 연구점수 / 투자자 수급 대체 아님",
            "현재 상장종목 전체 행의 자료미확보를 빈칸으로 보존한 CSV도 같은 원장으로 발행.",
            "매매주체(외국인/기관) 판별 없음. OBV 상승만으로 매집 추정 금지.",
            "20점 중 기본 10점 + 유효 260거래일 교차점 관측 시 6점, 별도 매물소화 4점.",
            "20·60일선 골든크로스 교차점과 240일선 대비 ±12%, 최근 20거래일만 인정.",
            "기존 독립 OBV 상승 6점은 삭제. 자료미확보인 교차 6점은 0점이 아님.",
            "당일 거래량 급증은 기술25 내 별도 2점 관측이므로 중복 제외.",
            "일별 보정/정규장 거래량, 기업행사, 산업15, 정식100점 미인증.",
          ]
          if src.is_file():
              a=json.loads(src.read_text(encoding="utf8"))
              lines += [
                "실제 시장자료 기준일: "+str(a["asof"]),
                "전체 상장종목: "+str(a["listed_total"]),
                "V3 거래량·OBV 기본점수 관측기업(최대16점): "+
                  str(a["observed_volume_candidate_issuers"]),
                "미관측·가격결측 기업: "+str(a["insufficient_or_unpriced_issuers"]),
                "공식 100점 인증 기업: 0",
              ]
              audit=a.get("market_cap_bias_diagnostic",{})
              names={"under_500_eok":"500억 미만",
                     "500_to_4999_eok":"500억~5천억",
                     "5000_to_49999_eok":"5천억~5조",
                     "50000_eok_and_above":"5조 이상",
                     "market_cap_unavailable":"시총 기준자료 없음"}
              if audit.get("schema")=="v3-volume-market-cap-reference-bias-audit-0.1":
                  lines.append("### 시총 구간별 편향 진단 (기준시총 미검증·점수 변경 없음)")
                  for row in audit["buckets"]:
                      lines.append(
                          names.get(row["bucket"],row["bucket"])+
                          ": 관측 "+str(row["score_observed_issuers"])+
                          "/"+str(row["listed_issuers"])+
                          ", 관측가능배점 대비 평균 "+str(
                              row["mean_pct_of_observed_available_ceiling"])+
                          "%, 교차6점 "+str(row["ma_cross_qualified_issuers"])+
                          "/"+str(row["ma_cross_eligible_issuers"]))
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(lines)+"\n",encoding="utf8")
          PY
