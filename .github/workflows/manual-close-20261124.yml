name: Manual November 24 close recovery
on:
  push:
    branches: [manual-close-20261124]
    paths: [.github/workflows/manual-close-20261124.yml]
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the requested prior trading session using the existing workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run full-market-batches.yml --ref main -f asof=2026-11-24 -f mode=publish
