name: V3 FY2024 Original Prior-Year FCF Recovery
on:
  pull_request:
    paths:
      - v3_dart_fcf_2024_prior_probe.py
      - tests/test_v3_dart_fcf_2024_prior_probe.py
      - .github/workflows/v3-fcf-2024-prior-probe.yml
  push:
    branches: [main]
    paths:
      - v3_dart_fcf_2024_prior_probe.py
      - .github/workflows/v3-fcf-2024-prior-probe.yml
  workflow_dispatch:
  schedule:
    # Resume saved finite checkpoints after a provider reset/outage.
    - cron: '37 21 * * *'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m unittest discover -s tests -p 'test_v3_dart_fcf_2024_prior_probe.py' -v
          python -m unittest discover -s tests -p 'test_v3_dart_xbrl_cashflow_recovery.py' -v
          python v3_dart_fcf_2024_prior_probe.py --mode dry-run --limit 8
  research:
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    concurrency:
      group: v3-fy2024-prior-fcf-research-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: .cache/v3-dart-company-codes.json
          key: v3-dart-corp-map-v1-${{ hashFiles('docs/v22-market-catalog.json') }}
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Check original FY2024 XBRL against both FY2024 and FY2023 CFO anchors
        id: collect
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          interrupted=1
          for attempt in 1 2; do
            if python v3_dart_fcf_2024_prior_probe.py --mode live --limit 8; then
              interrupted=0
              break
            fi
            if [ "$attempt" -eq 1 ]; then sleep 12; fi
          done
          echo "interrupted=$interrupted" >> "$GITHUB_OUTPUT"
      - name: Persist independently checked research markers, without changing scores
        id: persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ ! -f docs/v3-fcf-2024-prior-research.json ]; then exit 0; fi
          git add docs/v3-fcf-2024-prior-research.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record independently anchored FY2024 original FY2023 CAPEX checks'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo '::error::fcf_comparative_push_retries_exhausted'
          exit 1
      - name: Check remaining unreviewed receipts offline
        id: remaining
        if: steps.collect.outputs.interrupted == '0' && steps.persist.outputs.changed == 'true'
        run: |
          set -euo pipefail
          count=$(python v3_dart_fcf_2024_prior_probe.py --mode dry-run --limit 1 | python -c 'import json,sys; print(json.load(sys.stdin)["selected"])')
          if [ "$count" = 1 ]; then echo 'ready=true' >> "$GITHUB_OUTPUT"; fi
      - name: Continue bounded official source research after saved progress
        if: steps.remaining.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/v3-fcf-2024-prior-probe.yml/dispatches" -f ref=main --silent
      - name: Surface interrupted source only after saving verified checkpoints
        if: steps.collect.outputs.interrupted == '1'
        run: exit 1
