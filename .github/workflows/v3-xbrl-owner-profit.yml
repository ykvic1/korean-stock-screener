name: V3 Original XBRL Attributable Owner Profit Recovery
on:
  pull_request:
    paths:
      - v3_dart_xbrl_owner_profit.py
      - tests/test_v3_dart_xbrl_owner_profit.py
      - .github/workflows/v3-xbrl-owner-profit.yml
  push:
    branches: [main]
    paths:
      - v3_dart_xbrl_owner_profit.py
      - .github/workflows/v3-xbrl-owner-profit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m unittest discover -s tests -p 'test_v3_dart_xbrl_owner_profit.py' -v
          python -m unittest discover -s tests -p 'test_v3_dart_2025_owner_profit_probe.py' -v
          python -m unittest discover -s tests -p 'test_v3_owner_profit_reconciliation.py' -v
          python -m unittest discover -s tests -p 'test_v3_dart_xbrl_cashflow_recovery.py' -v
          python v3_dart_xbrl_owner_profit.py --mode dry-run --limit 8
  recover:
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    concurrency:
      # Share the existing owner-profit writer lock; no concurrent ledger overwrite.
      group: korea-stock-screener-v3-2025-owner-profit-gap-recovery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: .cache/v3-dart-company-codes.json
          key: v3-dart-corp-map-v1-${{ hashFiles('docs/v22-market-catalog.json') }}
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Recover original attributable profit with exact scope and CFO anchors
        id: collect
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          set -euo pipefail
          interrupted=0
          # Four finite checkpointed batches; stop immediately at a source
          # interruption or an exhausted queue. No repeated failing receipt.
          for segment in 1 2 3 4; do
            if ! result="$(python v3_dart_xbrl_owner_profit.py --mode live --limit 8)"; then
              echo "$result"
              interrupted=1
              break
            fi
            echo "$result"
            completed="$(printf '%s' "$result" | python -c 'import json,sys; print(json.load(sys.stdin)["completed"])')"
            if [[ "$completed" == '0' ]]; then break; fi
          done
          echo "interrupted=$interrupted" >> "$GITHUB_OUTPUT"
      - name: Verify and publish derived observations before reporting any interruption
        id: publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python v3_dart_2025_owner_profit_probe.py --mode refresh
          python v3_dart_2025_owner_profit_probe.py --mode verify
          git add docs/v3-dart-owner-profit-supplement.json docs/v3-near-100-evidence-priority.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Recover independently anchored original attributable owner profit'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            python v3_dart_2025_owner_profit_probe.py --mode refresh
            git add docs/v3-dart-owner-profit-supplement.json docs/v3-near-100-evidence-priority.json
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
            python v3_dart_2025_owner_profit_probe.py --mode verify
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo '::error::verified_owner_profit_push_retries_exhausted'
          exit 1
      - name: Replay validated current observations even after a partial collection
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/v3-current-observed-scorecard.yml/dispatches" -f ref=main -f 'inputs[mode]=write' --silent
      - name: Surface source interruption after preserving validated observations
        if: steps.collect.outputs.interrupted == '1'
        run: exit 1
