name: V3.0b Historical Corporate Action Price Anchors

on:
  push:
    branches: [main, v30b-fixed-snapshot-verification-expansion]
    paths:
      - v3_historical_corporate_action_price_anchors.py
      - .github/workflows/v3-historical-corporate-action-price-anchors.yml
  workflow_dispatch:
    inputs:
      additional_offset:
        description: Offset into reviewed actions beyond the original sample
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: v30b-historical-corporate-action-price-anchors
  cancel-in-progress: false

jobs:
  spotcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: ${{ fromJSON((github.ref_name == 'v30b-fixed-snapshot-verification-expansion' || inputs.additional_offset != '') && '["additional"]' || '["split_and_reduction","january_exchanges","february_and_april_exchanges","july_and_august_exchanges","treasury_delivery_and_consolidation"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3' 'pyarrow>=20,<27' 'pandas>=2,<3'
      - name: Download fixed public replay inputs
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/93713f5a0a80ff29dc10e5aba9c8a51353e0e1b4/data/marcap-2025.parquet -o pilot-2025.parquet
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/24a2bec363aaad0ba2e3494966108995d196702d/data/marcap-2026.parquet -o pilot-2026.parquet
          curl -fsSL --max-time 30 https://raw.githubusercontent.com/FinanceData/fdr_krx_data_cache/05a17038b3cddf7a6f48105913e46fd37d96a21e/data/listing/krx/2026-11-13.csv -o pilot-2026-11-13.csv
      - name: Compare the official before-and-after trade anchors in memory
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          PILOT_BATCH: ${{ matrix.batch }}
          ADDITIONAL_OFFSET: ${{ inputs.additional_offset }}
        run: |
          set -euo pipefail
          args=(--batch "$PILOT_BATCH")
          if [[ "$PILOT_BATCH" == additional ]]; then
            args=(--additional-offset "${ADDITIONAL_OFFSET:-4}")
          fi
          python v3_historical_corporate_action_price_anchors.py "${args[@]}" "$RUNNER_TEMP/pilot-2025.parquet" "$RUNNER_TEMP/pilot-2026.parquet" "$RUNNER_TEMP/pilot-2026-11-13.csv"
