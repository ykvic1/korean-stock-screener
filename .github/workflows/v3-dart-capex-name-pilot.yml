name: V3 DART CAPEX Nonstandard Name Evidence Pilot (no scores)

on:
  push:
    branches: [main]
    paths:
      - v3_dart_capex_name_pilot.py
      - tests/test_v3_dart_capex_name_pilot.py
      - .github/workflows/v3-dart-capex-name-pilot.yml
  pull_request:
    branches: [main]
    paths:
      - v3_dart_capex_name_pilot.py
      - tests/test_v3_dart_capex_name_pilot.py
      - .github/workflows/v3-dart-capex-name-pilot.yml
  schedule:
    # Sunday 12:47 KST. Twelve bounded official reads, rotating issuer
    # strata weekly rather than repeatedly querying the first cohort.
    - cron: '47 3 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: dry-run
        options: [dry-run, live]
      cohort_index:
        type: number
        required: false
        default: 0

permissions:
  contents: read

concurrency:
  group: korea-stock-screener-dart-capex-name-pilot
  cancel-in-progress: false

jobs:
  evidence-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore verified listed-issuer DART company mapping
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/cache@v4
        with:
          path: .cache/v3-dart-company-codes.json
          key: v3-dart-corp-map-v1-${{ hashFiles('docs/v22-market-catalog.json') }}
      - name: Test strict official receipt and name candidate validation offline
        run: |
          set -euo pipefail
          python -m py_compile v3_dart_capex_name_pilot.py
          python -m unittest discover -s tests -p 'test_v3_dart_capex_name_pilot.py' -v
      - name: Install official provider HTTP dependencies in live mode only
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || inputs.mode == 'live' }}
        run: python -m pip install 'requests>=2.31,<3'
      - name: Probe at most 12 rotated missing-CAPEX company-years
        env:
          DART_API_KEY: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')) && secrets.DART_API_KEY || '' }}
          MODE: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'live' || inputs.mode || 'dry-run' }}
          COHORT_INDEX: ${{ github.event_name == 'schedule' && 'auto' || inputs.cohort_index || '0' }}
        run: |
          set -euo pipefail
          if [[ "$COHORT_INDEX" == "auto" ]]; then
            COHORT_INDEX="$(python -c 'from datetime import date,datetime,timezone; print(1+max(0,(datetime.now(timezone.utc).date()-date(2026,10,31)).days)//7)')"
          fi
          python v3_dart_capex_name_pilot.py --mode "$MODE" --limit 12 --cohort-index "$COHORT_INDEX" | tee /tmp/v3-capex-pilot-aggregate.json
      - name: Publish aggregate-only result in workflow summary
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          source=Path('/tmp/v3-capex-pilot-aggregate.json')
          lines=[
              '### 공식 DART 비표준 CAPEX 계정명 소규모 원천 조사',
              '대상은 CFO가 있지만 유형·무형 CAPEX 한쪽 또는 양쪽이 미확인인 기업·연도 최대 12건입니다.',
              '계정명·종목코드·금액·접수번호 미공개. 실제 FCF·점수 변경 없음.',
          ]
          if source.is_file() and source.stat().st_size:
              report=json.loads(source.read_text(encoding='utf8'))
              for key,label in (
                  ('cohort_index','순환 표본 회차'),
                  ('eligible_sampled_issuer_years','표본 기업·연도'),
                  ('provider_source_calls','실제 공식 재무제표 조회'),
                  ('component_name_evaluations','누락 CAPEX 구성요소별 계정명 검사'),
                  ('unique_exact_name_candidate','구성요소별 유일한 정확명 후보(금액 미인증)'),
                  ('ambiguous_multiple_candidates','복수 계정명 후보로 검증 불가'),
                  ('no_exact_name_candidate','일치 계정명 없음'),
                  ('no_report_rows','원천 응답 자료 없음')):
                  lines.append('- '+label+': **'+str(report.get(key,'미확인'))+'**')
              gap_shapes=report.get('name_gap_shapes',{})
              lines.append('#### CAPEX 계정명·코드·본문/세부항목 차이(익명 연구용)')
              for shape,label in (
                  ('no_name_lead','계정명 단서 없음'),
                  ('multiple_name_leads_unverified','복수 계정명 단서(미인증)'),
                  ('name_lead_missing_code_unverified','계정코드 누락·형식 이상'),
                  ('name_lead_detail_unverified','세부항목 위치 형식 불명'),
                  ('name_lead_non_krw_unverified','비원화 계정명 단서'),
                  ('exact_nonstandard_top_level','정확명·비표준코드·본문'),
                  ('exact_nonstandard_detail','정확명·비표준코드·세부'),
                  ('exact_other_code_top_level','정확명·기타코드·본문'),
                  ('exact_other_code_detail','정확명·기타코드·세부'),
                  ('variant_nonstandard_top_level','변형명·비표준코드·본문'),
                  ('variant_nonstandard_detail','변형명·비표준코드·세부'),
                  ('variant_other_code_top_level','변형명·기타코드·본문'),
                  ('variant_other_code_detail','변형명·기타코드·세부')):
                  lines.append('- '+label+': **'+str(gap_shapes.get(shape,'미확인'))+'**')
              lines.append('공시 1회에서 두 누락 요소를 검사할 수 있으므로 구성요소 검사 건수는 조회 횟수를 초과할 수 있습니다.')
              lines.append('기타 계정코드는 표준 분류 인증을 뜻하지 않으며, 합산·FCF·투자점수에 반영하지 않습니다.')
              for key,label in (
                  ('sampled_by_fiscal_year','실제 조사 연도별 표본'),
                  ('sampled_by_scope','연결/별도 기준 표본'),
                  ('sampled_by_missing_component','미확보 CAPEX 종류별 표본')):
                  lines.append('- '+label+': **'+str(report.get(key,'미확인'))+'**')
          else:
              lines.append('- 조사 완료 보고서 없음: 원천·테스트 오류 검토 필요')
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(
              '\n'.join(lines)+'\n',encoding='utf8')
          PY
