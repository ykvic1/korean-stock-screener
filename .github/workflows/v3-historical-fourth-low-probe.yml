name: V3.0b Fourth Official KRX LOW Probe
on:
  push:
    branches: [v30b-krx-pre-first-low-fourth-20261123]
    paths: [.github/workflows/v3-historical-fourth-low-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/v30b-krx-pre-first-low-fourth-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3' 'pyarrow>=20,<27' 'pandas>=2,<3'
      - run: python -m py_compile v3_historical_pretouch_official_low_fourth.py
      - name: Download pinned public replay inputs
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/93713f5a0a80ff29dc10e5aba9c8a51353e0e1b4/data/marcap-2025.parquet -o pilot-2025.parquet
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/24a2bec363aaad0ba2e3494966108995d196702d/data/marcap-2026.parquet -o pilot-2026.parquet
          curl -fsSL --max-time 30 https://raw.githubusercontent.com/FinanceData/fdr_krx_data_cache/05a17038b3cddf7a6f48105913e46fd37d96a21e/data/listing/krx/2026-11-13.csv -o pilot-2026-11-13.csv
      - name: Verify next five KRX sessions
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          set -euo pipefail
          python v3_historical_pretouch_official_low_fourth.py "$RUNNER_TEMP/pilot-2025.parquet" "$RUNNER_TEMP/pilot-2026.parquet" "$RUNNER_TEMP/pilot-2026-11-13.csv" > "$RUNNER_TEMP/fourth-low.json"
          jq -e '.official_low_holder_days_exact == 21 and .performance_validated == false and .v30b_release_ready == false' "$RUNNER_TEMP/fourth-low.json" > /dev/null
          jq . "$RUNNER_TEMP/fourth-low.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: v30b-fourth-official-low-proof
          path: ${{ runner.temp }}/fourth-low.json
          if-no-files-found: error
