name: Verify frozen annual primary-statement values
on:
  workflow_run:
    workflows: ["V3.0b Historical Annual Disclosure Recovery"]
    types: [completed]
  workflow_dispatch:
    inputs:
      remaining:
        description: Check offsets from 425 through 2250
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  compare:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.id == 45349779494 && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        start: ${{ fromJSON((github.event_name == 'workflow_run' || inputs.remaining == true) && '[425,525,625,725,825,925,1025,1125,1225,1325,1425,1525,1625,1725,1825,1925,2025,2125,2225]' || '[0,100,200,300,400]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Load original receipt archives for this range
        env:
          START: ${{ matrix.start }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          end=$((START+100))
          if (( START < 425 && end > 425 )); then end=425; fi
          if (( end > 2267 )); then end=2267; fi
          echo "BATCH_END=$end" >> "$GITHUB_ENV"
          for ((offset=START; offset<end; offset+=25)); do
            name="historical-annual-receipt-recovery-$offset"
            if (( offset == 0 )); then run=45332003874; name=historical-annual-receipt-recovery
            elif (( offset == 25 )); then run=45336398969
            elif (( offset < 150 )); then run=45333054049
            elif (( offset < 425 )); then run=45334311942
            else run=45349779494
            fi
            gh run download "$run" --name "$name" --dir "inputs/$offset"
          done
          curl -fsSL --retry 2 --max-time 90 https://raw.githubusercontent.com/ykvic1/korean-stock-screener/62ec75bd9769a7e4102a56d1f323176c10156e95/docs/v3-dart-bulk-history.json -o "$RUNNER_TEMP/financial.json"
      - name: Match original receipt and primary-statement amounts
        env:
          START: ${{ matrix.start }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python v3_frozen_primary_statements.py "$RUNNER_TEMP/financial.json" inputs "$START" "$BATCH_END"
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-primary-statements-${{ matrix.start }}
          path: primary-statement-evidence.json
          if-no-files-found: error
          retention-days: 90

  summarize:
    needs: compare
    if: success() && (github.event_name == 'workflow_run' || inputs.remaining == true)
    runs-on: ubuntu-latest
    steps:
      - name: Collect first and remaining primary-statement results
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for run in 45396632869 "$GITHUB_RUN_ID"; do
            gh run download "$run" --pattern 'frozen-primary-statements-*' --dir "inputs/$run"
          done
      - name: Verify all distinct offsets and combine metric outcomes
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json

          cohort = 2267
          anchor = "2025-11-13"
          cursor = 0
          statuses = Counter()
          fields = {name: Counter() for name in ("assets", "liabilities", "equity", "operating_income", "revenue")}
          issuers = set()
          pins = ["2bfd93c217eb74263bc5020b23fa6debb6b02531c11eaccc2826639bc191559e",
                  "991b4765f806932fe810d7a21aa7565809517e925da5d7c8d7c99ea462d23a8c",
                  "41e82e39460d38091c5eeeefe3d20c72f51a7a36651e810efbaf1dcadde303f4"]
          batches = [json.loads(p.read_bytes()) for p in Path("inputs").rglob("primary-statement-evidence.json")]
          for row in sorted(batches, key=lambda r: r["start"]):
              outcomes = row["outcomes"]
              if (row["anchor"] != anchor or row["pinned_sources_sha256"] != pins
                      or row["start"] != cursor or row["end"] <= cursor
                      or row["end"] - cursor != row["issuers"] or row["issuers"] != sum(row["statuses"].values())
                      or len(outcomes) != row["statuses"].get("compared", 0) or issuers.intersection(outcomes)):
                  raise ValueError("overlapping_or_inconsistent_batch")
              for name, totals in fields.items():
                  recounted = Counter(outcome["fields"][name] for outcome in outcomes.values())
                  if recounted != row["primary_statement_fields"][name]:
                      raise ValueError("inconsistent_primary_statement_count")
                  totals.update(recounted)
              issuers.update(outcomes)
              statuses.update(row["statuses"])
              cursor = row["end"]
          if cursor != cohort:
              raise ValueError("missing_final_issuer_range")
          report = {"anchor": anchor, "issuers": cursor, "statuses": statuses, "primary_statement_fields": fields}
          print(json.dumps(report, sort_keys=True))
          Path("primary-statement-totals.json").write_text(json.dumps(report, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-primary-statement-totals
          path: primary-statement-totals.json
          if-no-files-found: error
