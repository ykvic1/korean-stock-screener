name: V3 KRX historical derived-only backfill

on:
  # Resume the approved derived-only history collection on vetted main
  # merge, then continue through twelve bounded daily windows, with capped private snapshots.
  push:
    branches: [main]
    paths:
      - v3_krx_derived_backfill.py
      - v3_krx_derived_5day.py
      - .github/workflows/v3-krx-derived-history.yml
  schedule:
    - cron: '11 17 * * *'  # 02:11 KST, additional bounded historical replay
    - cron: '11 22 * * *'  # 07:11 KST, derived private backlog only
    - cron: '11 2 * * *'   # 11:11 KST, fifth bounded historical replay slot
    - cron: '11 5 * * *'   # 14:11 KST
    - cron: '11 13 * * *'  # 22:11 KST, outside main market workflow
    - cron: '11 8 * * *'   # 17:11 KST, bounded private historical backfill
    - cron: '11 15 * * *'  # 00:11 KST, bounded private historical backfill
    - cron: '11 0 * * *'   # 09:11 KST
    - cron: '11 4 * * *'   # 13:11 KST
    - cron: '11 10 * * *'  # 19:11 KST
    - cron: '11 19 * * *'  # 04:11 KST
    - cron: '11 23 * * *'  # 08:11 KST
  workflow_dispatch:
    inputs:
      max_windows:
        description: 'Max 5-session transformed cohorts this run (1/4/8/16)'
        type: choice
        options: ['1', '4', '8', '16']
        default: '16'
        required: true

permissions:
  contents: read

concurrency:
  group: v3-krx-private-derived-history
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official KRX client and XKRX session candidates
        run: python -m pip install 'requests>=2.31,<3' 'exchange-calendars==4.13.1'
      - name: Check only-derived source retention, historical resume and unverified-score boundaries
        run: |
          set -euo pipefail
          python -m py_compile v3_krx_derived_5day.py v3_krx_derived_backfill.py
          python -m unittest discover -s tests -p 'test_v3_krx_derived_backfill.py' -v
          python -m unittest discover -s tests -p 'test_v3_krx_derived_5day.py' -v
      - name: Resume up to sixteen historical five-session derived cohorts
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
          V3_DERIVED_BATCH_WINDOWS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_windows || '16' }}
          V3_BULK_BATCHES: ${{ github.event_name == 'push' && '4' || '1' }}
        run: |
          set -euo pipefail
          for batch in $(seq 1 "$V3_BULK_BATCHES"); do
            echo "Bounded historical collection batch $batch/$V3_BULK_BATCHES"
            python v3_krx_derived_backfill.py
          done
