name: V3 Four-Year DART Financial Evidence (bounded daily rotation)

on:
  # Capped live enrichment: four issuers per weekday at 02:43 KST.
  # Runs AFTER the first single-year DART book pass at 01:17 KST, so
  # annual-book and market snapshot source dates can match. Shared publication
  # lock avoids all concurrent writes, even if GitHub schedules run late.
  schedule:
    - cron: '43 17 * * 0-4'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Dry-run requires no DART key and writes no files. Live is explicit.'
        required: true
        default: 'dry-run'
        type: choice
        options: ['dry-run', 'live']
      max_issuers:
        description: 'Manual run cap; scheduled live is always at most 4 issuers'
        required: true
        default: '2'
        type: choice
        options: ['1', '2', '4']

permissions:
  contents: write

concurrency:
  group: korea-stock-screener-publication
  cancel-in-progress: false

jobs:
  four-year-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official DART HTTP transport (only live mode uses network)
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'live' }}
        run: python -m pip install 'requests>=2.31,<3'
      - name: Verify source-date and four-year research constraints (no network)
        run: |
          python -m py_compile v3_dart_four_year_reference.py official_data.py
          python -m unittest discover -s tests -p 'test_v3_dart_four_year_reference.py' -v
      - name: Plan bounded four-year cohort and optionally request real receipts
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          REQUESTED_MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
          ISSUER_LIMIT: ${{ github.event_name == 'schedule' && '4' || inputs.max_issuers }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import date,datetime
          from zoneinfo import ZoneInfo
          import json,os
          from v3_dart_four_year_reference import plan,write
          market=json.loads(Path('docs/data.json').read_text(encoding='utf8'))
          catalog=json.loads(Path('docs/v22-market-catalog.json').read_text(encoding='utf8'))
          book=json.loads(Path('docs/v3-dart-book-reference.json').read_text(encoding='utf8'))
          day=date.fromisoformat(market['date'])
          age=(datetime.now(ZoneInfo('Asia/Seoul')).date()-day).days
          if age not in range(0,10):
              raise ValueError('stale_fouryear_market_snapshot')
          output=Path('docs/v3-dart-four-year-reference.json')
          prior=json.loads(output.read_text(encoding='utf8')) if output.is_file() else None
          limit=int(os.environ['ISSUER_LIMIT'])
          snapshot,members,existing,targets=plan(
              market,catalog,book,prior=prior,limit=limit)
          print('market_source=',snapshot,'current_listed=',len(members),
                'four_year_cached=',sum(x['same_scope_four_years'] for x in existing.values()),
                'pilot_target_count=',len(targets),
                'mode=',os.environ['REQUESTED_MODE'])
          if os.environ['REQUESTED_MODE']=='live':
              if not os.environ.get('DART_API_KEY','').strip() and targets:
                  raise ValueError('live_fouryear_dart_key_unavailable')
              result=write(market,catalog,book,output=output,prior=prior,
                           key=os.environ.get('DART_API_KEY'),limit=limit)
              for field in ('full_v3_ready','four_years_all_financial_pillars_certified',
                            'raw_account_rows_stored'):
                  if result[field] is not False:
                      raise ValueError('unearned_fouryear_certification')
              print('bounded_live_fouryear_targets=',result['requested_this_run'],
                    'four_year_fiscal_windows=',result['four_consecutive_years_observed_count'],
                    'current_core_usable=',result['current_core_financial_research_observed_count'],
                    'incomplete_cohort=',result['unverified_issuer_count'],
                    'full_financial15_scoring=False')
          PY
      - name: Publish only completed derived four-year annual references
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'live' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v3-dart-four-year-reference.json
          if ! git diff --cached --quiet; then
            git commit -m "Bounded four-year annual statement evidence (research only)"
            git pull --rebase origin main
            python - <<'PY'
          from pathlib import Path
          import json
          market=json.loads(Path('docs/data.json').read_text(encoding='utf8'))
          catalog=json.loads(Path('docs/v22-market-catalog.json').read_text(encoding='utf8'))
          annual=json.loads(Path('docs/v3-dart-book-reference.json').read_text(encoding='utf8'))
          four=json.loads(Path('docs/v3-dart-four-year-reference.json').read_text(encoding='utf8'))
          if (market['date']!=catalog['date'] or annual['asof']!=market['date']
              or four['asof']!=market['date']
              or annual['market_listed_total']!=four['listed_total']
              or four['full_v3_ready'] is not False
              or four['raw_account_rows_stored'] is not False
              or four['confirmed_six_pillar_ranks'] is not None
              or four.get('historical_PIT_source_certified') is not False
              or four['requested_this_run']>4):
              raise ValueError('stale_rebased_fouryear_not_publishable')
          print('Validated no-stale four-year research-only publication')
          PY
            git push origin HEAD:main
          fi
      - name: Never promote annual references to investment scoring
        if: always()
        run: |
          echo 'No live V3 six-pillar score, financial15 or valuation15 is released.'
          echo 'Original DART accounts and API credentials are never published.'
