name: V3 One-Shot KRX Pre-First LOW Verification 20261123

# Branch-only one-time probe; do not merge this workflow into main.
on:
  push:
    branches: [v30b-pre-first-touch-official-low-gap-20261123]
    paths: [.github/workflows/v3-one-shot-pre-first-low-official-20261123.yml]

permissions:
  contents: read

concurrency:
  group: v30b-pre-first-low-official-five-days
  cancel-in-progress: false

jobs:
  pre-first-low:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3' 'pyarrow>=20,<27' 'pandas>=2,<3'
      - name: Run strict offline negative-case unit tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v3_historical_pretouch_official_low_gap.py' -v
      - name: Download exact frozen independent public price observations
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/93713f5a0a80ff29dc10e5aba9c8a51353e0e1b4/data/marcap-2025.parquet -o pilot-2025.parquet
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/24a2bec363aaad0ba2e3494966108995d196702d/data/marcap-2026.parquet -o pilot-2026.parquet
          curl -fsSL --max-time 30 https://raw.githubusercontent.com/FinanceData/fdr_krx_data_cache/05a17038b3cddf7a6f48105913e46fd37d96a21e/data/listing/krx/2026-11-13.csv -o pilot-2026-11-13.csv
      - name: Reconcile all previously authenticated marketwide KRX OHLC days and plan ONLY missing days
        run: |
          set -euo pipefail
          python v3_historical_pretouch_official_low_gap.py "$RUNNER_TEMP/pilot-2025.parquet" "$RUNNER_TEMP/pilot-2026.parquet" "$RUNNER_TEMP/pilot-2026-11-13.csv" > "$RUNNER_TEMP/first-low-plan.json"
          jq -e '.original_issuers_with_replayed_low_touch == 14 and .pre_touch_holder_days_without_existing_official_ohlc_date > 0 and .first_touch_earliest_low_certified == false and .v30b_release_ready == false' "$RUNNER_TEMP/first-low-plan.json" >/dev/null
          jq -c . "$RUNNER_TEMP/first-low-plan.json"
      - name: Independently authenticate up to five missing KRX OHLC dates
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          set -euo pipefail
          python v3_historical_pretouch_official_low_gap.py "$RUNNER_TEMP/pilot-2025.parquet" "$RUNNER_TEMP/pilot-2026.parquet" "$RUNNER_TEMP/pilot-2026-11-13.csv" --probe > "$RUNNER_TEMP/pre-first-low-evidence.json"
          jq -e '.official_low_holder_days_exact == .planning.bounded_next_issuer_low_observations and .planning.maximum_official_krx_api_requests_if_executed == 10 and .has_verified_all_pre_first_touch_holder_lows == false and .performance_validated == false and .v30b_release_ready == false' "$RUNNER_TEMP/pre-first-low-evidence.json" >/dev/null
          jq -c . "$RUNNER_TEMP/pre-first-low-evidence.json"
          jq 'del(.official)' "$RUNNER_TEMP/pre-first-low-evidence.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain only anonymous aggregate source fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-first-low-official-evidence
          path: |
            ${{ runner.temp }}/first-low-plan.json
            ${{ runner.temp }}/pre-first-low-evidence.json
          if-no-files-found: ignore
          retention-days: 90
