name: One-time KRX 4-session residual derived-only source verification

on:
  push:
    branches: [v3-dart-audit-snapshot-lag-partial-tail-20261020]
    paths:
      - .github/workflows/v3-krx-fourday-tail-once.yml

permissions:
  contents: read

concurrency:
  group: v3-krx-private-derived-history
  cancel-in-progress: false

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-dart-audit-snapshot-lag-partial-tail-20261020
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies without any paid service
        run: python -m pip install 'requests>=2.31,<3' 'exchange-calendars==4.13.1'
      - name: Verify DART stale-book audit and 4-session derived-only local regressions
        run: |
          set -euo pipefail
          python -m py_compile v3_dart_offline_lag_plan.py v3_krx_derived_four_session_tail.py
          python -m unittest discover -s tests -p 'test_v3_dart_offline_lag_plan.py' -v
          python -m unittest discover -s tests -p 'test_v3_krx_derived_four_session_tail.py' -v
      - name: Read precisely four real KRX historic days into RAM, store only private factors
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
        run: |
          set -euo pipefail
          python v3_krx_derived_four_session_tail.py
