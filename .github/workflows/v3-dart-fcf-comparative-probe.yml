name: V3 FY2025 DART CF Comparative Missing-Fact Probe (No Score)

on:
  pull_request:
    paths: [v3_dart_fcf_comparative_probe.py, tests/test_v3_dart_fcf_comparative_probe.py, .github/workflows/v3-dart-fcf-comparative-probe.yml]
  push:
    branches: [main]
    paths: [v3_dart_fcf_comparative_probe.py, .github/workflows/v3-dart-fcf-comparative-probe.yml]
  # Four bounded sweeps daily: up to 120 issuers / 241 calls including mapping.
  # Ten-minute live deadline keeps partial progress explicit.
  schedule:
    - cron: '31 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: dry-run
        options: [dry-run, live]
      cohort_index:
        type: number
        required: true
        default: 0

permissions:
  contents: read

concurrency:
  group: korea-stock-screener-fcf-comparative-research
  cancel-in-progress: false

jobs:
  receipt-checked-comparative-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Strict source identities and missing-fact tests
        run: |
          python -m py_compile v3_dart_fcf_comparative_probe.py
          python -m unittest discover -s tests -p 'test_v3_dart_fcf_comparative_probe.py' -v
          python v3_dart_fcf_comparative_probe.py --mode dry-run --limit 120 --cohort-index 0
      - name: Restore verified DART company code mapping
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/cache/restore@v4
        with:
          path: .cache/v3-dart-company-codes.json
          key: v3-dart-corp-map-v1-${{ hashFiles('docs/v22-market-catalog.json') }}
      - name: Install official client for bounded live research
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.mode == 'live' }}
        run: python -m pip install 'requests>=2.31,<3'
      - name: Sample FY2025 prior-year columns without promoting scores
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 'live' || inputs.mode }}
          COHORT: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && github.run_number || inputs.cohort_index }}
        run: |
          set -euo pipefail
          # Only fixed aggregate counters (no codes/receipts/amounts) appear
          # in the job log, so progress is auditable without private access.
          python v3_dart_fcf_comparative_probe.py --mode "$MODE" --limit 120 --cohort-index "$COHORT" --audit-annual-receipts | tee /tmp/v3-cf-comparative-counts.json
      - name: Aggregate-only report; no original-year or investment certification
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('/tmp/v3-cf-comparative-counts.json')
          lines=['### V3.0b FY2023-2024 FCF comparison-candidate audit',
              'FY2025 comparative columns are not original FY2023/2024 facts; DART list metadata is not original disclosure body proof.',
              'No stock IDs, amounts, API keys, FCF ledger changes or score promotion.']
          if p.is_file() and p.stat().st_size:
              a=json.loads(p.read_text(encoding='utf8'))
              for k in ('asof','eligible_one_gap_fcf_issuers','sampled_issuers','completed_issuers','quarantined_issuers','unprocessed_issuers','selection_covers_all_eligible','status','provider_calls'):
                  lines.append('- '+k+': '+str(a.get(k)))
              for k,v in a.get('candidate_fact_counts',{}).items():
                  lines.append('- '+k+': '+str(v))
          else:
              lines.append('No completed official-source audit; score unchanged.')
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines)+'\n')
          PY
