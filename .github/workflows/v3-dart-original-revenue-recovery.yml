name: V3 Original Annual Revenue Recovery (90 First)
on:
  push:
    branches: [main]
    paths:
      - v3_dart_original_revenue_recovery.py
      - .github/workflows/v3-dart-original-revenue-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-original-annual-revenue-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Test original annual revenue source validation
        run: python -m unittest discover -s tests -p 'test_v3_dart_original_revenue_recovery.py' -v
      - name: Review original annual receipts
        id: collect
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if python v3_dart_original_revenue_recovery.py; then
            echo 'interrupted=false' >> "$GITHUB_OUTPUT"
          else
            echo 'interrupted=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish verified checkpoints
        id: publish
        run: |
          set -euo pipefail
          path=docs/v3-dart-original-revenue-recovery.json
          if [[ ! -f "$path" ]]; then exit 0; fi
          git add "$path"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish receipt-matched original annual revenue observations'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Check whether verified observed revenue changed
        if: steps.publish.outputs.changed == 'true'
        id: replay
        run: |
          python - <<'PY'
          import json, os, subprocess

          path = "docs/v3-dart-original-revenue-recovery.json"
          def observed(ref):
              data = json.loads(subprocess.check_output(["git", "show", f"{ref}:{path}"]))
              if data["schema"] != "v3-dart-original-annual-sales-receipt-v1":
                  raise ValueError("unknown_revenue_checkpoint_schema")
              return {key: row for key, row in data["records"].items()
                      if row["status"] == "observed"}
          try:
              required = observed("HEAD^") != observed("HEAD")
          except (subprocess.CalledProcessError, ValueError, KeyError, TypeError, AttributeError):
              # An unreadable parent cannot establish a review-only change.
              required = True
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"required={str(required).lower()}\n")
          print(json.dumps({"original_revenue_score_replay_required": required}))
          PY
      - name: Refresh operational availability
        if: steps.replay.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run v3-operational-research-score.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Report collection interruption
        if: steps.collect.outputs.interrupted == 'true'
        run: exit 1
