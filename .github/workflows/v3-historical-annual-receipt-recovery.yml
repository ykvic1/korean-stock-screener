name: V3.0b Historical Annual Disclosure Recovery

on:
  push:
    branches: [main, v30b-fixed-snapshot-verification-expansion]
    paths:
      - v3_historical_annual_receipt_recovery.py
      - .github/workflows/v3-historical-annual-receipt-recovery.yml
  workflow_dispatch:
    inputs:
      reference_offset:
        description: Offset into the pinned pre-anchor receipt cohort
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: v30b-historical-annual-receipt-recovery
  cancel-in-progress: false

jobs:
  version-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        offset: ${{ fromJSON(github.ref_name == 'v30b-fixed-snapshot-verification-expansion' && github.event_name == 'push' && '["425","450","475","500","525","550","575","600","625","650","675","700","725","750","775","800","825","850","875","900","925","950","975","1000","1025","1050","1075","1100","1125","1150","1175","1200","1225","1250","1275","1300","1325","1350","1375","1400","1425","1450","1475","1500","1525","1550","1575","1600","1625","1650","1675","1700","1725","1750","1775","1800","1825","1850","1875","1900","1925","1950","1975","2000","2025","2050","2075","2100","2125","2150","2175","2200","2225","2250"]' || '[""]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3' 'pyarrow>=20,<27' 'pandas>=2,<3'
      - name: Download pinned historical cohort inputs
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/FinanceData/marcap/93713f5a0a80ff29dc10e5aba9c8a51353e0e1b4/data/marcap-2025.parquet -o historical-prices.parquet
          base=https://raw.githubusercontent.com/ykvic1/korean-stock-screener/62ec75bd9769a7e4102a56d1f323176c10156e95/docs
          curl -fsSL --max-time 45 "$base/v3-dart-bulk-history.json" -o historical-financial-pin.json
          curl -fsSL --max-time 30 "$base/v22-market-catalog.json" -o historical-catalog-pin.json
      - name: Identify and validate pre-cutoff body versions from OpenDART
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          REFERENCE_OFFSET: ${{ matrix.offset || inputs.reference_offset }}
        run: |
          set -euo pipefail
          temp="$RUNNER_TEMP"
          if [[ "$GITHUB_REF_NAME" == v30b-fixed-snapshot-verification-expansion ]]; then
            REFERENCE_OFFSET="${REFERENCE_OFFSET:-25}"
          fi
          args=()
          if [[ -n "$REFERENCE_OFFSET" ]]; then
            args+=(--reference-offset "$REFERENCE_OFFSET")
          fi
          for attempt in 1 2; do
            if python v3_historical_annual_receipt_recovery.py --live "${args[@]}" "$temp/historical-prices.parquet" "$temp/historical-financial-pin.json" "$temp/historical-catalog-pin.json" > "$temp/historical-annual-receipt-recovery.json"; then
              break
            fi
            if [[ "$attempt" == 2 ]] || ! jq -e '.provider_or_contract_failure == "Official API transport failed (request details suppressed)"' "$temp/historical-annual-receipt-recovery.json" >/dev/null; then
              exit 1
            fi
            sleep 30
          done
      - name: Report recovery counts
        if: always()
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/historical-annual-receipt-recovery.json"
          if [[ ! -s "$result" ]]; then exit 0; fi
          jq 'del(.records)' "$result" >> "$GITHUB_STEP_SUMMARY"
          jq -c 'del(.records)' "$result"
      - name: Retain dated receipt identities and archive hashes only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-annual-receipt-recovery-${{ matrix.offset || inputs.reference_offset || 'default' }}
          path: ${{ runner.temp }}/historical-annual-receipt-recovery.json
          if-no-files-found: ignore
          retention-days: 90
