name: One-time actual KRX derived 40-session backfill proof
on:
  push:
    branches: [v3-krx-derived-five-session-live-20261020]
    paths:
      - .github/workflows/v3-krx-40-session-once.yml
permissions:
  contents: read
concurrency:
  group: v3-krx-private-derived-history
  cancel-in-progress: false
jobs:
  eight:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-krx-derived-five-session-live-20261020
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimum HTTP/XKRX packages
        run: python -m pip install 'requests>=2.31,<3' 'exchange-calendars==4.13.1'
      - name: Verify synthetic private derived history tests
        run: |
          python -m unittest discover -s tests -p 'test_v3_krx_derived_backfill.py' -v
          python -m unittest discover -s tests -p 'test_v3_krx_derived_5day.py' -v
      - name: Advance at most 8 genuine KRX historical 5-session research windows
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
          V3_DERIVED_BATCH_WINDOWS: "8"
        run: |
          set -euo pipefail
          python v3_krx_derived_backfill.py
