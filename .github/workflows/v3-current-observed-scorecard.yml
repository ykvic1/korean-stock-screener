name: V3 Current Close All-Listed Observed Partial CSV (live source ceiling)

on:
  push:
    branches: [main]
    paths:
      - v3_current_observed_scorecard.py
      - tests/test_v3_current_observed_scorecard.py
      - v3_current_price_replay.py
      - v3_observed_momentum.py
      - v3_volume_participation.py
      - docs/data.json
      - docs/v22-market-catalog.json
      - docs/v3-volume-obv-observed.json
      - docs/v3-current-price-technical-momentum.json
      - docs/v3-dart-bulk-history.json
      - docs/v3-dart-bulk-provisional.json
      - docs/v3-dart-book-reference.json
      - docs/v3-real-source-six-area-coverage.json
      - docs/v3-dart-cashflow-reference.json
      - docs/v3-dart-fcf-research-preview.json
      - .github/workflows/v3-current-observed-scorecard.yml
  schedule:
    # Read-only saved-source replay: at :11, after preceding hourly :29 DART
    # 4Y batch and before the :17 rolling annual-book publication window.
    # Avoid :26, which sampled a newer book before its provisional score replay.
    - cron: '11 * * * *'
  # Replay immediately after a completed official DART 4Y/FCF collector;
  # source commits from GITHUB_TOKEN do not activate normal push triggers.
  workflow_run:
    workflows:
      - V3 Actual DART 3Y Cashflow and CAPEX (strict source-only pilot)
      - V3 Bulk OpenDART Four-Year Listed History (100 issuers per request)
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        options: [verify, write]
        default: verify

permissions:
  contents: write

concurrency:
  group: korea-stock-screener-current-observed-publisher
  cancel-in-progress: false

jobs:
  same-close-current-price-only:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing offline source computation dependencies
        run: pip install -r requirements.txt
      - name: Reject mismatched source evidence and missing=0 before publication
        run: |
          set -euo pipefail
          python -m py_compile v3_observed_momentum.py v3_current_price_replay.py v3_current_observed_scorecard.py
          python -m unittest discover -s tests -p 'test_v3_current_observed_scorecard.py' -v
      - name: Recompute only actually observed current-close evidence
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'write' }}
        run: |
          set -euo pipefail
          # Recompute both independently stored source products if available;
          # source quality always rechecked against the current market census.
          python v3_current_observed_scorecard.py --mode write --refresh-derived
      - name: Publish current-day CSV and aggregate evidence counts only
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'write' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v3-current-observed-all-listed.csv docs/v3-current-observed-all-listed-summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish actual closing market price+DART receipt-checked partial CSV"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              python v3_current_observed_scorecard.py --mode write --refresh-derived
              git add docs/v3-current-observed-all-listed.csv docs/v3-current-observed-all-listed-summary.json
              if ! git diff --cached --quiet; then
                git commit --amend --no-edit
              fi
              python v3_current_observed_scorecard.py --mode verify --refresh-derived
              if git push origin HEAD:main; then
                echo "current_close_research_csv_published"
                break
              fi
              if [[ "$attempt" == 3 ]]; then
                echo "::error::current_close_publication_retries_exhausted"
                exit 1
              fi
            done
          fi
      - name: Manual read-only consistency verification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'verify' }}
        run: python v3_current_observed_scorecard.py --mode verify --refresh-derived
      - name: Display source-specific observed count, not investment grades
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path("docs/v3-current-observed-all-listed-summary.json")
          lines=[
            "### V3 당일 기준 전종목 실측 잠정 CSV",
            "출처가 확인된 BS/IS, 매출/시총, 동일 영수증 FCF만 관측 배점에 반영. 부채비율·영업자산수익성의 시장 내 비교는 업종중립이 아니며 미확인 항목은 결측.",
            "완성 100점 투자 인증은 0개. 매수·기관 순매수 추정이 아님.",
          ]
          if path.exists():
              a=json.loads(path.read_text(encoding="utf8"))
              lines.extend([
                "실제 가격일: "+str(a["asof"]),
                "전종목: "+str(a["listed_total"]),
                "한개 이상 관측: "+str(a["observed_any_factor_issuers"]),
                "영역별 관측종목: "+str(a["observed_issuer_counts"]),
                "현재 관측 가능 최대배점: "+str(a["highest_currently_observable_weight"])+"/100",
                "DART FY 근거 상태: "+a["fiscal_reference_join_status"],
                "영수증 검증 FCF상태: "+a["fcf_reference_join_status"],
                "FCF 추가 배점 관측 종목: "+str(a["fcf_observed_issuer_counts"]),
                "영역별 근거 전무 종목 수: "+str(a["unacquired_area_issuer_counts"]),
                "영역별 일부 근거만 확보한 종목 수: "+str(a["partial_area_issuer_counts"]),
                "전종목 미확보 소스 가중치 합: "+str(a["total_unacquired_weight_issuer_slots"])+" (점수 0 처리 아님)",
              ])
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(lines)+"\n",encoding="utf8")
          PY
