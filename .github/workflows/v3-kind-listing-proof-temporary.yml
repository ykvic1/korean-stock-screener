name: KRX KIND listing source proof
on:
  push:
    branches: [v30b-kind-listing-proof-20261119]
    paths: [.github/workflows/v3-kind-listing-proof-temporary.yml]
permissions:
  contents: read
jobs:
  public-notices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Inspect the four listing notices and the bonus issue ex-rights notice
        run: |
          python - <<'PY'
          import json
          import re
          from urllib.parse import urljoin, urlencode
          from bs4 import BeautifulSoup
          import requests

          root = 'https://kind.krx.co.kr'
          url = root + '/corpgeneral/stockissuelist.do'
          date = '2026-11-19'
          expected = {
              '01006': (18670232, 18596072),
              '09669': (4022842, 4372204),
              '11767': (6661742, 13323484),
              '12712': (37421032, 37423344),
          }
          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0', 'Referer': url + '?method=loadInitPage'})
          session.get(url, params={'method': 'loadInitPage'}, timeout=15).raise_for_status()
          response = session.post(url, data={
              'method': 'searchStockIssueList', 'forward': 'searchStockIssueList',
              'fromDate': date, 'toDate': date, 'marketType': 'all',
              'pageIndex': '1', 'currentPageSize': '50',
              'orderMode': '1', 'orderStat': 'D',
          }, timeout=20)
          response.raise_for_status()
          soup = BeautifulSoup(response.content, 'html.parser')
          found = set()
          for row in soup.select('tr[onclick]'):
              notice = re.search(r"fnDetailView\(\s*['\"](\d{14})", row['onclick'])
              cells = row.find_all('td')
              if not notice or len(cells) < 6:
                  continue
              company = next((re.search(r"companysummary_open\(\s*['\"]([A-Za-z0-9]{5})", link['onclick'])
                              for link in cells[0].select('a[onclick]')
                              if 'companysummary_open' in link['onclick']), None)
              if not company or company[1] not in expected:
                  continue
              code, receipt = company[1], notice[1]
              values = [cell.get_text(' ', strip=True) for cell in cells[:6]]
              if values[1].replace('.', '-').replace('/', '-') != date:
                  continue
              found.add(code)
              params = {'method': 'searchStockIssueDetail', 'forward': 'searchStockIssueDetail',
                        'bzProcsNo': receipt, 'contnId': receipt}
              detail = session.get(url, params=params, timeout=15)
              detail.raise_for_status()
              page = BeautifulSoup(detail.content, 'html.parser')
              tables = []
              for detail_row in page.select('tr'):
                  cols = [c.get_text(' ', strip=True) for c in detail_row.find_all(['td', 'th'], recursive=False)]
                  if cols and len(' '.join(cols)) < 350 and any(x in ' '.join(cols) for x in (
                          '상장', '보통주', '발행', '변경', '소각', '전환', '증자', '배정', '기준일')):
                      tables.append(cols)
              print(json.dumps({'kind_company': code, 'listing': values, 'notice': url + '?' + urlencode(params),
                                'detail_tables': tables[:24]}, ensure_ascii=False))
          print('issuance_table_matched=' + ','.join(sorted(found)))
          viewer = root + '/common/disclsviewer.do'
          for receipt in ('20261116001893', '20261020000760', '20261007000162'):
              shell = session.get(viewer, params={'method': 'search', 'acptno': receipt}, timeout=15)
              shell.raise_for_status()
              selects = BeautifulSoup(shell.content, 'html.parser').select('#mainDoc option[value]')
              for option in selects[:1]:
                  doc = option['value'].strip()
                  if not re.fullmatch(r'\d{14}', doc):
                      continue
                  inner = session.get(viewer, params={'method': 'searchContents', 'docNo': doc}, timeout=15)
                  inner.raise_for_status()
                  candidates = re.findall(r"(/external/\d{4}/\d{2}/\d{2}/\d{6}/\d{14}/\d{5}\.htm)", inner.text)
                  if candidates:
                      body_url = urljoin(root, candidates[0])
                      raw = session.get(body_url, timeout=15)
                      raw.raise_for_status()
                      page = BeautifulSoup(raw.content, 'html.parser')
                      cells = [r.get_text(' ', strip=True) for r in page.select('tr')]
                      cells = [r for r in cells if len(r) < 300 and any(x in r for x in (
                          '기준가', '권리락', '상장일', '보통주', '배정기준일', '당 신주'))]
                      print(json.dumps({'receipt': receipt, 'url': body_url, 'terms': cells[:22]},
                                       ensure_ascii=False))
                  else:
                      print(json.dumps({'receipt': receipt, 'doc': doc, 'body_unresolved': True}))
          PY
