name: V3 DART XBRL Original-File Structural Evidence Pilot

on:
  push:
    branches: [main]
    paths:
      - v3_dart_xbrl_capex_pilot.py
      - tests/test_v3_dart_xbrl_capex_pilot.py
      - .github/workflows/v3-dart-xbrl-capex-pilot.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "Evidence only; never write fact amounts or investment scores"
        type: choice
        required: true
        default: dry-run
        options: [dry-run, live]
      cohort_index:
        description: "Research cohort number for a reproducible manual sample (0..1000000)"
        type: number
        required: true
        default: 0

permissions:
  contents: read

concurrency:
  group: korea-stock-screener-dart-xbrl-evidence-pilot
  cancel-in-progress: false

jobs:
  inspect-original-xbrl-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline regression tests for source receipt, ZIP and structural tags
        run: |
          set -euo pipefail
          python -m py_compile v3_dart_xbrl_capex_pilot.py
          python -m unittest discover -s tests -p 'test_v3_dart_xbrl_capex_pilot.py' -v
      - name: Install official HTTP client only for live mode
        if: ${{ github.event_name == 'push' || inputs.mode == 'live' }}
        run: python -m pip install 'requests>=2.31,<3'
      - name: Probe up to four already-verified annual filing receipts
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          MODE: ${{ github.event_name == 'push' && 'live' || inputs.mode }}
          COHORT_INDEX: ${{ github.event_name == 'push' && github.run_number || inputs.cohort_index }}
        run: |
          set -euo pipefail
          python v3_dart_xbrl_capex_pilot.py --mode "$MODE" --limit 4 --cohort-index "$COHORT_INDEX" | tee /tmp/v3-xbrl-evidence-counts.json
      - name: Report anonymous aggregate-only structure evidence
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          source = Path('/tmp/v3-xbrl-evidence-counts.json')
          labels = (
              ('source_readiness', '원천 일치 상태'),
              ('sample_cohort_mode', '표본 순환 방식'),
              ('sample_cohort_index', '재현 가능한 표본 회차'),
              ('sample_cohort_distinct_issuers', '서로 다른 표본 기업 수'),
              ('sample_fiscal_year_counts', '표본 회계연도별 건수(익명)'),
              ('eligible_sampled_issuer_years', '조사 표본 기업·연도'),
              ('provider_xbrl_file_calls', '공식 XBRL 원본파일 API 호출'),
              ('valid_zip_files', '유효한 원본 ZIP'),
              ('no_original_file', '공식 원본파일 없음'),
              ('xbrl_instances_detected', 'XBRL instance 파일'),
              ('reports_with_ifrs_cfo_tag_candidate', '영업현금흐름 IFRS 태그가 확인된 보고서'),
              ('reports_with_ifrs_ppe_tag_candidate', '유형자산 CAPEX IFRS 태그가 확인된 보고서'),
              ('reports_with_ifrs_intangible_tag_candidate', '무형자산 CAPEX IFRS 태그가 확인된 보고서'),
              ('reports_with_any_missing_source_tag', '기존 누락항목의 태그 후보가 있는 보고서'),
              ('reports_with_missing_annual_krw_candidate', '기존 누락항목의 해당연도·원화 숫자 후보가 있는 보고서'),
              ('local_taxonomy_schema_files', 'ZIP 내부 XBRL 스키마 파일 수'),
              ('local_label_linkbase_files', 'ZIP 내부 계정명 연결자료 파일 수'),
              ('local_presentation_link_count', 'ZIP 내부 표시계층 링크 수'),
              ('exact_extension_label_schema_leads', '정확 계정명과 ZIP 내부 스키마가 연결된 후보 태그 수'),
              ('reports_with_extension_ppe_label_fact', '유형자산 취득 확장 태그를 실제로 포함한 보고서 수'),
              ('reports_with_extension_intangible_label_fact', '무형자산 취득 확장 태그를 실제로 포함한 보고서 수'),
              ('reports_with_extension_ppe_annual_krw_candidate', '유형자산 확장 태그 해당연도·KRW 후보(범위 미확인)'),
              ('reports_with_extension_intangible_annual_krw_candidate', '무형자산 확장 태그 해당연도·KRW 후보(범위 미확인)'),
          )
          lines = [
              '### DART XBRL 원본파일 구조 조사(최대 4건)',
              '기존 공시 접수번호와 일치하는 사업보고서의 원본 XBRL만 조사합니다.',
              '태그 및 해당연도·KRW 숫자 후보를 조사하나 연결/별도 재무제표 범위 검증은 완료되지 않았습니다.',
              '원본 공시·기업 식별자·접수번호·금액 공개 및 FCF/점수 계산 없음.',
              '정확한 한국어 계정명↔내부 스키마↔XBRL 사실 태그 연결은 조사 후보일 뿐, 영업현금흐름 범위·CAPEX 총액·점수 검증 아님.',
          ]
          reason_labels = (
              ('original_file_absent', '원본 XBRL 없음'),
              ('ifrs_tag_missing', 'IFRS 태그 없음'),
              ('annual_context_missing', '해당연도 비차원 기간 문맥 없음'),
              ('krw_unit_missing', '해당연도 문맥의 KRW 단위 없음'),
              ('numeric_fact_invalid', '숫자·부호·nil 조건 불충족'),
              ('numeric_values_ambiguous', 'XBRL 파일 간 숫자 후보 불일치'),
              ('candidate_scope_unverified', '연도·KRW 후보 있음(연결/별도 미확인)'),
          )
          report = None
          if source.is_file() and source.stat().st_size:
              try:
                  report = json.loads(source.read_text(encoding='utf8'))
              except (ValueError, OSError):
                  pass
          if type(report) is dict:
              for key, label in labels:
                  lines.append('- ' + label + ': **' + str(report.get(key, '미확인')) + '**')
              reason_counts = report.get('missing_source_fact_reasons', {})
              lines.append('#### 누락 계정 단위 원인별 분류(보고서 수와 다름)')
              lines.append('- 검사한 누락 계정 종류 수: **' +
                           str(report.get('checked_missing_source_fact_kinds', '미확인')) + '**')
              for key, label in reason_labels:
                  lines.append('- ' + label + ': **' +
                               str(reason_counts.get(key, '미확인')) + '**')
              # Count only the two-stage "annual_context_missing" cases;
              # never leak source context IDs, company names, years or amounts.
              context_labels = (
                  ('dimensional_target_year', '해당연도 기간이나 차원·세그먼트가 붙은 문맥'),
                  ('alternate_fiscal_twelve_months', '해당연도 종료 비달력 12개월 문맥'),
                  ('comparative_annual_period', '이전연도 비교자료 문맥'),
                  ('short_current_period', '해당연도 단기·분기 문맥'),
                  ('other_period', '그 외 기간 문맥'),
                  ('unresolved_or_instant', '기간 확인 불가·문맥 미연결'),
              )
              extension_counts = report.get('extension_candidate_validation_reasons', {})
              lines.append('#### 원본 확장 계정 후보의 연간 원화 검증 단계(후보이며 점수 반영 없음)')
              for key, label in (
                  ('multiple_extension_concepts', '복수 태그로 총액 불명확'),
                  ('annual_context_missing', '해당연도 문맥 미검증'),
                  ('krw_unit_missing', 'KRW 단위 미검증'),
                  ('numeric_fact_invalid', '숫자·부호 검증 실패'),
                  ('numeric_values_ambiguous', '원본 숫자 후보 불일치'),
                  ('candidate_scope_unverified', '해당연도·KRW 일치, 연결/별도 범위 미검증')):
                  lines.append('- ' + label + ': **' +
                               str(extension_counts.get(key, '미확인')) + '**')
              context_counts = report.get('annual_context_gap_subreasons', {})
              lines.append('#### IFRS 표준 계정의 연간 문맥 누락 원인(후보 금액 인정 아님)')
              for key, label in context_labels:
                  lines.append('- ' + label + ': **' +
                               str(context_counts.get(key, '미확인')) + '**')
              extension_context_counts = report.get(
                  'extension_annual_context_gap_subreasons', {})
              lines.append('#### XBRL 확장 계정의 연간 문맥 누락 원인(후보 금액 인정 아님)')
              for key, label in context_labels:
                  lines.append('- ' + label + ': **' +
                               str(extension_context_counts.get(key, '미확인')) + '**')
              lines.append('#### 해당연도 확장 계정 차원 구조(연결/별도 미인증)')
              dimensions = report.get('extension_target_year_dimension_shapes', {})
              for key, label in (
                  ('typed_member_present', 'typedMember 포함'),
                  ('multiple_explicit_members', '복수 explicitMember'),
                  ('single_explicit_member', '단일 explicitMember'),
                  ('nonstandard_segment_content', '비표준 세그먼트 요소'),
                  ('dimension_structure_unknown', '차원 구조 미확인')):
                  lines.append('- ' + label + ': **' +
                               str(dimensions.get(key, '미확인')) + '**')
              lines.append('#### 차원 CAPEX와 IFRS CFO의 동일 문맥 교집합(회계범위 미확인)')
              overlap = report.get('extension_target_year_ifrs_cfo_context_overlap', {})
              for key, label in (
                  ('shared', '동일 XBRL 파일·연도·차원 문맥 공유'),
                  ('not_shared', '동일 차원 문맥 미공유')):
                  lines.append('- ' + label + ': **' +
                               str(overlap.get(key, '미확인')) + '**')
              lines.append('문맥 공유 여부만 비교하며, 금액·현금흐름표 소속·연결/별도 범위 또는 점수 인증은 하지 않습니다.')
              lines.append('#### IFRS 연결·별도 차원 QName 단서(후보이며 회계범위 미인증)')
              scope_hints = report.get('extension_target_year_ifrs_scope_hints', {})
              for key, label in (
                  ('ifrs_consolidated_member_hint', 'IFRS 연결 구성원 QName 단서'),
                  ('ifrs_separate_member_hint', 'IFRS 별도 구성원 QName 단서'),
                  ('ifrs_scope_axis_other_member', 'IFRS 범위 차원이나 미확인 구성원'),
                  ('other_axis_member', '다른 차원·구성원'),
                  ('unresolved_qname', '이름공간 확인 불가'),
                  ('conflicting_context_hints', '동일 후보의 상충 단서'),
                  ('not_single_explicit_member', '단일 명시적 구성원 아님')):
                  lines.append('- ' + label + ': **' +
                               str(scope_hints.get(key, '미확인')) + '**')
              lines.append('QName 단서는 정식 DTS 차원 검증·현금흐름표 주석 대조·연결범위 증명이 아닙니다.')
              lines.append('#### CAPEX 확장 태그의 로컬 표시계층 구조(총액/점수 미인증)')
              shapes = report.get('extension_local_presentation_shapes', {})
              for key, label in (
                  ('no_local_presentation_link', 'ZIP 내부 표시계층 연결자료 없음'),
                  ('concept_not_in_local_presentation', '해당 계정 태그를 로컬 계층에서 못 찾음'),
                  ('locator_only_no_parent_child_arc', '계정 참조만 있고 상하 관계 없음'),
                  ('child_only_in_local_role', '동일 표시 역할에서 자식으로 연결'),
                  ('parent_only_in_local_role', '동일 표시 역할에서 부모로 연결'),
                  ('parent_and_child_in_local_role', '동일 역할에서 부모·자식 모두'),
                  ('multiple_roles_unverified', '복수 역할에 분산되어 미확정')):
                  lines.append('- ' + label + ': **' +
                               str(shapes.get(key, '미확인')) + '**')
              lines.append('표시계층 관계는 금액 합산 관계 또는 전체 CAPEX 여부, 연결/별도 범위, 과거 시점 사용 가능성의 증거가 아닙니다.')

              lines.append('#### CAPEX 확장 태그 로컬 계산계층(금액·총액·점수 미인증)')
              lines.append('- ZIP 내부 계산계층 링크 수: **' +
                           str(report.get('local_calculation_link_count', '미확인')) + '**')
              calc_shapes = report.get('extension_local_calculation_shapes', {})
              for key, label in (
                  ('no_local_calculation_link', 'ZIP 내부 계산 링크 없음'),
                  ('concept_not_in_local_calculation', '계산링크 내 해당 CAPEX 계정 참조 없음'),
                  ('locator_only_no_summation_arc', '계정 참조만 있고 합산 연결 없음'),
                  ('summation_child_positive_single_role', '단일 역할 양수 가중치 하위 항목'),
                  ('summation_child_negative_single_role', '단일 역할 음수 가중치 하위 항목'),
                  ('summation_parent_single_role', '단일 역할 합산 상위 항목'),
                  ('nonunit_or_invalid_weight_unverified', '비단위/잘못된 가중치로 미확인'),
                  ('mixed_directions_unverified', '상하 관계나 가중치 혼재'),
                  ('multiple_roles_unverified', '복수 역할로 미확정'),
                  ('multiple_extension_concepts_unverified', '복수 계정 태그로 미확정')):
                  lines.append('- ' + label + ': **' +
                               str(calc_shapes.get(key, '미확인')) + '**')
              lines.append('계산 간선 존재만으로 누락·중복 없는 취득총액, 재무제표 본문, 연결범위, PIT 또는 점수 인정을 할 수 없습니다.')
          else:
              lines.append('- 유효한 조사 결과 없음: 소스 검증 또는 원천 응답 실패. 해당 단계 로그를 확인하세요.')
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(
              '\n'.join(lines) + '\n', encoding='utf8')
          PY
