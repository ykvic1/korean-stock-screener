name: V3 Original XBRL Scope-Anchored Cashflow Recovery
on:
  pull_request:
    paths:
      - v3_dart_xbrl_cashflow_recovery.py
      - tests/test_v3_dart_xbrl_cashflow_recovery.py
      - .github/workflows/v3-xbrl-cashflow-recovery.yml
  push:
    branches: [main]
    paths:
      - v3_dart_xbrl_cashflow_recovery.py
      - .github/workflows/v3-xbrl-cashflow-recovery.yml
  workflow_dispatch:
    inputs:
      recheck_equivalent_contexts:
        description: 'One-time recheck of old v1 no-result records after explicit annual context equivalence fix'
        type: boolean
        default: false
      remaining_batches:
        description: 'Maximum sequential batches including this run (1 to 3)'
        type: number
        default: 3
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m unittest discover -s tests -p 'test_v3_dart_xbrl_cashflow_recovery.py' -v
          python -m unittest discover -s tests -p 'test_v3_xbrl_gap_sampling.py' -v
          python -m unittest discover -s tests -p 'test_v3_dart_cashflow*py' -v
          python v3_dart_xbrl_cashflow_recovery.py --mode dry-run --limit 16
  recover:
    needs: offline
    # Two live batches recovered no additional facts. Keep this low-yield
    # route available explicitly, without launching broad retries on code edits.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    concurrency:
      # Share the existing CF writer lock; no concurrent ledger overwrite.
      group: korea-stock-screener-dart-cashflow
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: .cache/v3-dart-company-codes.json
          key: v3-dart-corp-map-v1-${{ hashFiles('docs/v22-market-catalog.json') }}
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Recover only original IFRS facts with independent identity and CFO anchors
        id: collect
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          RECHECK_EQUIVALENT_CONTEXTS: ${{ inputs.recheck_equivalent_contexts }}
          REMAINING_BATCHES: ${{ inputs.remaining_batches }}
        run: |
          set -euo pipefail
          case "$REMAINING_BATCHES" in 1|2|3) ;; *) echo 'invalid_cashflow_batch_budget'; exit 1 ;; esac
          python -c 'import json; print(json.load(open("docs/v22-market-catalog.json"))["date"])' > "$RUNNER_TEMP/cashflow-source-date"
          interrupted=0
          extra_args=()
          if [[ "${RECHECK_EQUIVALENT_CONTEXTS:-false}" == 'true' ]]; then
            extra_args+=(--recheck-equivalent-contexts)
          fi
          # Cohort 20 was independently surveyed by the structural pilot;
          # two missing facts had target-year dimensional contexts. Recheck
          # those receipts first, without bypassing the stronger verifier.
          # One authorized manual run may cover up to 32 independently
          # receipt-checked issuer-years, 90-point candidates first. The
          # collector retains its six-minute source deadline and per-year
          # verified checkpoints; it does not infer missing CAPEX or scores.
          if ! python v3_dart_xbrl_cashflow_recovery.py --mode live --limit 32 --structural-cohort-index 20 "${extra_args[@]}" | tee "$RUNNER_TEMP/cashflow-batch-result.json"; then interrupted=1; fi
          echo "interrupted=$interrupted" >> "$GITHUB_OUTPUT"
      - name: Verify and publish derived observations before reporting any interruption
        id: publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python v3_dart_cashflow_enrichment.py --mode rebind
          python v3_dart_cashflow_factor_preview.py --mode write
          python v3_dart_cashflow_gap_audit.py --mode write --issuer-out docs/v3-dart-cashflow-issuer-evidence.json
          git add docs/v3-dart-cashflow-reference.json docs/v3-dart-fcf-research-preview.json docs/v3-dart-cashflow-gap-summary.json docs/v3-dart-cashflow-issuer-evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Recover independently anchored original annual XBRL cashflow facts'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            python v3_dart_cashflow_enrichment.py --mode rebind
            python v3_dart_cashflow_factor_preview.py --mode write
            python v3_dart_cashflow_gap_audit.py --mode write --issuer-out docs/v3-dart-cashflow-issuer-evidence.json
            git add docs/v3-dart-cashflow-reference.json docs/v3-dart-fcf-research-preview.json docs/v3-dart-cashflow-gap-summary.json docs/v3-dart-cashflow-issuer-evidence.json
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
            python v3_dart_cashflow_enrichment.py --mode verify
            python v3_dart_cashflow_factor_preview.py --mode verify
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo '::error::verified_xbrl_cashflow_push_retries_exhausted'
          exit 1
      - name: Compare the verified publication with its rebased parent
        if: steps.publish.outputs.changed == 'true'
        id: replay
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          from v3_dart_reported_capex_total import requires_score_replay

          def read(ref, path):
              return json.loads(subprocess.check_output(["git", "show", f"{ref}:docs/{path}"]))

          ledger = "v3-dart-cashflow-reference.json"
          preview = "v3-dart-fcf-research-preview.json"
          try:
              required = requires_score_replay(
                  read("HEAD^", ledger), read("HEAD", ledger),
                  read("HEAD^", preview), read("HEAD", preview),
                  original_xbrl=True,
              )
          except (subprocess.CalledProcessError, ValueError, KeyError, TypeError, AttributeError):
              # A missing or unreadable parent cannot prove a review-only change.
              required = True
          print(json.dumps({"fcf_score_replay_required": required}))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"required={str(required).lower()}\n")
          PY
      - name: Replay validated current observations even after a partial collection
        if: steps.replay.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/v3-current-observed-scorecard.yml/dispatches" -f ref=main -f 'inputs[mode]=write' --silent
      - name: Continue a bounded unreviewed queue only after verified progress
        if: steps.collect.outputs.interrupted == '0' && steps.publish.outputs.changed == 'true' && steps.replay.outputs.required == 'false' && !inputs.recheck_equivalent_contexts && inputs.remaining_batches > 1
        env:
          GH_TOKEN: ${{ github.token }}
          REMAINING_BATCHES: ${{ inputs.remaining_batches }}
        run: |
          set -euo pipefail
          case "$REMAINING_BATCHES" in 2|3) ;; *) exit 1 ;; esac
          python v3_dart_xbrl_cashflow_recovery.py --mode dry-run --limit 1 > "$RUNNER_TEMP/cashflow-next-plan.json"
          ready="$(python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          before = json.loads((root / "cashflow-batch-result.json").read_text())
          after = json.loads((root / "cashflow-next-plan.json").read_text())
          day = json.loads(Path("docs/v22-market-catalog.json").read_text())["date"]
          old = before["saved_original_queue"]["unreviewed_issuer_years"]
          new = after["saved_original_queue"]["unreviewed_issuer_years"]
          ready = (day == (root / "cashflow-source-date").read_text().strip()
                   and before["completed"] > 0 and 0 < new < old
                   and after["provider_calls"] == 0 and after["selected_issuer_years"] == 1)
          print(str(ready).lower())
          PY
          )"
          if [[ "$ready" != true ]]; then
            echo 'No verified further queue progress; stop this burst.'
            exit 0
          fi
          # Avoid overlapping an independently requested run; shared writer
          # concurrency also serializes this finite continuation.
          pending="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow v3-xbrl-cashflow-recovery.yml --limit 20 --json databaseId,status --jq '[.[] | select(.databaseId != (env.GITHUB_RUN_ID | tonumber) and .status != "completed")] | length')"
          if [[ "$pending" != 0 ]]; then
            echo 'Another recovery is already pending; stop this burst.'
            exit 0
          fi
          gh workflow run v3-xbrl-cashflow-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main -f recheck_equivalent_contexts=false -f "remaining_batches=$((REMAINING_BATCHES-1))"
      - name: Surface source interruption after preserving validated observations
        if: steps.collect.outputs.interrupted == '1'
        run: exit 1
