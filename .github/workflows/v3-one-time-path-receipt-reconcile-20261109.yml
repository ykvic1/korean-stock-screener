name: V3 One-Time Published Path Receipt Reconciliation 2026-11-09

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: korea-stock-screener-publication
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate the 153 already recovered dated paths before correcting only source counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from v3_unscored_path_observations import valid_observation, valid_unavailable_reason
          p = Path("docs/data.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          s = d["v3_unscored_path_source"]
          if (d["date"] != "2026-11-09" or d["candidate_count"] != 2375 or
              (s["observed_issuer_count"], s["unavailable_issuer_count"]) != (2108, 267)):
              raise SystemExit("unexpected_original_receipt_or_market_date")
          observed = 0
          for row in d["stocks"]:
              evidence = row["v3_unscored_path_observations"]
              reason = row["v3_unscored_path_unavailable_reason"]
              if (row["price_date"] != d["date"] or
                  not valid_observation(evidence, d["date"]) or
                  not valid_unavailable_reason(evidence, reason)):
                  raise SystemExit("unverified_saved_issuer_evidence")
              observed += evidence is not None
          if len(d["stocks"]) != 2375 or observed != 2261 or observed-2108 != 153:
              raise SystemExit("recovery_delta_not_exactly_153")
          s["observed_issuer_count"] = observed
          s["unavailable_issuer_count"] = len(d["stocks"]) - observed
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2, allow_nan=False), encoding="utf-8")
          print(json.dumps({"reconciled":True,"new_paths":153,"observed":2261,"unavailable":114}))
          PY
      - name: Validate source and publish exact canonical derived coverage
        run: |
          python v3_unscored_path_coverage.py --daily docs/data.json --output docs/v3-unscored-path-coverage.json
          python v22_full_universe_audit.py --daily docs/data.json
      - name: Publish only rechecked source evidence and coverage
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data.json docs/v3-unscored-path-coverage.json
          git commit -m 'Reconcile 153 previously recovered valid price path source receipts'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Recalculate actual dated operating score availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run v3-current-observed-scorecard.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=write
