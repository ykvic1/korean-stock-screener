name: v3 KRX Five-Day Real Evidence (private transient / manual afterwards)

on:
  # Bootstrap live probe succeeded once in Actions run 39206004718.
  # Manual only from now on. No automatic secret-backed runs.
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry_run=zero API calls; live=exactly five dates x both markets'
        type: choice
        required: true
        default: dry_run
        options: [dry_run, live]

permissions:
  contents: read

concurrency:
  group: v3-krx-5day-bounded-live-evidence
  cancel-in-progress: false

jobs:
  five-day-private-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal official KRX client requirements
        run: python -m pip install 'requests>=2.31,<3'
      - name: Synthetic safety regression before provider calls
        run: python -m unittest discover -s tests -p 'test_v3_krx_first_real_pipeline.py' -v
      - name: KRX live 5 days 2 markets -> private ephemeral archive -> v3 availability
        shell: bash
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          SELECTED_MODE: ${{ inputs.mode }}
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # This workflow never uploads artifacts or modifies public files.
          # The provider API key must never be printed or supplied in args.
          if [[ "$SELECTED_MODE" == "live" ]]; then
            python v3_krx_first_real_pipeline.py --live
          else
            python v3_krx_first_real_pipeline.py
          fi
