name: V3.0b Release Blocker Watch (Read Only)

on:
  push:
    branches: [main]
    paths:
      - v3_v30b_release_gate.py
      - v3_data_collection_closeout.py
      - docs/v3-data-collection-closeout.json
      - v3_operational_publication_audit.py
      - scripts/audit_operational_publication.cjs
      - tests/test_v3_operational_publication_audit.py
      - v3_forward_horizon_readiness.py
      - v3_forward_score_source_audit.py
      - v3_score_observation_capture.py
      - tests/test_v3_forward_score_source_audit.py
      - v3_historical_performance_pilot_audit.py
      - v3_historical_public_paths_audit.py
      - docs/v3-historical-price-paths-20251113.json
      - ops/v3-performance-financial-factor-replay-20251113.json
      - ops/v3-performance-market-coverage-20251113.json
      - ops/v3-performance-market-share-action-replay-20251113.json
      - ops/v3-performance-operating-scope-20251113.json
      - tests/test_v3_historical_performance_pilot_audit.py
      - 'ops/v3-performance-*-20251113.csv'
      - v3_v30b_fcf_source_audit.py
      - tests/test_v3_v30b_release_gate.py
      - tests/test_v3_v30b_readiness_workflow.py
      - .github/workflows/v3-v30b-readiness-audit.yml
      - docs/v3-current-observed-all-listed-summary.json
      - docs/v3-all-listed-scorecard-summary.json
      - v3_all_listed_scorecard.py
      - .github/workflows/v3-all-listed-scorecard.yml
      - docs/v3-dart-historical-receipt-progress.json
      - docs/v3-krx-derived-backfill-progress.json
  pull_request:
    branches: [main]
    paths:
      - v3_v30b_release_gate.py
      - v3_data_collection_closeout.py
      - docs/v3-data-collection-closeout.json
      - v3_operational_publication_audit.py
      - scripts/audit_operational_publication.cjs
      - tests/test_v3_operational_publication_audit.py
      - v3_forward_horizon_readiness.py
      - v3_forward_score_source_audit.py
      - v3_score_observation_capture.py
      - tests/test_v3_forward_score_source_audit.py
      - v3_historical_performance_pilot_audit.py
      - v3_historical_public_paths_audit.py
      - docs/v3-historical-price-paths-20251113.json
      - ops/v3-performance-financial-factor-replay-20251113.json
      - ops/v3-performance-market-coverage-20251113.json
      - ops/v3-performance-market-share-action-replay-20251113.json
      - ops/v3-performance-operating-scope-20251113.json
      - tests/test_v3_historical_performance_pilot_audit.py
      - 'ops/v3-performance-*-20251113.csv'
      - tests/test_v3_v30b_release_gate.py
      - tests/test_v3_v30b_readiness_workflow.py
      - .github/workflows/v3-v30b-readiness-audit.yml
  schedule:
    # 09:23 KST every day. Read-only publication/source coherence watch.
    - cron: '23 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: korea-stock-screener-v30b-readonly-release-watch
  cancel-in-progress: false

jobs:
  release-blockers:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline release-gate and watch contract regressions
        run: |
          set -euo pipefail
          python -m py_compile v3_v30b_release_gate.py v3_v30b_fcf_source_audit.py
          python -m unittest discover -s tests -p 'test_v3_v30b_release_gate.py' -v
          python -m unittest discover -s tests -p 'test_v3_v30b_readiness_workflow.py' -v
          python -m unittest discover -s tests -p 'test_v3_forward_score_source_audit.py' -v
      - name: Audit actual saved publication and source checkpoint
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          # Exit 2 on public summary/source inconsistency, 3 on accidental
          # certification. Do NOT hide either with "|| true".
          python v3_v30b_release_gate.py --assert-blocked > "$RUNNER_TEMP/v30b-readiness-aggregate.json"
      - name: Reconcile operational CSV and actual Pages detail attachment
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          after_commit="$(python -c 'from v3_operational_publication_audit import FAILED_REFRESH; print(FAILED_REFRESH["after_commit"])')"
          git fetch --no-tags --depth=2 --filter=blob:none origin "$after_commit"
          python v3_operational_publication_audit.py --verify-failed-refresh --out "$RUNNER_TEMP/v30b-operational-publication.json"
      - name: Retain operational acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v30b-operational-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/v30b-operational-publication.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Rebuild recent forward score observations from pinned Git sources
        if: ${{ github.event_name != 'pull_request' && !cancelled() }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/v30b-forward-score-sources.json"
          python v3_forward_score_source_audit.py > "$report.tmp"
          mv "$report.tmp" "$report"
      - name: Retain rebuilt forward score source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v30b-forward-score-sources-${{ github.run_id }}
          path: ${{ runner.temp }}/v30b-forward-score-sources.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Reconcile saved historical delisting pilot
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python v3_historical_performance_pilot_audit.py > "$RUNNER_TEMP/v30b-historical-pilot.json"
      - name: Reconcile historical price paths published to the screener
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python v3_historical_public_paths_audit.py > "$RUNNER_TEMP/v30b-historical-public-paths-tmp.json"
          mv "$RUNNER_TEMP/v30b-historical-public-paths-tmp.json" "$RUNNER_TEMP/v30b-historical-public-paths.json"
      - name: Retain aggregate historical path reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v30b-historical-public-paths-${{ github.run_id }}
          path: ${{ runner.temp }}/v30b-historical-public-paths.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Show anonymous source and release blockers
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report_path=Path(os.environ["RUNNER_TEMP"])/"v30b-readiness-aggregate.json"
          lines=[
              "### V3.0b 실제 출시 차단 조건 (읽기 전용)",
              "확보배점 분포는 관측 지표입니다. 전 종목 100점 확보는 마감 조건에서 제외합니다.",
          ]
          if os.environ.get("GITHUB_EVENT_NAME")=="pull_request":
              lines.append("- PR 모드: 오프라인 회귀 테스트와 저장된 과거 표본 대조 수행. 운영 게시본 감사와 출시 판정은 main에서 수행합니다.")
          elif not report_path.is_file():
              lines.append("- 감사 실패: 요약 결과 없음. 원본 불일치 또는 실행 오류 점검 필요")
          else:
              try:
                  r=json.loads(report_path.read_text(encoding="utf8"))
                  if r.get("schema")!="v3-v30b-five-area-readiness-audit-0.1":
                      raise ValueError("unexpected_schema")
                  for key,label in (
                      ("asof","공개 가격자료 기준일"),
                      ("public_summary_valid","공개 집계·원천 일관성"),
                      ("public_issuer_csv_reconciled","실제 종목 CSV 일치"),
                      ("public_fcf_issuer_subscores_reconciled","FCF 종목별 산출 재현"),
                      ("listed_total","상장 종목 수"),
                      ("observed_all_five_areas_100weight_count","과거 20/25/20/20/15 모델 100점 근거(운영 모델과 구분)"),
                      ("r1d_operational_publication_reconciled","현 운영 모델 전종목 점수·배점 재계산 일치"),
                      ("r1d_100weight_observed_count","현 운영 모델 100/100점 근거 관측(미인증)"),
                      ("r1d_95weight_observed_count","현 운영 모델 95점 이상 근거 관측"),
                      ("r1d_90weight_observed_count","현 운영 모델 90점 이상 근거 관측"),
                      ("r1d_same_market_day_and_roster","현 운영 모델과 가격자료 기준일·종목수 일치"),
                      ("all_listed_full_coverage_required","전 종목 100점 확보 요구"),
                      ("initial_data_collection_complete","결측 제외 초기 데이터 수집 완료"),
                      ("data_collection_closeout_asof","초기 데이터 수집 마감 기준일"),
                      ("daily_data_refresh_continues","일일 데이터 갱신 유지"),
                      ("dart_historical_receipts_completed_months","과거 공시 접수 수집 완료 월"),
                      ("dart_historical_receipts_remaining_months","과거 공시 접수 남은 월"),
                      ("historical_fixed_window_extracted","KRX 연구용 파생 구간 수집"),
                      ("v30b_release_ready","정식 출시 허용"),
                      ("confirmed_scoring_authorized","정식 투자점수 허용"),
                      ("investment_grade_certified_count","인증 투자점수 종목"),
                      ("external_provider_calls","원천 공급원 추가 호출")):
                      lines.append("- "+label+": **"+str(r.get(key))+"**")
                  lines.append("#### 미충족/검증 보류 조건")
                  codes=r.get("blocker_codes")
                  if type(codes) is not list or not all(type(x) is str for x in codes):
                      raise ValueError("invalid_blocker_codes")
                  for code in codes:
                      lines.append("- `"+code+"`")
                  if r.get("public_summary_valid") is False:
                      lines.append("공개 자료 불일치는 정상 출시 판정이 아니며 감사 단계는 실패 처리합니다.")
                  lines.append("관측 가능 배점이 100이어도 기업행위·수정주가·시점별 공시·성과검증은 별도 인증 필요.")
              except (ValueError, TypeError, OSError, UnicodeError):
                  lines.append("- 감사 보고서 형식 오류: 확인 필요")
          publication_path=report_path.with_name("v30b-operational-publication.json")
          if publication_path.is_file():
              publication=json.loads(publication_path.read_text(encoding="utf8"))
              incident=publication["failed_refresh_evidence"]
              lines.append("#### 운영 갱신 실패 시 직전 게시본 보존")
              lines.append("- "+incident["status"]+" / 일치 파일 "
                  +str(incident.get("matched_file_count",0))+"개")
              lines.append("- [실제 실패 실행](https://github.com/"+os.environ["GITHUB_REPOSITORY"]
                  +"/actions/runs/"+str(incident["workflow_run_id"])+")")
              for item in publication["remaining_acceptance_evidence"]:
                  lines.append("- 남은 운영 근거 `"+item+"`")
          if os.environ.get("GITHUB_EVENT_NAME") != "pull_request":
              lines.append("#### 저장된 운영 점수의 Git 원본 대조")
              forward_path=report_path.with_name("v30b-forward-score-sources.json")
              try:
                  forward=json.loads(forward_path.read_text(encoding="utf8"))
                  if (forward["schema"] != "v3-forward-score-git-source-audit-1"
                          or forward["historical_source_chain_certified"] is not False
                          or forward["performance_validated"] is not False):
                      raise ValueError("unexpected_forward_score_source_audit")
                  lines.append(
                      f"- 대조한 거래일 {forward['audited_observation_count']} / "
                      f"저장된 거래일 {forward['available_observation_count']} · "
                      f"재현한 종목 관측 {forward['listed_rows_rebuilt']}건 · "
                      f"구조적 참고선 {forward['reference_rows_rebuilt']}건"
                  )
              except (ValueError, TypeError, KeyError, OSError, UnicodeError):
                  lines.append("- 운영 점수의 원본 대조 결과를 확인할 수 없습니다. 감사 단계를 확인하세요.")
          lines.append("#### 과거 상장폐지 1·2·3·6·12개월 표본")
          pilot_path=report_path.with_name("v30b-historical-pilot.json")
          try:
              pilot=json.loads(pilot_path.read_text(encoding="utf8"))
              if (pilot.get("schema")!="v3-historical-delisting-pilot-audit-1"
                      or pilot.get("performance_validated") is not False):
                  raise ValueError("unexpected_pilot_schema")
              lines.extend((
                  "- 평가 종목 / 스팩 제외 상장폐지 종목: "
                  +str(pilot["pilot_issuers"])+" / "+str(pilot["delisted_anchor_non_spac"]),
                  "- 상장폐지 정산·정리매매 근거 수록 종목: "+str(pilot["settlement_register_issuers"]),
                  "- 정리매매 일정 대조 종목: "+str(pilot["liquidation_notice_issuers"]),
                  "- 다음 세션 거래 관측·표본 제외 종목: "
                  +str(pilot["next_session_traded_non_spac_outside_pilot"]),
                  "- 해당 시점 투자점수 및 가격 원천 독립 검증 미완료",
                  "- 분할·병합 등 변경상장 수량 근거: "
                  +str(pilot["share_count_corroborated_actions"])+"건"
                  +" / 합병·교환 교부 경로: "+str(sum(pilot["successor_share_delivery_counts"].values()))+"건",
                  "- 대조한 현금배당 기록: "+str(pilot["dividend_event_rows"])
                  +"건 / 보유 경로 권리 확인: "+str(pilot["dividend_eligible_events"])
                  +"건 / 전체 배당 이력 검증 미완료",
                  "",
                  "- 단주 현금 정산 기준 대조: "+str(pilot["fractional_cash_terms_issuers"])
                  +"종목 / 순차 정산 등 미산출: "+str(len(pilot["fractional_cash_unmodeled_issuers"]))
                  +"종목 / 실제 지급 미확인",
                  "| 개월 | 평가값 있음 | 평가 불가 | 최종 분배금 미확인 | 지급 예정 근거 | 정리매매 가정 | 거래 공백 경로 | 참고선 접촉 | 지급 이력 반영 | 평가일까지 미지급·미확인 | 단주 정산액 가정 |",
                  "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |",
              ))
              for h in ("1","2","3","6","12"):
                  counts=pilot["horizons"][h]
                  lines.append("| "+h+" | "+" | ".join(str(counts[key]) for key in (
                      "with_value","unpriced_valuations","unpriced_final_distributions","scheduled_cash_entitlements",
                      "liquidation_scenarios","paths_with_unpriced_sessions","touch_observed",
                      "price_scenarios_with_reported_dividend_cash",
                      "paths_with_dividend_entitlement_unpaid_or_unverified",
                      "price_scenarios_with_fractional_cash_claim",
                  ))+" |")
              financial=pilot["financial_horizons"]
              lines.extend((
                  "",
                  "- 기준일 이전 연간 재무와 가격 경로 연결: "
                  +str(len(pilot["financial_replay_inputs"]))+"종목",
                  "| 개월 | 가격 평가 | 경로 관측 | 가격 변화 중앙값 (%) | 관측 최대 역행폭 중앙값 (%) | 참고선 접촉 | 경로 공백 |",
                  "| --- | ---: | ---: | ---: | ---: | ---: | ---: |",
              ))
              for h in ("1","2","3","6","12"):
                  row=financial[h]
                  lines.append("| "+h+" | "+" | ".join(
                      "—" if row[key] is None else str(row[key]) for key in (
                          "with_price_evaluation","with_observed_path","median_price_change_pct",
                          "median_observed_adverse_excursion_pct","with_reference_touch","with_path_gaps",
                      )
                  )+" |")
          except (ValueError, TypeError, KeyError, OSError, UnicodeError):
              lines.append("- 과거 표본 감사 실패. 저장 자료 일치와 계산 내역 확인 필요.")
          lines.append("#### 공개 과거 가격 경로 대조")
          paths_path=report_path.with_name("v30b-historical-public-paths.json")
          if paths_path.is_file():
              paths=json.loads(paths_path.read_text(encoding="utf8"))
              month=paths["horizons"]["12"]
              lines.append(f"- 전체 {paths['operating_cohort_count']}종목 · 진입 시가 {paths['observed_entry_count']}종목")
              lines.append(f"- 12개월 평가값 {month['priced']}종목 · 진입 후 미산출 {month['entered_but_unpriced']}종목"
                           f" · 평가값이 있으나 경로 공백 {month['priced_paths_with_gaps']}종목")
              lines.append(f"- 상장폐지 경로 {paths['delisting_paths_reconciled']}건 · "
                           f"기업행위 반영 경로 {paths['reviewed_share_action_paths_reconciled']}건 · "
                           f"재무 세부 경로 {paths['financial_detail_issuers_reconciled']}종목 대조")
          else:
              lines.append("- 공개 경로 감사 결과 없음. 실행 상태를 확인하세요.")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(lines)+"\n",encoding="utf8")
          PY
