name: V3 Prior Annual Original EPS Overlap Research
on:
  pull_request:
    paths:
      - v3_dart_eps_prior_receipt_probe.py
      - tests/test_v3_dart_eps_prior_receipt_probe.py
      - tests/test_v3_eps_prior_context_continuation.py
      - .github/workflows/v3-eps-prior-receipt-probe.yml
  push:
    branches: [main]
    paths:
      - v3_dart_eps_prior_receipt_probe.py
      - .github/workflows/v3-eps-prior-receipt-probe.yml
  workflow_dispatch:
  workflow_run:
    workflows: ['V3 Original XBRL Reported Basic EPS Recovery']
    types: [completed]
permissions:
  contents: read
jobs:
  offline:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m unittest discover -s tests -p 'test_v3_dart_eps_prior_receipt_probe.py' -v
          python -m unittest discover -s tests -p 'test_v3_eps_prior_context_continuation.py' -v
          python -m unittest discover -s tests -p 'test_v3_dart_xbrl_eps_recovery.py' -v
          python v3_dart_eps_prior_receipt_probe.py --mode dry-run --limit 9
  source:
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    permissions:
      contents: write
      actions: write
    concurrency:
      group: v3-prior-annual-eps-research-writer
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: .cache/v3-dart-company-codes.json
          key: v3-dart-corp-map-v1-${{ hashFiles('docs/v22-market-catalog.json') }}
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Verify FY2024 original receipt against same-scope CFO and FY2024 EPS overlap
        id: collect
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          set -euo pipefail
          interrupted=0
          reviewed=0
          if result="$(python v3_dart_eps_prior_receipt_probe.py --mode live --limit 9)"; then
            echo "$result"
            reviewed="$(printf '%s' "$result" | python -c 'import json,sys; print(json.load(sys.stdin)["reviewed"])')"
          else
            echo "$result"
            interrupted=1
          fi
          echo "reviewed=$reviewed" >> "$GITHUB_OUTPUT"
          echo "interrupted=$interrupted" >> "$GITHUB_OUTPUT"
      - name: Publish read-only provenance evidence without changing score or EPS sources
        id: publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/v3-eps-prior-original-receipt-research.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record matched prior annual EPS original-source overlap research'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo '::error::prior_eps_research_push_retries_exhausted'
          exit 1
      - name: Surface source failure after retaining valid research checkpoints
        if: steps.collect.outputs.interrupted == '1'
        run: exit 1
      - name: Check remaining research after successful publication
        id: remaining
        if: steps.collect.outputs.interrupted == '0' && steps.collect.outputs.reviewed != '0' && steps.publish.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python v3_dart_eps_prior_receipt_probe.py --mode dry-run --limit 1 > "$RUNNER_TEMP/prior-eps-remaining.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'prior-eps-remaining.json').read_text())
          pending=data['remaining_source_reviews']
          if type(pending) is not int or pending<0 or data['provider_calls']!=0:
              raise SystemExit('invalid_prior_eps_remaining_plan')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('continue='+str(pending>0).lower()+'\n')
          print(json.dumps({'remaining_source_reviews':pending,'provider_calls':0}))
          PY
      - name: Continue the finite research queue without score promotion
        if: steps.remaining.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/v3-eps-prior-receipt-probe.yml/dispatches" -f ref=main --silent
