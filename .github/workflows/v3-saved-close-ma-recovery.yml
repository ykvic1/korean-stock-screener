name: V3 Saved Close MA Evidence Recovery (90 First)

on:
  push:
    branches: [main]
    paths:
      - v3_ma_slope_transition.py
      - v3_pattern_first_observations.py
  workflow_dispatch:
    inputs:
      repair_legacy_stops:
        description: 'One-time recheck of old stop references invalidated by irrelevant ancient candles'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: korea-stock-screener-publication
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Recover previous published close only, never today's unfinished market
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          REPAIR_LEGACY_STOPS: ${{ inputs.repair_legacy_stops }}
        run: |
          if [ "${REPAIR_LEGACY_STOPS:-false}" = 'true' ]; then
            python v3_saved_close_ma_recovery.py --repair-legacy-stops
          elif [ "${{ github.event_name }}" = 'push' ]; then
            python v3_krx_saved_close_crosscheck.py --mode live
            python v3_saved_close_ma_recovery.py --corroborated-close-only --include-weekly-pattern
            # The crosscheck above was used for this exact input snapshot.
            # Only the derived observations are published by this workflow.
            git restore -- docs/v3-krx-saved-close-crosscheck.json
          else
            python v3_saved_close_ma_recovery.py
          fi
      - name: Audit exact market and calculate genuine added-source count
        id: delta
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/data.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No additional independent MA window found.'
          else
            python v22_full_universe_audit.py --daily docs/data.json
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish validated MA receipts without replacing new close
        if: steps.delta.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data.json
          git commit -m 'Restore validated MA and chart observations from last saved close'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Refresh dated-path audit before recalculating 90/95/100 coverage
        if: steps.delta.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run v3-current-observed-scorecard.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=write
      - name: Recalculate operating coverage from newly published MA receipts
        if: steps.delta.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run v3-operational-research-score.yml --repo "$GITHUB_REPOSITORY" --ref main
