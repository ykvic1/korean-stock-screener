name: V3 Saved Close MA Evidence Recovery (90 First)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: korea-stock-screener-publication
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Recover previous published close only, never today's unfinished market
        run: python v3_saved_close_ma_recovery.py
      - name: Audit exact market and calculate genuine added-source count
        id: delta
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/data.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No additional independent MA window found.'
          else
            python v22_full_universe_audit.py --daily docs/data.json
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish validated MA receipts without replacing new close
        if: steps.delta.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data.json
          git commit -m 'Restore real partial MA observations from last saved close'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Recalculate 90/95/100 observed coverage from published evidence
        if: steps.delta.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run v3-operational-research-score.yml --repo "$GITHUB_REPOSITORY" --ref main
