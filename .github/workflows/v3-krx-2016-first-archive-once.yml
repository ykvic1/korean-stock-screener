name: One-time real 2016 KRX derived-only historical checkpoint

on:
  push:
    branches: [v3-krx-derived-five-session-live-20261020]
    paths:
      - .github/workflows/v3-krx-2016-first-archive-once.yml

permissions:
  contents: read

concurrency:
  group: v3-krx-private-derived-history
  cancel-in-progress: false

jobs:
  first-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-krx-derived-five-session-live-20261020
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install KRX official API and session candidate calendar
        run: python -m pip install 'requests>=2.31,<3' 'exchange-calendars==4.13.1'
      - name: Offline real-shaped historical derived source and no-duplicate tests
        run: |
          python -m py_compile v3_krx_derived_backfill.py
          python -m unittest discover -s tests -p 'test_v3_krx_derived_backfill.py' -v
          python -m unittest discover -s tests -p 'test_v3_krx_derived_5day.py' -v
      - name: Retrieve official 2016 five-session historical derived metrics only
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          V3_PRIVATE_ARCHIVE_REPO: ${{ secrets.V3_PRIVATE_ARCHIVE_REPO }}
          V3_PRIVATE_ARCHIVE_TOKEN: ${{ secrets.V3_PRIVATE_ARCHIVE_TOKEN }}
          V3_DERIVED_BATCH_WINDOWS: "1"
        run: |
          set -euo pipefail
          python v3_krx_derived_backfill.py
